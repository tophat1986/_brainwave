{
  "schema_version": "3.0.0",
  "dna_code": "SAPP",
  "dna_version": "1.3.0",
  "name": "Software Application DNA",
  "description": "Implementation-scope and architecture documentation for AI-built software products and digital services, with an emphasis on web applications.",
  "documentation_label": "software product and architecture documentation",
  "module_contract": {
    "when_relevant": "Use when a concept will be implemented as a software application or digital service and needs an explicit completion boundary plus a production-capable technical foundation.",
    "selection_signals": [
      "The concept includes software behaviour, persistent data, integrations, user accounts, or deployable digital interfaces.",
      "The build needs explicit architecture, security, quality, operational, scale, or continuity decisions.",
      "The confirmed build outcome needs a verifiable implementation scope and completion contract."
    ],
    "owns": [
      "The software build boundary and implementation completion contract.",
      "System architecture, data design, security controls, interfaces, technical delivery, quality, operations, scale, and continuity.",
      "Technical implementation of experience, brand, product, and policy direction supplied by their owning domains."
    ],
    "does_not_own": [
      "User and market evidence, product strategy, or outcome selection owned by Product Strategy and Evidence DNA.",
      "User journeys, interaction intent, interface hierarchy, UX content, visual composition, or experience evaluation owned by Product Design and Experience DNA.",
      "Enduring verbal and visual identity owned by Brand Identity DNA.",
      "Commercial and economic strategy owned by Commercial and Economics DNA; market-facing growth owned by Market Presence and Growth DNA; legal and distribution-policy interpretation owned by Legal, Policy and Market Access DNA; and customer-service operation owned by Service Operations and Support DNA."
    ],
    "coordinates_with": {
      "_DNA-PSTR": "Translate agreed product evidence, priorities, and outcomes into a bounded implementation without redefining them.",
      "_DNA-PDEX": "Implement the agreed experience, content, accessibility, adaptation, and localisation direction as reliable software.",
      "_DNA-BRND": "Translate brand primitives and application rules into technical assets, tokens, and delivery constraints.",
      "_DNA-COMM": "Implement payments, subscriptions, entitlements, billing events, and commercial controls without deciding the business model.",
      "_DNA-GROW": "Implement technical discovery, attribution, store, campaign, and lifecycle capabilities without owning growth strategy.",
      "_DNA-LEGL": "Implement current confirmed obligations, disclosures, privacy controls, distribution requirements, and evidence without making legal determinations.",
      "_DNA-SOPS": "Implement internal tools, integrations, case flows, fulfilment support, and service-operating controls without owning the service model."
    },
    "live_verification": [
      "Verify current platform, runtime, security, privacy, accessibility-implementation, and distribution requirements when they materially constrain the build.",
      "Prefer current authoritative standards and platform policies over static model memory."
    ],
    "timing": {
      "consider_early": "Consider whenever the concept will be implemented as software; scope and architecture must reflect the confirmed outcome and likely trajectory before code establishes accidental constraints.",
      "can_defer_when": "Only optional document groups may be deferred where their concerns cannot affect the confirmed outcome or likely evolution; the module itself is not deferrable for a software build.",
      "must_not_defer_when": "Do not defer the implementation boundary, architecture baseline, or material security, data, quality, cost, platform, or continuity concerns exposed by the concept."
    }
  },
