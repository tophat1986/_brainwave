{
  "schema_version": "3.0.0",
  "dna_code": "GROW",
  "dna_version": "0.1.0",
  "name": "Market Presence and Growth DNA",
  "description": "A proportionate catalogue for making a product discoverable, credible, adoptable, and capable of responsible growth. It translates product evidence, brand, commercial direction, and experience intent into positioning, launch, search, store, acquisition, conversion, lifecycle, referral, content, and growth measurement without owning the product itself.",
  "documentation_label": "market presence and growth documentation",
  "module_contract": {
    "when_relevant": "Use when a product must be found, understood, launched, adopted, retained, shared, or grown beyond a known private audience. Consider it for most public-launch and venture-intent products even when the first growth plan is deliberately small.",
    "selection_signals": [
      "The product will have a public website, app-store presence, search surface, launch, campaign, sales path, community, or acquisition channel.",
      "Audience positioning, messaging, discoverability, conversion, onboarding handoff, retention, referral, or re-engagement could determine adoption.",
      "The concept needs market tests, channel learning, growth targets, or attribution to avoid building without a credible route to users."
    ],
    "owns": [
      "Priority market-facing audiences, channel strategy, public positioning application, message architecture, and launch sequencing.",
      "SEO, ASO, public landing, acquisition, conversion, lifecycle, referral, content, campaign, and creative direction.",
      "Growth funnels, channel measures, attribution intent, growth experimentation, and responsible-growth guardrails across market-facing activity."
    ],
    "does_not_own": [
      "Core user problem, product value, product priorities, or evidence owned by Product Strategy and Evidence DNA.",
      "Enduring identity owned by Brand Identity DNA or in-product journeys and interface content owned by Product Design and Experience DNA.",
      "Pricing and commercial policy owned by Commercial and Economics DNA or technical implementation owned by Software Application DNA.",
      "Legal, policy, and regulatory interpretation affecting claims, consent, or distribution rules owned by Legal, Policy and Market Access DNA.",
      "Operational service-support communications owned by Service Operations and Support DNA."
    ],
    "coordinates_with": {
      "_DNA-PSTR": "Use evidence, audiences, alternatives, value, assumptions, and product outcomes as the basis for market-facing choices and learning.",
      "_DNA-BRND": "Apply the enduring identity, voice, and visual direction consistently across public and campaign touchpoints.",
      "_DNA-PDEX": "Coordinate landing, acquisition, referral, store, onboarding, and lifecycle touchpoints as one coherent user journey.",
      "_DNA-COMM": "Align offers, channel economics, acquisition cost, conversion, packaging, and commercial measurement.",
      "_DNA-SAPP": "Supply discoverability, analytics, experimentation, metadata, performance, and integration requirements for implementation.",
      "_DNA-LEGL": "Verify public claims, endorsements, tracking, consent, promotions, direct marketing, platform policy, and market-specific constraints before launch.",
      "_DNA-SOPS": "Coordinate support, service availability, fulfilment capacity, and customer communication with launch and growth promises."
    },
    "live_verification": [
      "Verify current search and store guidance, channel capabilities, platform policies, market language, competitor presence, audience behaviour, and acquisition benchmarks when material.",
      "Distinguish sourced market evidence and measured product data from hypotheses; do not invent demand, rankings, traffic, conversion, or channel performance.",
      "Use current platform rules for ratings, reviews, referrals, messaging, advertising, and discovery. Reject deception, coercion, fabricated proof, spam, exploitative targeting, review or ranking manipulation, and engagement pursued without user value."
    ],
    "timing": {
      "consider_early": "Consider whenever the product needs real users, a public launch, revenue, validation of demand, or a route to adoption so discoverability and channel constraints can shape the foundation.",
      "can_defer_when": "May be light or deferred for a private proof intended only to validate feasibility with a known audience and no public claim, launch commitment, or route-to-market decision.",
      "must_not_defer_when": "Do not defer when public discovery, app-store presence, market testing, acquisition, launch sequencing, or growth economics are necessary to prove the concept or meet the agreed outcome."
    }
  },
