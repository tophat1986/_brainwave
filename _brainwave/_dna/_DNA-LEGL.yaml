{
  "schema_version": "3.0.0",
  "dna_code": "LEGL",
  "dna_version": "0.1.0",
  "name": "Legal, Policy and Market Access DNA",
  "description": "A guarded, consequence-activated catalogue for detecting legal, regulatory, privacy, platform-policy, and market-access constraints early; maintaining source-linked obligations and review gates; and preparing focused questions and evidence for qualified review. It does not provide legal advice, decide that a product is compliant, or replace a suitably qualified professional.",
  "documentation_label": "legal, policy and market access documentation",
  "module_contract": {
    "when_relevant": "Use when intended users, data, claims, content, money movement, distribution, geography, sector, or service model may create legal, regulatory, privacy, consumer, intellectual-property, accessibility, or platform-policy consequences. Initial detection is deliberately lightweight; depth follows risk and consequence rather than project size or maturity.",
    "selection_signals": [
      "The product will launch publicly, enter an app store or marketplace, operate across countries, or make eligibility, safety, performance, financial, health, professional, environmental, or comparative claims.",
      "The product involves personal or sensitive data, tracking, children or vulnerable people, health, finance, education, employment, identity, location, communications, user-generated content, AI decisions, or regulated goods or services.",
      "Users will pay, subscribe, transact, receive credit or payouts, accept terms, upload licensed material, encounter advertising, or rely on consequential information or recommendations."
    ],
    "owns": [
      "Jurisdiction and market-access map, regulatory and policy classification, consequence triage, review gates, and qualified-review plan.",
      "Source-linked obligation and evidence register covering privacy, consumer, accessibility, claims, content, intellectual property, distribution, and other applicable domains.",
      "Legal-policy inputs for notices, consent, rights, terms, disclosures, claims, records, retention, and review cadence.",
      "Explicit uncertainty, assumptions, source dates, unresolved questions, and matters requiring qualified professional judgment."
    ],
    "does_not_own": [
      "Technical security, privacy, payment, data, accessibility, or compliance-control implementation owned by Software Application DNA.",
      "User-facing disclosure and consent experience owned by Product Design and Experience DNA.",
      "Commercial choices and customer promises owned by Commercial and Economics DNA or market strategy and campaign execution owned by Market Presence and Growth DNA.",
      "Product strategy, brand identity, service operations, or a declaration that the product is legally compliant.",
      "Trust and safety strategy, abuse or moderation policy, marketplace or network integrity, AI product assurance, clinical or professional safety, and sector-specific regulated practice. This module detects and routes those needs but does not replace their specialist owners."
    ],
    "coordinates_with": {
      "_DNA-PSTR": "Receive intended users, claims, outcomes, evidence, geography, data use, and risk assumptions that may trigger obligations or review.",
      "_DNA-PDEX": "Supply verified requirements for notice, consent, rights, accessibility, disclosures, controls, and comprehensible user-facing policy experiences.",
      "_DNA-BRND": "Review naming, identity assets, endorsements, claims, and protected or licensed brand material where consequential.",
      "_DNA-SAPP": "Supply current obligation and evidence requirements for technical controls, data handling, platform submission, testing, and auditability.",
      "_DNA-COMM": "Review payment, subscription, cancellation, refund, promotion, tax, marketplace, and other customer-commercial obligations without choosing the model.",
      "_DNA-GROW": "Review marketing claims, comparisons, endorsements, tracking, consent, direct communication, promotions, and distribution policy without choosing the campaign.",
      "_DNA-SOPS": "Supply requirements for service records, safeguarding, complaints, escalation, accessibility, fulfilment, and customer-rights execution."
    },
    "live_verification": [
      "Use current primary or authoritative sources for every material obligation, regulator position, platform policy, filing, deadline, or market-access decision; record jurisdiction, source link, publication or update date, retrieval date, and uncertainty.",
      "Do not rely on model memory, generic templates, unsourced summaries, or outdated research for a consequential conclusion. Escalate ambiguity, conflict, or high impact to a suitably qualified professional.",
      "Never describe generated analysis, wording, controls, or documents as legal advice, certification, approval, or proof of compliance."
    ],
    "timing": {
      "consider_early": "Run a short consequence screen for any product intended for real people or public distribution; expand the module only when users, data, claims, money, geography, sector, content, or platform rules create a material trigger.",
      "can_defer_when": "Detailed analysis may be deferred for a closed, disposable feasibility demonstration using no real personal data, money, regulated claims, public distribution, vulnerable users, or contractual commitment, provided the deferral and re-entry trigger are recorded.",
      "must_not_defer_when": "Do not defer initial detection or the relevant review gate when real personal or sensitive data, children or vulnerable users, regulated or high-consequence activity, payments or subscriptions, public claims, user-generated content, app-store distribution, contractual commitments, or multi-market launch are planned."
    }
  },
