{
  "schema_version": "4.0.0",
  "dna_code": "COMM",
  "dna_version": "0.2.0",
  "name": "Commercial and Economics DNA",
  "description": "A proportionate catalogue for defining how a product is funded, earns or sustains value, packages access, handles commercial relationships, and remains economically viable. It connects product value to pricing, monetisation, payments, cost, and commercial measurement without owning product strategy, growth execution, legal interpretation, or technical implementation.",
  "documentation_label": "commercial and economics documentation",
  "module_contract": {
    "assurance_profiles": ["commercial_validity"],
    "when_relevant": "Use when a concept needs revenue, funding, pricing, paid access, transactions, advertising, costly delivery, or an explicit sustainability model. Consider it for most public-launch and venture-intent products, including products funded indirectly rather than by their end users.",
    "selection_signals": [
      "The product may use subscriptions, purchases, commission, fees, advertising, sponsorship, licensing, donations, grants, or another funding mechanism.",
      "Pricing, packaging, entitlements, trials, refunds, billing, or payer-versus-user distinctions could shape the product or architecture.",
      "Setup cost, human delivery, AI usage, infrastructure, third-party services, or growth could materially affect viability."
    ],
    "owns": [
      "Funding and revenue model, customer and payer model, commercial assumptions, and viability thresholds.",
      "Pricing, packaging, paid boundaries, commercial entitlement policy, and monetisation mechanics.",
      "Commercial payment, billing, cancellation, refund, and chargeback policy.",
      "Complete cost and cash model, upfront capital requirements, working-capital and runway constraints, unit economics, commercial scenarios, viability thresholds, and economic measures."
    ],
    "does_not_own": [
      "User need, product value, prioritisation, or evidence owned by Product Strategy and Evidence DNA.",
      "Pricing, payment, cancellation, or entitlement experience owned by Product Design and Experience DNA.",
      "Payment integration, entitlement enforcement, security, infrastructure, or technical cost controls owned by Software Application DNA.",
      "Audience acquisition and growth execution, legal and tax interpretation, or service fulfilment operations."
    ],
    "coordinates_with": {
      "_DNA-PSTR": "Use evidence about user value, demand, alternatives, and outcomes to ground commercial assumptions and willingness-to-pay learning.",
      "_DNA-PDEX": "Supply pricing, packaging, entitlement, payment, cancellation, and refund rules for clear customer journeys.",
      "_DNA-BRND": "Keep commercial presentation and perceived value consistent with the enduring identity and promise.",
      "_DNA-SAPP": "Supply commercial rules and volume assumptions for payment, entitlement, metering, billing, and cost implementation.",
      "_DNA-GROW": "Align acquisition economics, offers, channels, conversion measures, and lifecycle growth with sustainable value.",
      "_DNA-LEGL": "Obtain current market, tax, consumer-rights, subscription, payment, advertising, and disclosure obligations before treating a commercial policy as launch-ready.",
      "_DNA-SOPS": "Translate customer promises, refunds, disputes, fulfilment cost, and service commitments into executable operations."
    },
    "live_verification": [
      "Verify current market prices, platform commissions, payment-provider fees, tax treatment, competitor packaging, and third-party service costs when they materially affect a decision.",
      "Separate sourced facts, estimates, scenarios, and user-approved assumptions; do not present model familiarity as current commercial evidence.",
      "When tax, accounting classification, revenue recognition, filing, or financial reporting is consequential, obtain current qualified tax or accounting review. Never present generated analysis as tax advice, an accounting determination, or filing assurance."
    ],
    "timing": {
      "consider_early": "Consider for most venture-intent or public-launch products because funding, payer, price, entitlement, delivery cost, and usage economics can change the product and architecture.",
      "can_defer_when": "May be light or deferred for a private, deliberately disposable demonstration with no real payment, costly delivery, funding decision, or claim of commercial viability.",
      "must_not_defer_when": "Do not defer when monetisation changes access or scope, real payments or financial commitments are planned, paid promises affect user rights, or cost could make the concept unviable."
    }
  },
