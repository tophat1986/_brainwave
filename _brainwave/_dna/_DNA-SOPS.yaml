{
  "schema_version": "4.0.0",
  "dna_code": "SOPS",
  "dna_version": "0.2.0",
  "name": "Service Operations and Support DNA",
  "description": "A proportionate catalogue for designing and operating the human and organisational work surrounding a product: service delivery, support, fulfilment, scheduling, capacity, quality, complaints, escalation, readiness, and improvement. It connects the customer experience to real operational ownership without absorbing technical operations, commercial policy, or legal interpretation.",
  "documentation_label": "service operations and support documentation",
  "module_contract": {
    "assurance_profiles": ["service_operations"],
    "when_relevant": "Use when customer value or safety depends on people, support, human-led onboarding, customer success, adoption guidance, teaching, coaching, execution of an established moderation policy, review, fulfilment, bookings, appointments, partners, vendors, complaints, manual intervention, or a service promise. Use lightly for self-service products unless meaningful support or human escalation is required.",
    "selection_signals": [
      "People will onboard, implement, guide adoption, manage account success, teach, advise, coach, review, approve, moderate, match, fulfil, schedule, deliver, investigate, or intervene as part of the product outcome.",
      "Customers need support channels, response expectations, complaints, disputes, safeguarding, exception handling, recovery, or a handoff between digital and human service.",
      "Staffing, availability, capacity, quality, partners, operating hours, queues, service cost, or operational readiness could limit launch or growth."
    ],
    "owns": [
      "Service blueprint, operational roles and ownership, fulfilment workflow, handoffs, scheduling, queues, capacity, and service quality.",
      "Support channels, intake, case lifecycle, knowledge, service communication, escalation, complaint, dispute, and recovery operations.",
      "Staffing and partner readiness, service procedures, launch-readiness evidence, service measures, feedback, and operational improvement.",
      "Human-led onboarding, implementation support, adoption guidance, account-health operations, proactive value realisation, at-risk recovery, and renewal or expansion handoffs."
    ],
    "does_not_own": [
      "Infrastructure operations, technical incident response, observability, deployment, or technical reliability owned by Software Application DNA. This module owns customer and service incident coordination and serious human escalation.",
      "User-facing product journeys and interface content owned by Product Design and Experience DNA.",
      "Commercial promises, pricing, refund and cancellation policy, or service economics owned by Commercial and Economics DNA. This module owns operational execution of confirmed policy.",
      "Legal rights, safeguarding obligations, regulatory interpretation, product strategy, brand identity, or growth strategy.",
      "Trust and safety strategy, abuse policy, moderation-system governance, marketplace or network integrity, AI product assurance, clinical or professional safety, and sector-specific regulated practice. This module may execute confirmed human workflows but does not replace their specialist owners."
    ],
    "coordinates_with": {
      "_DNA-PSTR": "Use intended outcomes, audiences, assumptions, and evidence to define the service contribution to product value.",
      "_DNA-PDEX": "Connect digital journeys to human handoffs, support, fulfilment, recovery, and service communication as one experience.",
      "_DNA-BRND": "Apply the enduring voice and behavioural identity to human service and support without scripting away judgment or empathy.",
      "_DNA-SAPP": "Supply roles, queues, records, permissions, notifications, tooling, integrations, audit, and operational-control requirements for implementation.",
      "_DNA-COMM": "Translate service promises, delivery cost, cancellation, refund, dispute, partner, and capacity assumptions into executable operations.",
      "_DNA-GROW": "Align launch, campaigns, lifecycle communication, and growth pace with actual service availability, quality, and capacity.",
      "_DNA-LEGL": "Apply current obligations and review gates for safeguarding, complaints, records, accessibility, customer rights, regulated delivery, and escalation."
    },
    "live_verification": [
      "Verify current sector standards, safeguarding routes, professional requirements, service benchmarks, labour or partner constraints, channel capabilities, and vendor commitments when material.",
      "Validate workflows with the people who will deliver and receive the service; do not treat an agent-generated process map as evidence that the operation is workable."
    ],
    "timing": {
      "consider_early": "Consider whenever value, safety, trust, or delivery depends on human work, support, scheduling, fulfilment, moderation, partners, or operational capacity—even if the software itself is still an early proof.",
      "can_defer_when": "May be light or deferred for a private self-service feasibility demonstration with no real customers, service commitment, human delivery, complaint handling, safety escalation, booking, payment, or partner dependency.",
      "must_not_defer_when": "Do not defer when the product promise depends on people or partners, real bookings or paid services will occur, service capacity constrains growth, vulnerable users need escalation, or failures require a human recovery path."
    }
  },
