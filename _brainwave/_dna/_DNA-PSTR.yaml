{
  "schema_version": "4.0.0",
  "dna_code": "PSTR",
  "dna_version": "0.2.0",
  "name": "Product Strategy and Evidence DNA",
  "description": "A proportionate catalogue for grounding product direction in user and market evidence, making assumptions and trade-offs explicit, and defining measurable outcomes without replacing the agreed North Star or expanding into implementation, experience design, brand identity, or go-to-market execution.",
  "documentation_label": "product strategy and evidence documentation",
  "module_contract": {
    "assurance_profiles": ["product_direction"],
    "when_relevant": "Use when a concept needs evidence, product choices, validation, or measurable outcomes beyond the concise direction captured in the North Star. Apply it proportionately for real-user products, meaningful investment, uncertain demand, or venture-building intent.",
    "selection_signals": [
      "The user problem, audience need, value proposition, alternatives, or demand contain consequential assumptions.",
      "The concept is intended for real users, organisational investment, public launch, or venture development.",
      "Product priorities, success measures, validation, or learning decisions need an explicit basis."
    ],
    "owns": [
      "Evidence about user problems, needs, contexts, alternatives, and material market conditions.",
      "Product value proposition, strategic product principles, trade-offs, and outcome-led priorities.",
      "Assumptions, validation direction, product outcomes, product metrics, and experimentation intent."
    ],
    "does_not_own": [
      "The concise agreed direction and boundaries held by the North Star.",
      "The current software build scope and completion contract owned by Software Application DNA.",
      "Journeys, interaction, interface content, visual composition, or experience evaluation owned by Product Design and Experience DNA.",
      "Brand identity, technical architecture, commercial model, campaign strategy, legal interpretation, or service operations."
    ],
    "coordinates_with": {
      "_DNA-PDEX": "Provide evidence, audiences, value, priorities, and outcomes that experience decisions must realise and test.",
      "_DNA-BRND": "Provide agreed product positioning and evidence from which enduring identity may be derived.",
      "_DNA-SAPP": "Provide product priorities, assumptions, constraints, and outcomes for implementation scope and architecture without prescribing technical choices.",
      "_DNA-COMM": "Supply user value, willingness, assumptions, and product outcomes for commercial-model and pricing decisions.",
      "_DNA-GROW": "Supply audiences, value, alternatives, evidence, and outcomes for market-facing strategy and growth learning.",
      "_DNA-LEGL": "Surface product claims, intended users, geographies, data use, and regulated contexts requiring obligation or market-access analysis.",
      "_DNA-SOPS": "Supply intended user outcomes and service assumptions for operational delivery and support design."
    },
    "live_verification": [
      "Verify time-sensitive claims about users, competitors, alternatives, markets, platforms, and regulation against current credible evidence when they materially affect direction.",
      "Label inference, anecdote, hypothesis, and validated evidence distinctly; do not convert model familiarity into claimed research."
    ],
    "timing": {
      "consider_early": "Consider whenever real users, organisational investment, public launch, growth, revenue, or material uncertainty makes unsupported product assumptions costly.",
      "can_defer_when": "May be very light for a deliberately throwaway demonstration whose purpose and audience are already clear and where no product or market claim will be treated as validated.",
      "must_not_defer_when": "Do not defer when the concept seeks real adoption, revenue, funding, regulated impact, substantial investment, or resolution of uncertain demand."
    }
  },
