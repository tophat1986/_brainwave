      "_DNA-PDEX": {
        "source_path": "_dna/_DNA-PDEX.yaml",
        "dna_code": "PDEX",
        "canonical_id": "_DNA-PDEX",
        "name": "Product Design and Experience DNA",
        "description": "A proportionate catalogue for defining the complete human experience of a digital product: purposeful journeys, interaction, hierarchy, interface content, accessibility, adaptation, localisation, visual composition, distinctiveness, and experience verification. It converts the North Star, product evidence, and brand identity into build-ready experience direction without owning technical implementation.",
        "module_contract": {
          "when_relevant": "Use when people will interact with a digital product, interface, workflow, or service touchpoint and the intended experience should be deliberate rather than inferred from generic agent defaults.",
          "selection_signals": [
            "The concept contains screens, journeys, onboarding, navigation, input, decisions, system feedback, or user-facing content.",
            "Mobile, responsive, accessible, multilingual, cross-device, or emotionally sensitive use could shape the experience.",
            "Clarity, trust, personality, visual distinctiveness, usability, or reduced cognitive load materially affect success."
          ],
          "owns": [
            "End-to-end journeys, information architecture, interaction behaviour, interface states, user control, and recovery.",
            "UX content purpose, hierarchy, density, terminology application, and concise real-user interface copy.",
            "Responsive and adaptive experience, accessibility direction, localisation experience, visual composition, product design-system intent, and signature experience choices.",
            "Experience acceptance criteria, usability evaluation, and verification that rendered behaviour matches agreed direction."
          ],
          "does_not_own": [
            "User and market evidence, product value, product outcomes, or prioritisation owned by Product Strategy and Evidence DNA.",
            "Stable brand voice, logo, colour, typography, and enduring art direction owned by Brand Identity DNA.",
            "Client architecture, component implementation, data, security, deployment, or technical testing owned by Software Application DNA.",
            "Campaign messaging, acquisition content, SEO, ASO, commercial strategy, legal interpretation, or customer-service operations."
          ],
          "coordinates_with": {
            "_DNA-PSTR": "Translate evidence, product value, priorities, and outcomes into an experience that can be evaluated against them.",
            "_DNA-BRND": "Apply approved brand voice and visual primitives while preserving product clarity, accessibility, and interaction needs.",
            "_DNA-SAPP": "Provide build-ready experience contracts and acceptance criteria for technical implementation and verification.",
            "_DNA-COMM": "Translate pricing, packaging, entitlements, payments, and commercial policies into clear and trustworthy customer experiences.",
            "_DNA-GROW": "Coordinate acquisition, landing, store, referral, and lifecycle touchpoints without letting conversion goals weaken user clarity or control.",
            "_DNA-LEGL": "Translate disclosure, consent, rights, policy, and market-access requirements into comprehensible user-facing behaviour.",
            "_DNA-SOPS": "Connect the product journey with support, fulfilment, handoff, complaint, and recovery experiences."
          },
          "live_verification": [
            "Verify current accessibility standards, platform interaction conventions, distribution requirements, device constraints, and internationalisation guidance when they materially affect the experience.",
            "Use current authoritative references and rendered-product evaluation; do not rely only on a generated design rationale or the model's remembered conventions."
          ],
          "timing": {
            "consider_early": "Consider for every user-facing interactive product so journeys, hierarchy, content, platforms, accessibility, localisation, and design character shape the foundation rather than decorate finished code.",
            "can_defer_when": "Only individual document groups may be deferred when the confirmed outcome genuinely does not expose that experience concern; the module itself may be omitted for software with no meaningful human-facing interaction.",
            "must_not_defer_when": "Do not defer for a user-facing build, even a demonstration, because the intended experience determines what should be built and prevents generic or developer-facing output."
          }
        },
