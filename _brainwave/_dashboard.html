<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>_brainwave</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #0f172a;
      --ink-soft: #334155;
      --muted: #64748b;
      --faint: #94a3b8;
      --line: rgba(203, 213, 225, 0.72);
      --line-soft: rgba(226, 232, 240, 0.78);
      --surface: rgba(255, 255, 255, 0.88);
      --surface-solid: #ffffff;
      --surface-muted: rgba(248, 250, 252, 0.82);
      --cyan: #06b6d4;
      --cyan-soft: rgba(207, 250, 254, 0.78);
      --emerald: #059669;
      --emerald-soft: rgba(209, 250, 229, 0.74);
      --amber: #d97706;
      --amber-soft: rgba(254, 243, 199, 0.76);
      --sky: #0284c7;
      --sky-soft: rgba(224, 242, 254, 0.8);
      --rose: #e11d48;
      --rose-soft: rgba(255, 228, 230, 0.76);
      --slate-soft: rgba(241, 245, 249, 0.82);
      --shadow-hub: 0 24px 60px rgba(15, 23, 42, 0.14);
      --shadow-active: 0 18px 44px rgba(15, 23, 42, 0.09);
      --shadow-float: 0 24px 80px rgba(15, 23, 42, 0.18);
      --radius-hub: 2rem;
      --radius-card: 1.65rem;
      --journey-rail-x: 1.48rem;
      --sidecar-title: 24px;
      --sidecar-section: 14px;
      --sidecar-body: 12px;
      --sidecar-meta: 10px;
      --sidecar-id: 9px;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: #e2e8f0;
      overflow-y: scroll;
      scrollbar-gutter: stable;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 0%, rgba(224, 242, 254, 0.92), rgba(248, 250, 252, 0.96) 38rem, rgba(226, 232, 240, 0.86) 100%),
        linear-gradient(180deg, #f8fafc 0%, #fff 100%);
      font: 15px/1.55 "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::before,
    body::after {
      position: fixed;
      z-index: -1;
      width: 28rem;
      height: 28rem;
      border-radius: 50%;
      content: "";
      filter: blur(1px);
      pointer-events: none;
    }

    body::before {
      top: -15rem;
      left: -11rem;
      background: radial-gradient(circle, rgba(165, 243, 252, 0.26), transparent 68%);
    }

    body::after {
      right: -12rem;
      bottom: -17rem;
      background: radial-gradient(circle, rgba(186, 230, 253, 0.24), transparent 70%);
    }

    button,
    a { font: inherit; }

    button { color: inherit; }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(34, 211, 238, 0.3);
      outline-offset: 3px;
    }

    [hidden] { display: none !important; }

    .shell {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 16px 0 72px;
    }

    .hub {
      position: sticky;
      top: 16px;
      z-index: 30;
      display: grid;
      grid-template-columns: minmax(160px, 1fr) auto minmax(160px, 1fr);
      gap: 18px;
      align-items: center;
      min-height: 88px;
      padding: 16px 18px;
      overflow: visible;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: var(--radius-hub);
      background: var(--surface);
      box-shadow: var(--shadow-hub);
      backdrop-filter: blur(40px);
    }

    .hub::before {
      position: absolute;
      inset: 0 0 auto;
      height: 64px;
      border-radius: var(--radius-hub) var(--radius-hub) 0 0;
      background: linear-gradient(180deg, rgba(203, 213, 225, 0.72), rgba(241, 245, 249, 0.32), transparent);
      content: "";
      pointer-events: none;
    }

    .brand,
    .view-switch,
    .utilities { position: relative; z-index: 1; }

    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
      padding-left: 14px;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      color: var(--ink);
      font-family: "Bahnschrift", "Aptos Display", "Segoe UI Variable Display", "Trebuchet MS", sans-serif;
      font-size: 19px;
      font-weight: 680;
      letter-spacing: -0.045em;
      line-height: 1;
    }

    .brand-underscore {
      margin-right: 1px;
      color: #0891b2;
      font-weight: 850;
      text-shadow: 0 0 16px rgba(34, 211, 238, 0.36);
    }

    .brand-word {
      background: linear-gradient(90deg, #0f172a, #164e63 72%, #0891b2);
      background-clip: text;
      color: transparent;
      -webkit-background-clip: text;
    }

    .view-switch {
      display: inline-flex;
      justify-self: center;
      padding: 4px;
      border: 1px solid rgba(226, 232, 240, 0.85);
      border-radius: 999px;
      background: rgba(248, 250, 252, 0.72);
    }

    .view-tab {
      min-height: 36px;
      padding: 0 15px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
      transition: background 160ms ease, box-shadow 160ms ease, color 160ms ease;
    }

    .view-tab[aria-selected="true"] {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.08);
    }

    .utilities {
      display: flex;
      justify-self: end;
      gap: 8px;
    }

    .icon-button,
    .preview-button,
    .close-button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      border: 1px solid rgba(203, 213, 225, 0.82);
      background: rgba(255, 255, 255, 0.82);
      color: var(--muted);
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
      transition: border-color 150ms ease, box-shadow 150ms ease, color 150ms ease;
    }

    .icon-button {
      width: 36px;
      height: 36px;
      border-radius: 50%;
    }

    .icon-button:hover,
    .preview-button:hover,
    .close-button:hover {
      border-color: rgba(148, 163, 184, 0.86);
      color: var(--ink);
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.1);
    }

    .icon-button[data-tone="state"] .glyph {
      width: 10px;
      height: 10px;
      border: 2px solid rgba(34, 211, 238, 0.74);
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(207, 250, 254, 0.82);
    }

    .glyph {
      display: block;
      font-size: 17px;
      font-weight: 500;
      line-height: 1;
    }

    .tip {
      position: absolute;
      top: calc(100% + 8px);
      left: 50%;
      z-index: 50;
      padding: 5px 8px;
      border: 1px solid var(--line-soft);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.97);
      color: var(--ink-soft);
      font-size: 10px;
      font-weight: 650;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%);
      transition: opacity 130ms ease;
      white-space: nowrap;
    }

    .icon-button:hover .tip,
    .icon-button:focus-visible .tip {
      opacity: 1;
    }

    main {
      width: 100%;
      margin: 54px auto 0;
    }

    #journey-view {
      width: min(900px, 100%);
      margin: 0 auto;
    }

    #library-view { width: 100%; }

    .view-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin: 0 0 28px 76px;
    }

    .view-heading h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 620;
      letter-spacing: -0.045em;
      line-height: 1.05;
    }

    .view-heading p {
      max-width: 620px;
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    #library-view .view-heading { margin-left: 0; }

    .snapshot {
      color: var(--faint);
      font-size: 10px;
      text-align: right;
    }

    .journey {
      position: relative;
      display: grid;
      gap: 13px;
    }

    .journey::before {
      position: absolute;
      top: 28px;
      bottom: 28px;
      left: var(--journey-rail-x);
      width: 1px;
      background: linear-gradient(180deg, rgba(6, 182, 212, 0.55), rgba(148, 163, 184, 0.42) 48%, rgba(203, 213, 225, 0.56));
      content: "";
    }

    .stage {
      position: relative;
      min-height: 76px;
      padding-left: 76px;
    }

    .stage-node {
      position: absolute;
      top: 15px;
      left: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border: 1px solid rgba(203, 213, 225, 0.9);
      border-radius: 18px;
      background: rgba(248, 250, 252, 0.94);
      color: var(--faint);
      font-size: 12px;
      font-weight: 750;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
      cursor: pointer;
      transition: border-color 150ms ease, box-shadow 150ms ease, color 150ms ease;
    }

    .stage-node:hover {
      border-color: rgba(103, 232, 249, 0.82);
      color: #0e7490;
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.1);
    }

    .stage.complete .stage-node {
      border-color: rgba(110, 231, 183, 0.7);
      background: linear-gradient(145deg, rgba(236, 253, 245, 0.98), rgba(209, 250, 229, 0.82));
      color: var(--emerald);
      box-shadow: 0 12px 28px rgba(16, 185, 129, 0.12);
    }

    .stage.current .stage-node {
      border-color: rgba(103, 232, 249, 0.9);
      background: linear-gradient(145deg, rgba(236, 254, 255, 0.98), rgba(207, 250, 254, 0.86));
      color: #0e7490;
      box-shadow: 0 14px 32px rgba(34, 211, 238, 0.2);
    }

    .stage-card {
      position: relative;
      min-height: 76px;
      border-radius: var(--radius-card);
    }

    .stage.current .stage-card,
    .stage.expanded .stage-card {
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.76);
      background: rgba(255, 255, 255, 0.86);
      box-shadow: var(--shadow-active);
      backdrop-filter: blur(24px);
    }

    .stage.current .stage-card::before,
    .stage.expanded .stage-card::before {
      position: absolute;
      inset: 0 0 auto;
      height: 72px;
      background: linear-gradient(180deg, rgba(207, 250, 254, 0.38), rgba(241, 245, 249, 0.14), transparent);
      content: "";
      pointer-events: none;
    }

    .stage-toggle {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      width: 100%;
      min-height: 76px;
      padding: 15px 20px;
      border: 0;
      border-radius: inherit;
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: background 150ms ease;
    }

    .stage-toggle:hover { background: rgba(255, 255, 255, 0.48); }
    .stage.future .stage-toggle { color: var(--faint); }

    .stage-label {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--ink);
      font-size: 16px;
      font-weight: 650;
      letter-spacing: -0.018em;
    }

    .stage.future .stage-label { color: #94a3b8; }

    .now-mark {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #0e7490;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .now-mark::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22d3ee;
      box-shadow: 0 0 10px rgba(34, 211, 238, 0.72);
      content: "";
    }

    .stage-subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .stage.future .stage-subtitle { color: #a8b3c2; }

    .stage-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .stage-count {
      min-width: 25px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--slate-soft);
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      text-align: center;
    }

    .preview-button {
      width: 32px;
      height: 32px;
      border-radius: 12px;
    }

    .eye {
      position: relative;
      width: 16px;
      height: 11px;
      border: 1.7px solid currentColor;
      border-radius: 50% / 58%;
    }

    .eye::after {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
      content: "";
      transform: translate(-50%, -50%);
    }

    .chevron {
      width: 8px;
      height: 8px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(45deg) translateY(-2px);
      transition: transform 160ms ease;
    }

    .stage.expanded .chevron { transform: rotate(225deg) translate(-2px, -1px); }

    .stage-body {
      position: relative;
      z-index: 1;
      padding: 0 20px 22px;
    }

    .artifact-card,
    .module-mini,
    .library-card,
    .document-row,
    .review-card {
      border: 1px solid var(--line-soft);
      background: rgba(248, 250, 252, 0.72);
    }

    .artifact-card {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: center;
      width: 100%;
      padding: 14px;
      border-radius: 1.2rem;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    .artifact-card:hover {
      border-color: rgba(103, 232, 249, 0.75);
      background: rgba(255, 255, 255, 0.9);
    }

    .artifact-icon,
    .module-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: linear-gradient(145deg, #f8fafc, #fff);
      color: var(--ink-soft);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.07);
      font-weight: 750;
    }

    .artifact-icon {
      width: 42px;
      height: 42px;
      border-radius: 15px;
    }

    .artifact-title { font-size: 13px; font-weight: 650; }
    .artifact-note {
      max-width: 520px;
      margin-top: 2px;
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .first-step {
      display: grid;
      place-items: center;
      min-height: 190px;
      padding: 24px;
      text-align: center;
    }

    .idea-prompt-icon,
    .direction-icon {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      border: 1px solid rgba(103, 232, 249, 0.64);
      background: linear-gradient(145deg, rgba(236, 254, 255, 0.95), rgba(255, 255, 255, 0.92));
      box-shadow: 0 18px 40px rgba(34, 211, 238, 0.16);
    }

    .idea-prompt-icon {
      width: 72px;
      height: 54px;
      gap: 7px;
      border-radius: 20px;
    }

    .idea-prompt-icon::after {
      position: absolute;
      right: 13px;
      bottom: -7px;
      width: 14px;
      height: 14px;
      border-right: 1px solid rgba(103, 232, 249, 0.64);
      border-bottom: 1px solid rgba(103, 232, 249, 0.64);
      background: #fff;
      content: "";
      transform: skewY(35deg);
    }

    .idea-prompt-icon i {
      position: relative;
      z-index: 1;
      display: block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #0891b2;
      box-shadow: 0 0 10px rgba(34, 211, 238, 0.28);
    }

    .direction-icon {
      width: 58px;
      height: 58px;
      border-radius: 21px;
      color: #0891b2;
      font-size: 24px;
      font-weight: 650;
    }

    .first-step > div > span {
      display: block;
      margin-top: 16px;
      color: var(--muted);
      font-size: 12px;
    }

    .module-mini-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .module-mini {
      position: relative;
      min-height: 116px;
      padding: 14px;
      border-radius: 1.2rem;
      text-align: left;
    }

    button.module-mini { cursor: pointer; }
    button.module-mini:hover { border-color: rgba(103, 232, 249, 0.75); background: #fff; }

    .module-mark {
      width: 52px;
      height: 38px;
      border-radius: 14px;
      font-size: 9px;
      letter-spacing: 0.08em;
    }

    .module-mini[data-tone="brand"] .module-mark,
    .library-card[data-tone="brand"] .module-mark {
      border-color: rgba(251, 191, 36, 0.48);
      background: linear-gradient(145deg, rgba(255, 251, 235, 0.98), #fff);
      box-shadow: 0 12px 26px rgba(245, 158, 11, 0.1);
    }

    .module-mini[data-tone="software"] .module-mark,
    .library-card[data-tone="software"] .module-mark {
      border-color: rgba(103, 232, 249, 0.62);
      background: linear-gradient(145deg, rgba(236, 254, 255, 0.98), #fff);
      box-shadow: 0 12px 26px rgba(34, 211, 238, 0.12);
    }

    .module-mini-title {
      margin-top: 13px;
      overflow: hidden;
      font-size: 12px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .module-mini-state {
      margin-top: 2px;
      color: var(--faint);
      font-size: 10px;
    }

    .module-selected {
      position: absolute;
      top: 14px;
      right: 14px;
      color: var(--emerald);
      font-size: 12px;
      font-weight: 800;
    }

    .module-add {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 3px;
      border-style: dashed;
      color: var(--faint);
      cursor: default;
    }

    .module-add > span { font-size: 24px; line-height: 1; }
    .module-add > small {
      max-width: 120px;
      font-size: 9px;
      font-weight: 650;
      line-height: 1.35;
      text-align: center;
    }

    .quiet-empty {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      min-height: 116px;
    }

    .quiet-empty-card {
      display: grid;
      align-content: center;
      gap: 10px;
      min-height: 116px;
      padding: 18px;
      border: 1px dashed rgba(203, 213, 225, 0.78);
      border-radius: 1.2rem;
      background: rgba(248, 250, 252, 0.46);
      opacity: 0.72;
    }

    .quiet-empty-card::before {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(203, 213, 225, 0.9);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.72);
      content: "";
    }

    .quiet-empty-card::after {
      width: min(82%, 120px);
      height: 8px;
      border-radius: 999px;
      background: rgba(203, 213, 225, 0.58);
      content: "";
    }

    .scope-stack { display: grid; gap: 10px; }

    .scope-module {
      padding: 13px 14px;
      border: 1px solid var(--line-soft);
      border-radius: 1.15rem;
      background: rgba(248, 250, 252, 0.65);
    }

    .scope-module-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      font-size: 12px;
      font-weight: 650;
    }

    .scope-docs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .scope-doc {
      padding: 5px 8px;
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 10px;
      box-shadow: inset 0 0 0 1px rgba(226, 232, 240, 0.9);
    }

    .block-map { display: grid; gap: 18px; }

    .block-module-title {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .implementation-document {
      display: grid;
      grid-template-columns: minmax(160px, 0.7fr) minmax(0, 1.7fr);
      gap: 16px;
      align-items: start;
      padding-top: 13px;
      border-top: 1px solid var(--line-soft);
    }

    .document-id {
      color: var(--muted);
      font: 10px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace;
      overflow-wrap: anywhere;
    }

    .document-title {
      margin-top: 3px;
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 650;
    }

    .blocks {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      gap: 8px;
    }

    .dna-block,
    .skeleton-block {
      min-height: 88px;
      border-radius: 18px;
    }

    .dna-block {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px;
      border: 1px solid rgba(203, 213, 225, 0.88);
      background: rgba(248, 250, 252, 0.86);
      color: var(--ink-soft);
      text-align: left;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
      transition: box-shadow 150ms ease, border-color 150ms ease;
    }

    .dna-block:hover {
      box-shadow: 0 16px 32px rgba(15, 23, 42, 0.11);
    }

    .dna-block.in_progress {
      border-color: rgba(34, 211, 238, 0.72);
      background: linear-gradient(145deg, rgba(236, 254, 255, 0.94), rgba(207, 250, 254, 0.66));
    }

    .dna-block.implemented {
      border-color: rgba(125, 211, 252, 0.72);
      background: var(--sky-soft);
    }

    .dna-block.verified {
      border-color: rgba(110, 231, 183, 0.74);
      background: var(--emerald-soft);
    }

    .dna-block.blocked,
    .dna-block.invalid {
      border-color: rgba(251, 113, 133, 0.72);
      background: var(--rose-soft);
    }

    .dna-block.superseded {
      border-style: dashed;
      opacity: 0.62;
    }

    .dna-block.not_applicable {
      border-style: dotted;
      background: transparent;
    }

    .block-top {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      font: 700 10px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .block-state { font-family: "Segoe UI", sans-serif; }

    .block-title {
      margin-top: 12px;
      overflow: hidden;
      font-size: 10px;
      font-weight: 650;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .skeleton-block,
    .skeleton-line {
      border: 1px solid rgba(226, 232, 240, 0.86);
      background:
        linear-gradient(120deg, rgba(241, 245, 249, 0.76), rgba(255, 255, 255, 0.88) 48%, rgba(226, 232, 240, 0.54));
    }

    .skeleton-block { opacity: 0.62; }

    .skeleton-line {
      height: 9px;
      border-radius: 999px;
    }

    .review-card {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 18px;
      align-items: center;
      padding: 16px;
      border-radius: 1.25rem;
    }

    .progress-ring {
      --progress: 0;
      position: relative;
      display: grid;
      place-items: center;
      width: 70px;
      height: 70px;
      border-radius: 24px;
      background: conic-gradient(#22d3ee calc(var(--progress) * 1%), rgba(226, 232, 240, 0.76) 0);
      box-shadow: 0 14px 30px rgba(34, 211, 238, 0.12);
    }

    .progress-ring::before {
      position: absolute;
      inset: 7px;
      border-radius: 18px;
      background: #fff;
      content: "";
    }

    .progress-ring strong {
      position: relative;
      z-index: 1;
      font-size: 13px;
    }

    .review-title { font-size: 14px; font-weight: 650; }
    .review-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 8px;
    }

    .metric {
      padding: 5px 8px;
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 10px;
      box-shadow: inset 0 0 0 1px rgba(226, 232, 240, 0.88);
    }

    .metric.warn { color: var(--rose); }

    .library-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-left: 0;
    }

    .library-card {
      position: relative;
      min-height: 270px;
      padding: 94px 20px 20px;
      border-radius: 1.6rem;
      color: inherit;
      text-align: left;
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.07);
    }

    button.library-card {
      cursor: pointer;
      transition: box-shadow 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    button.library-card:hover {
      border-color: rgba(103, 232, 249, 0.72);
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 20px 46px rgba(15, 23, 42, 0.12);
    }

    .library-card .module-mark {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 66px;
      height: 54px;
      border-radius: 20px;
      font-size: 11px;
    }

    .library-status {
      position: absolute;
      top: 20px;
      right: 20px;
      display: grid;
      gap: 3px;
      justify-items: end;
      text-align: right;
    }

    .installed {
      color: var(--emerald);
      font-size: 10px;
      font-weight: 750;
      white-space: nowrap;
    }

    .library-version {
      color: var(--faint);
      font: 9px/1.3 ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .library-title {
      margin-top: 0;
      font-size: 17px;
      font-weight: 650;
      letter-spacing: -0.025em;
    }

    .library-groups {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 14px;
    }

    .library-group {
      padding: 5px 8px;
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 9px;
      box-shadow: inset 0 0 0 1px rgba(226, 232, 240, 0.9);
    }

    .library-count {
      position: absolute;
      right: 20px;
      bottom: 18px;
      color: var(--faint);
      font-size: 10px;
    }

    .library-add {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 7px;
      border-style: dashed;
      box-shadow: none;
      color: var(--faint);
      padding: 20px;
    }

    .library-add > span { font-size: 34px; line-height: 1; }
    .library-add > small {
      max-width: 150px;
      font-size: 10px;
      font-weight: 650;
      line-height: 1.4;
      text-align: center;
    }

    .page-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      width: 100%;
      margin: 108px auto 0;
      padding: 24px 12px 8px;
      border-top: 1px solid rgba(203, 213, 225, 0.5);
      color: rgba(100, 116, 139, 0.72);
      font-size: 10px;
    }

    .footer-version {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: 0.02em;
    }

    .footer-links {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .footer-links a {
      color: inherit;
      text-decoration: none;
      transition: color 150ms ease;
    }

    .footer-links a:hover { color: var(--ink-soft); }

    .scrim {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(15, 23, 42, 0.13);
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(1px);
      transition: opacity 180ms ease;
    }

    .scrim.open {
      opacity: 1;
      pointer-events: auto;
    }

    .inspector {
      position: fixed;
      top: 20px;
      right: 20px;
      bottom: 20px;
      z-index: 70;
      display: flex;
      width: min(480px, calc(100vw - 40px));
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 2rem;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow-float);
      opacity: 0;
      pointer-events: none;
      transform: translateX(calc(100% + 40px));
      transition: opacity 190ms ease, transform 260ms cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(40px);
    }

    .inspector.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
    }

    .inspector::before {
      position: absolute;
      inset: 0 0 auto;
      height: 84px;
      background: linear-gradient(180deg, rgba(203, 213, 225, 0.66), rgba(241, 245, 249, 0.24), transparent);
      content: "";
      pointer-events: none;
    }

    .inspector-head {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: start;
      padding: 22px 22px 17px;
      border-bottom: 1px solid var(--line-soft);
    }

    .back-button { grid-column: 1; }

    .inspector-heading {
      grid-column: 2;
      min-width: 0;
    }

    .inspector-head > .close-button { grid-column: 3; }

    .inspector-eyebrow {
      color: #0e7490;
      font-size: var(--sidecar-meta);
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .inspector-title {
      margin: 5px 0 0;
      color: var(--ink);
      font-size: var(--sidecar-title);
      font-weight: 650;
      letter-spacing: -0.035em;
      line-height: 1.12;
    }

    .inspector-meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .back-button,
    .close-button {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(203, 213, 225, 0.82);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.82);
      color: var(--muted);
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
      font-size: 18px;
      transition: border-color 150ms ease, box-shadow 150ms ease, color 150ms ease;
    }

    .back-button:hover,
    .close-button:hover {
      border-color: rgba(148, 163, 184, 0.86);
      color: var(--ink);
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.1);
    }

    .inspector-body {
      min-height: 0;
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      scrollbar-color: rgba(148, 163, 184, 0.34) transparent;
      scrollbar-width: thin;
    }

    .inspector-foot {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 58px;
      padding: 10px 22px;
      border-top: 1px solid var(--line-soft);
      background: rgba(248, 250, 252, 0.72);
    }

    .source-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
      text-decoration: none;
    }

    .source-link:hover { color: var(--ink); }

    .reader { color: #334155; font-size: 13px; line-height: 1.72; }
    .reader > :first-child { margin-top: 0; }
    .reader > :last-child { margin-bottom: 0; }
    .reader h1,
    .reader h2,
    .reader h3,
    .reader h4 {
      margin: 1.7em 0 0.55em;
      color: var(--ink);
      font-weight: 650;
      line-height: 1.22;
    }
    .reader h1 { font-size: 24px; letter-spacing: -0.04em; }
    .reader h2 { font-size: 19px; letter-spacing: -0.025em; }
    .reader h3 { font-size: 15px; }
    .reader h4 { font-size: 13px; }
    .reader p,
    .reader ul,
    .reader ol,
    .reader blockquote,
    .reader pre,
    .reader table { margin: 0.85em 0 0; }
    .reader ul,
    .reader ol { padding-left: 1.4rem; }
    .reader li + li { margin-top: 0.25em; }
    .reader blockquote {
      padding: 0.2rem 0 0.2rem 1rem;
      border-left: 2px solid rgba(34, 211, 238, 0.6);
      color: var(--muted);
    }
    .reader code {
      padding: 0.1rem 0.32rem;
      border-radius: 0.35rem;
      background: rgba(241, 245, 249, 0.92);
      color: var(--ink-soft);
      font: 0.92em/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    .reader pre {
      overflow-x: auto;
      padding: 14px;
      border: 1px solid var(--line-soft);
      border-radius: 1rem;
      background: rgba(248, 250, 252, 0.92);
    }
    .reader pre code { padding: 0; background: transparent; }
    .reader a { color: #0e7490; text-underline-offset: 2px; }
    .reader hr { margin: 1.3rem 0; border: 0; border-top: 1px solid var(--line-soft); }
    .reader table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }
    .reader th,
    .reader td {
      padding: 8px;
      border: 1px solid var(--line-soft);
      text-align: left;
      vertical-align: top;
    }
    .reader th { background: rgba(241, 245, 249, 0.82); color: var(--ink); }

    .empty-reader {
      display: grid;
      place-items: center;
      min-height: 260px;
      color: var(--faint);
    }

    .empty-reader .empty-symbol {
      display: grid;
      place-items: center;
      width: 72px;
      height: 72px;
      border: 1px dashed rgba(148, 163, 184, 0.56);
      border-radius: 26px;
      background: rgba(248, 250, 252, 0.72);
      font-size: 24px;
    }

    .empty-lines {
      display: grid;
      width: min(220px, 80%);
      gap: 8px;
      margin-top: 18px;
    }

    .empty-lines .skeleton-line:nth-child(2) { width: 78%; }
    .empty-lines .skeleton-line:nth-child(3) { width: 58%; }

    .state-grid {
      display: grid;
      gap: 1px;
      overflow: hidden;
      border: 1px solid var(--line-soft);
      border-radius: 1.2rem;
      background: var(--line-soft);
    }

    .state-row {
      display: grid;
      grid-template-columns: 0.9fr 1.25fr;
      gap: 15px;
      padding: 12px 13px;
      background: rgba(255, 255, 255, 0.94);
      font-size: 12px;
    }

    .state-row span:first-child { color: var(--muted); }
    .state-row strong { font-weight: 650; }

    .decision-list,
    .module-detail-groups { display: grid; gap: 14px; }

    .decision-card,
    .module-detail-group,
    .block-section {
      padding: 16px;
      border: 1px solid var(--line-soft);
      border-radius: 1.15rem;
      background: rgba(248, 250, 252, 0.7);
    }

    .decision-time,
    .block-section-label {
      color: var(--faint);
      font-size: var(--sidecar-meta);
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .decision-title { margin-top: 6px; color: var(--ink); font-size: var(--sidecar-section); font-weight: 650; }
    .decision-rationale { margin-top: 6px; color: var(--muted); font-size: var(--sidecar-body); line-height: 1.55; }

    .module-detail-head {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 14px;
      align-items: center;
      margin-bottom: 18px;
    }

    .module-detail-head .module-mark {
      width: 66px;
      height: 52px;
      border-radius: 19px;
    }

    .module-detail-description {
      color: var(--muted);
      font-size: var(--sidecar-body);
      line-height: 1.6;
    }
    .module-detail-group h3 {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 0;
      font-size: var(--sidecar-section);
    }
    .module-detail-group h3 small {
      color: var(--faint);
      font: var(--sidecar-id)/1.35 ui-monospace, SFMono-Regular, Consolas, monospace;
      font-weight: 500;
    }
    .module-detail-group p {
      max-width: 42rem;
      margin: 7px 0 0;
      color: var(--muted);
      font-size: var(--sidecar-body);
      line-height: 1.58;
    }

    .module-doc-list { display: grid; gap: 7px; margin-top: 14px; }

    .module-doc {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      width: 100%;
      padding: 10px 11px;
      border: 0;
      border-radius: 10px;
      background: #fff;
      color: var(--ink-soft);
      text-align: left;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(226, 232, 240, 0.86);
    }

    .module-doc:hover { box-shadow: inset 0 0 0 1px rgba(103, 232, 249, 0.82); }
    .module-doc strong {
      display: block;
      font-size: var(--sidecar-body);
      line-height: 1.4;
    }
    .module-doc > span:first-child {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: baseline;
      min-width: 0;
    }
    .module-doc small {
      display: block;
      color: var(--faint);
      font: var(--sidecar-id)/1.35 ui-monospace, SFMono-Regular, Consolas, monospace;
      white-space: nowrap;
    }
    .module-doc > span:last-child { color: var(--faint); font-size: 9px; }

    .document-identity {
      display: inline-flex;
      margin-bottom: 14px;
      padding: 5px 8px;
      border: 1px solid var(--line-soft);
      border-radius: 999px;
      background: rgba(248, 250, 252, 0.78);
      color: var(--faint);
      font: 9px/1.3 ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .block-identity {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--slate-soft);
      color: var(--ink-soft);
      font: 10px/1.3 ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--faint);
    }
    .status-dot.in_progress { background: var(--cyan); box-shadow: 0 0 8px rgba(6, 182, 212, 0.5); }
    .status-dot.implemented { background: var(--sky); }
    .status-dot.verified { background: var(--emerald); }
    .status-dot.blocked,
    .status-dot.invalid { background: var(--rose); }

    .block-sections { display: grid; gap: 10px; }
    .block-section .reader { margin-top: 8px; font-size: 13px; }

    @media (max-width: 820px) {
      .hub {
        grid-template-columns: 1fr auto;
      }
      .view-switch {
        grid-column: 1 / -1;
        grid-row: 2;
        width: 100%;
      }
      .view-tab { flex: 1; }
      .library-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .implementation-document { grid-template-columns: 1fr; }
    }

    @media (max-width: 620px) {
      :root { --journey-rail-x: 1.1rem; }
      .shell { width: min(100% - 20px, 1080px); padding-top: 10px; }
      .hub { top: 10px; gap: 12px; min-height: 76px; padding: 13px; border-radius: 1.55rem; }
      .hub::before { border-radius: 1.55rem 1.55rem 0 0; }
      .brand { padding-left: 8px; }
      .utilities { gap: 5px; }
      .icon-button { width: 33px; height: 33px; }
      main { margin-top: 38px; }
      .view-heading { display: block; margin-left: 58px; }
      #library-view .view-heading { margin-left: 0; }
      .snapshot { margin-top: 8px; text-align: left; }
      .stage { padding-left: 58px; }
      .stage-node { width: 36px; height: 36px; top: 20px; border-radius: 13px; }
      .stage-toggle { padding: 14px; }
      .stage-body { padding: 0 14px 16px; }
      .module-mini-grid,
      .library-grid { grid-template-columns: 1fr; }
      .library-grid { margin-left: 0; }
      .module-mini-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .module-add { grid-column: 1 / -1; min-height: 64px; }
      .blocks { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .dna-block,
      .skeleton-block { min-height: 78px; }
      .inspector {
        inset: auto 8px 8px;
        width: auto;
        max-height: 88dvh;
        border-radius: 1.75rem;
        transform: translateY(calc(100% + 20px));
      }
      .inspector.open { transform: translateY(0); }
      .tip { display: none; }
      .page-footer {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
        margin-top: 72px;
        padding-inline: 8px;
      }
    }

    @media (max-width: 420px) {
      .brand-mark { font-size: 14px; }
      .stage-subtitle { max-width: 190px; }
      .blocks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .review-card { grid-template-columns: 1fr; }
      .module-doc > span:first-child {
        grid-template-columns: 1fr;
        gap: 2px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="hub">
      <div class="brand">
        <div class="brand-mark" aria-label="_brainwave"><span class="brand-underscore">_</span><span class="brand-word">brainwave</span></div>
      </div>

      <div class="view-switch" role="tablist" aria-label="Dashboard view">
        <button class="view-tab" type="button" role="tab" aria-selected="true" aria-controls="journey-view" data-view="journey">Your brainwave</button>
        <button class="view-tab" type="button" role="tab" aria-selected="false" aria-controls="library-view" data-view="library" tabindex="-1">DNA Library</button>
      </div>

      <nav class="utilities" aria-label="Dashboard tools">
        <button class="icon-button" type="button" data-action="decisions" aria-label="Decision history">
          <span class="glyph" aria-hidden="true">◷</span><span class="tip">Decisions</span>
        </button>
        <button class="icon-button" type="button" data-action="handbook" aria-label="Open handbook">
          <span class="glyph" aria-hidden="true">?</span><span class="tip">Handbook</span>
        </button>
        <button class="icon-button" type="button" data-action="state" data-tone="state" aria-label="Project state">
          <span class="glyph" aria-hidden="true"></span><span class="tip">State</span>
        </button>
        <button class="icon-button" type="button" data-action="refresh" aria-label="Reload dashboard snapshot">
          <span class="glyph" aria-hidden="true">↻</span><span class="tip">Reload</span>
        </button>
      </nav>
    </header>

    <main>
      <section id="journey-view" aria-labelledby="journey-title">
        <div class="view-heading">
          <div>
            <h1 id="journey-title">Your brainwave</h1>
            <p id="journey-summary">One clear path from an idea to a build-ready foundation.</p>
          </div>
          <div class="snapshot" id="snapshot"></div>
        </div>
        <div class="journey" id="journey"></div>
      </section>

      <section id="library-view" aria-labelledby="library-title" hidden>
        <div class="view-heading">
          <div>
            <h1 id="library-title">DNA Library</h1>
            <p>Explore installed DNA modules and the DNA documents available to your project.</p>
          </div>
        </div>
        <div class="library-grid" id="library"></div>
      </section>
    </main>

    <footer class="page-footer">
      <span class="footer-version">_brainwave <span id="framework-version">v0.1.0</span></span>
