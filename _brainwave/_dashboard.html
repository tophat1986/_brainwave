<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>_brainwave</title>
  <style>
    /* Foundation */
    :root {
      color-scheme: light;
      --ink: #0f172a;
      --ink-soft: #334155;
      --muted: #64748b;
      --faint: #94a3b8;
      --line: rgba(203, 213, 225, 0.72);
      --line-soft: rgba(226, 232, 240, 0.78);
      --surface: rgba(255, 255, 255, 0.88);
      --surface-solid: #ffffff;
      --surface-muted: rgba(248, 250, 252, 0.82);
      --cyan: #06b6d4;
      --cyan-soft: rgba(207, 250, 254, 0.78);
      --emerald: #059669;
      --emerald-soft: rgba(209, 250, 229, 0.74);
      --amber: #d97706;
      --amber-soft: rgba(254, 243, 199, 0.76);
      --sky: #0284c7;
      --sky-soft: rgba(224, 242, 254, 0.8);
      --rose: #e11d48;
      --rose-soft: rgba(255, 228, 230, 0.76);
      --slate-soft: rgba(241, 245, 249, 0.82);
      --shadow-hub: 0 24px 60px rgba(15, 23, 42, 0.14);
      --shadow-active: 0 18px 44px rgba(15, 23, 42, 0.09);
      --shadow-float: 0 24px 80px rgba(15, 23, 42, 0.18);
      --radius-hub: 2rem;
      --radius-card: 1.65rem;
      --journey-rail-x: 1.48rem;
      --journey-node-center: 39px;
      --journey-connector-end: -52px;
      --sidecar-title: 24px;
      --sidecar-section: 14px;
      --sidecar-body: 12px;
      --sidecar-meta: 10px;
      --sidecar-id: 11px;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: #e2e8f0;
      overflow-y: scroll;
      scrollbar-gutter: stable;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 0%, rgba(224, 242, 254, 0.92), rgba(248, 250, 252, 0.96) 38rem, rgba(226, 232, 240, 0.86) 100%),
        linear-gradient(180deg, #f8fafc 0%, #fff 100%);
      font: 15px/1.55 "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::before,
    body::after {
      position: fixed;
      z-index: -1;
      width: 28rem;
      height: 28rem;
      border-radius: 50%;
      content: "";
      filter: blur(1px);
      pointer-events: none;
    }

    body::before {
      top: -15rem;
      left: -11rem;
      background: radial-gradient(circle, rgba(165, 243, 252, 0.26), transparent 68%);
    }

    body::after {
      right: -12rem;
      bottom: -17rem;
      background: radial-gradient(circle, rgba(186, 230, 253, 0.24), transparent 70%);
    }

    button,
    a { font: inherit; }

    button { color: inherit; }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(34, 211, 238, 0.3);
      outline-offset: 3px;
    }

    [hidden] { display: none !important; }

    /* App shell */
    .shell {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 16px 0 72px;
    }

    .hub {
      position: sticky;
      top: 16px;
      z-index: 30;
      display: grid;
      grid-template-columns: minmax(160px, 1fr) auto minmax(160px, 1fr);
      gap: 18px;
      align-items: center;
      min-height: 88px;
      padding: 16px 18px;
      overflow: visible;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: var(--radius-hub);
      background: var(--surface);
      box-shadow: var(--shadow-hub);
      backdrop-filter: blur(40px);
    }

    .hub::before {
      position: absolute;
      inset: 0 0 auto;
      height: 64px;
      border-radius: var(--radius-hub) var(--radius-hub) 0 0;
      background: linear-gradient(180deg, rgba(203, 213, 225, 0.72), rgba(241, 245, 249, 0.32), transparent);
      content: "";
      pointer-events: none;
    }

    .brand,
    .view-switch,
    .utilities { position: relative; z-index: 1; }

    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
      padding-left: 14px;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      color: var(--ink);
      font-family: "Bahnschrift", "Aptos Display", "Segoe UI Variable Display", "Trebuchet MS", sans-serif;
      font-size: 19px;
      font-weight: 680;
      letter-spacing: -0.045em;
      line-height: 1;
    }

    .brand-underscore {
      margin-right: 1px;
      color: #0891b2;
      font-weight: 850;
      text-shadow: 0 0 16px rgba(34, 211, 238, 0.36);
    }

    .brand-word {
      background: linear-gradient(90deg, #0f172a, #164e63 72%, #0891b2);
      background-clip: text;
      color: transparent;
      -webkit-background-clip: text;
    }

    .view-switch {
      display: inline-flex;
      justify-self: center;
      padding: 4px;
      border: 1px solid rgba(226, 232, 240, 0.85);
      border-radius: 999px;
      background: rgba(248, 250, 252, 0.72);
    }

    .view-tab {
      min-height: 36px;
      padding: 0 15px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
      transition: background 160ms ease, box-shadow 160ms ease, color 160ms ease;
    }

    .view-tab[aria-selected="true"] {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.08);
    }

    .utilities {
      display: flex;
      justify-self: end;
      gap: 8px;
    }

    .icon-button,
    .preview-button,
    .close-button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      border: 1px solid rgba(203, 213, 225, 0.82);
      background: rgba(255, 255, 255, 0.82);
      color: var(--muted);
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
      transition: border-color 150ms ease, box-shadow 150ms ease, color 150ms ease;
    }

    .icon-button {
      width: 36px;
      height: 36px;
      border-radius: 50%;
    }

    .icon-button:hover,
    .preview-button:hover,
    .close-button:hover {
      border-color: rgba(148, 163, 184, 0.86);
      color: var(--ink);
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.1);
    }

    .ui-icon {
      position: relative;
      display: block;
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      color: currentColor;
    }

    .ui-icon.search::before {
      position: absolute;
      top: 1px;
      left: 1px;
      width: 9px;
      height: 9px;
      border: 1.6px solid currentColor;
      border-radius: 50%;
      content: "";
    }

    .ui-icon.search::after {
      position: absolute;
      right: 1px;
      bottom: 2px;
      width: 6px;
      height: 1.6px;
      border-radius: 999px;
      background: currentColor;
      content: "";
      transform: rotate(45deg);
      transform-origin: right center;
    }

    .ui-icon.history::before {
      position: absolute;
      inset: 1px;
      border: 1.5px solid currentColor;
      border-radius: 50%;
      content: "";
    }

    .ui-icon.history::after {
      position: absolute;
      top: 4px;
      left: 7px;
      width: 4px;
      height: 4px;
      border-bottom: 1.5px solid currentColor;
      border-left: 1.5px solid currentColor;
      content: "";
    }

    .ui-icon.book::before {
      position: absolute;
      inset: 2px 1px 1px;
      border: 1.5px solid currentColor;
      border-radius: 2px;
      content: "";
    }

    .ui-icon.book::after {
      position: absolute;
      top: 2px;
      bottom: 1px;
      left: 50%;
      border-left: 1.5px solid currentColor;
      content: "";
    }

    .ui-icon.state::before {
      position: absolute;
      inset: 1px 2px;
      border: 1.5px solid currentColor;
      border-radius: 2px;
      content: "";
    }

    .ui-icon.state::after {
      position: absolute;
      top: 5px;
      left: 5px;
      width: 6px;
      height: 1px;
      background: currentColor;
      box-shadow: 0 3px currentColor, 0 6px currentColor;
      content: "";
    }

    .ui-icon.refresh::before {
      position: absolute;
      inset: 1px;
      border: 1.5px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      content: "";
    }

    .ui-icon.refresh::after {
      position: absolute;
      top: 0;
      right: 0;
      width: 5px;
      height: 5px;
      border-top: 1.5px solid currentColor;
      border-right: 1.5px solid currentColor;
      content: "";
    }

    .tip {
      position: absolute;
      top: calc(100% + 8px);
      left: 50%;
      z-index: 50;
      padding: 5px 8px;
      border: 1px solid var(--line-soft);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.97);
      color: var(--ink-soft);
      font-size: 10px;
      font-weight: 650;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%);
      transition: opacity 130ms ease;
      white-space: nowrap;
    }

    .icon-button:hover .tip,
    .icon-button:focus-visible .tip {
      opacity: 1;
    }

    main {
      width: 100%;
      margin: 54px auto 0;
    }

    #journey-view {
      width: min(900px, 100%);
      margin: 0 auto;
    }

    #library-view { width: 100%; }

    .view-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin: 0 0 28px 76px;
    }

    .view-heading h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 620;
      letter-spacing: -0.045em;
      line-height: 1.05;
    }

    .view-heading p {
      max-width: 620px;
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    #library-view .view-heading { margin-left: 0; }

    .snapshot {
      color: var(--faint);
      font-size: 10px;
      text-align: right;
    }

    /* Journey */
    .journey {
      position: relative;
      display: grid;
      gap: 13px;
    }

    .stage:not(:last-child)::before {
      position: absolute;
      top: var(--journey-node-center);
      bottom: var(--journey-connector-end);
      left: var(--journey-rail-x);
      width: 1px;
      background: rgba(148, 163, 184, 0.42);
      content: "";
    }

    .stage.complete:not(:last-child)::before { background: rgba(6, 182, 212, 0.55); }

    .stage {
      position: relative;
      min-height: 76px;
      padding-left: 76px;
    }

    .stage-node {
      position: absolute;
      top: 15px;
      left: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border: 1px solid rgba(203, 213, 225, 0.9);
      border-radius: 18px;
      background: rgba(248, 250, 252, 0.94);
      color: var(--faint);
      font-size: 12px;
      font-weight: 750;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
      cursor: pointer;
      transition: border-color 150ms ease, box-shadow 150ms ease, color 150ms ease;
    }

    .stage-node:hover {
      border-color: rgba(103, 232, 249, 0.82);
      color: #0e7490;
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.1);
    }

    .stage.complete .stage-node {
      border-color: rgba(110, 231, 183, 0.7);
      background: linear-gradient(145deg, rgba(236, 253, 245, 0.98), rgba(209, 250, 229, 0.82));
      color: var(--emerald);
      box-shadow: 0 12px 28px rgba(16, 185, 129, 0.12);
    }

    .stage.current .stage-node {
      border-color: rgba(103, 232, 249, 0.9);
      background: linear-gradient(145deg, rgba(236, 254, 255, 0.98), rgba(207, 250, 254, 0.86));
      color: #0e7490;
      box-shadow: 0 14px 32px rgba(34, 211, 238, 0.2);
    }

    .stage-card {
      position: relative;
      min-height: 76px;
      border-radius: var(--radius-card);
    }

    .stage.current .stage-card,
    .stage.expanded .stage-card {
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.76);
      background: rgba(255, 255, 255, 0.86);
      box-shadow: var(--shadow-active);
      backdrop-filter: blur(24px);
    }

    .stage.current .stage-card::before,
    .stage.expanded .stage-card::before {
      position: absolute;
      inset: 0 0 auto;
      height: 72px;
      background: linear-gradient(180deg, rgba(207, 250, 254, 0.38), rgba(241, 245, 249, 0.14), transparent);
      content: "";
      pointer-events: none;
    }

    .stage-toggle {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      width: 100%;
      min-height: 76px;
      padding: 15px 20px;
      border: 0;
      border-radius: inherit;
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: background 150ms ease;
    }

    .stage-toggle:hover { background: rgba(255, 255, 255, 0.48); }
    .stage.future .stage-toggle { color: var(--faint); }

    .stage-label {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--ink);
      font-size: 16px;
      font-weight: 650;
      letter-spacing: -0.018em;
    }

    .stage.future .stage-label { color: #94a3b8; }

    .now-mark {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #0e7490;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .now-mark::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22d3ee;
      box-shadow: 0 0 10px rgba(34, 211, 238, 0.72);
      content: "";
    }

    .stage-subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .stage.future .stage-subtitle { color: #a8b3c2; }

    .stage-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
    }

    .stage-count {
      min-width: 25px;
      max-width: 240px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--slate-soft);
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
    }

    .preview-button {
      width: 32px;
      height: 32px;
      border-radius: 12px;
    }

    .eye {
      position: relative;
      width: 16px;
      height: 11px;
      border: 1.7px solid currentColor;
      border-radius: 50% / 58%;
    }

    .eye::after {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
      content: "";
      transform: translate(-50%, -50%);
    }

    .chevron {
      width: 8px;
      height: 8px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(45deg) translateY(-2px);
      transition: transform 160ms ease;
    }

    .stage.expanded .chevron { transform: rotate(225deg) translate(-2px, -1px); }

    .stage-body {
      position: relative;
      z-index: 1;
      padding: 0 20px 22px;
    }

    .artifact-card,
    .module-mini,
    .library-card,
    .document-row,
    .review-card {
      border: 1px solid var(--line-soft);
      background: rgba(248, 250, 252, 0.72);
    }

    .artifact-card {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      width: 100%;
      padding: 14px;
      border-radius: 1.2rem;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    .artifact-card:hover {
      border-color: rgba(103, 232, 249, 0.75);
      background: rgba(255, 255, 255, 0.9);
    }

    .artifact-icon,
    .module-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: linear-gradient(145deg, #f8fafc, #fff);
      color: var(--ink-soft);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.07);
      font-weight: 750;
    }

    .artifact-icon {
      width: 42px;
      height: 42px;
      border-radius: 15px;
    }

    .artifact-copy { min-width: 0; }

    .artifact-title,
    .artifact-note { display: block; }

    .artifact-title {
      font-size: 13px;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .artifact-note {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
      overflow-wrap: anywhere;
      white-space: normal;
    }

    .artifact-symbol {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      color: #0e7490;
    }

    .artifact-symbol.idea { gap: 3px; }

    .artifact-symbol.idea i {
      display: block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 7px rgba(34, 211, 238, 0.28);
    }

    .artifact-symbol.direction::before {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 8px;
      height: 8px;
      border-top: 1.7px solid currentColor;
      border-right: 1.7px solid currentColor;
      content: "";
    }

    .artifact-symbol.direction::after {
      width: 16px;
      height: 1.7px;
      border-radius: 999px;
      background: currentColor;
      content: "";
      transform: rotate(-45deg);
    }

    .first-step {
      display: grid;
      place-items: center;
      min-height: 190px;
      padding: 24px;
      text-align: center;
    }

    .idea-prompt-icon,
    .direction-icon {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      border: 1px solid rgba(103, 232, 249, 0.64);
      background: linear-gradient(145deg, rgba(236, 254, 255, 0.95), rgba(255, 255, 255, 0.92));
      box-shadow: 0 18px 40px rgba(34, 211, 238, 0.16);
    }

    .idea-prompt-icon {
      width: 72px;
      height: 54px;
      gap: 7px;
      border-radius: 20px;
    }

    .idea-prompt-icon::after {
      position: absolute;
      right: 13px;
      bottom: -7px;
      width: 14px;
      height: 14px;
      border-right: 1px solid rgba(103, 232, 249, 0.64);
      border-bottom: 1px solid rgba(103, 232, 249, 0.64);
      background: #fff;
      content: "";
      transform: skewY(35deg);
    }

    .idea-prompt-icon i {
      position: relative;
      z-index: 1;
      display: block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #0891b2;
      box-shadow: 0 0 10px rgba(34, 211, 238, 0.28);
    }

    .direction-icon {
      width: 58px;
      height: 58px;
      border-radius: 21px;
      color: #0891b2;
      font-size: 24px;
      font-weight: 650;
    }

    .first-step > div > span {
      display: block;
      margin-top: 16px;
      color: var(--muted);
      font-size: 12px;
    }

    /* DNA modules and documents */
    .module-mini-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .module-mini {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 152px;
      padding: 14px;
      border-radius: 1.2rem;
      overflow: hidden;
      text-align: left;
    }

    button.module-mini { cursor: pointer; }
    button.module-mini:hover { border-color: rgba(103, 232, 249, 0.75); background: #fff; }

    .module-mark {
      width: 52px;
      height: 38px;
      border-radius: 14px;
      font-size: 9px;
      letter-spacing: 0.08em;
    }

    .module-mini[data-tone="brand"] .module-mark,
    .module-detail-head[data-tone="brand"] .module-mark,
    .library-card[data-tone="brand"] .module-mark {
      border-color: rgba(251, 191, 36, 0.48);
      background: linear-gradient(145deg, rgba(255, 251, 235, 0.98), #fff);
      box-shadow: 0 12px 26px rgba(245, 158, 11, 0.1);
    }

    .module-mini[data-tone="software"] .module-mark,
    .module-detail-head[data-tone="software"] .module-mark,
    .library-card[data-tone="software"] .module-mark {
      border-color: rgba(103, 232, 249, 0.62);
      background: linear-gradient(145deg, rgba(236, 254, 255, 0.98), #fff);
      box-shadow: 0 12px 26px rgba(34, 211, 238, 0.12);
    }

    .module-mini[data-tone="product"] .module-mark,
    .module-detail-head[data-tone="product"] .module-mark,
    .library-card[data-tone="product"] .module-mark {
      border-color: rgba(125, 211, 252, 0.66);
      background: linear-gradient(145deg, rgba(224, 242, 254, 0.98), #fff);
      box-shadow: 0 12px 26px rgba(2, 132, 199, 0.11);
    }

    .module-mini[data-tone="experience"] .module-mark,
    .module-detail-head[data-tone="experience"] .module-mark,
    .library-card[data-tone="experience"] .module-mark {
      border-color: rgba(110, 231, 183, 0.66);
      background: linear-gradient(145deg, rgba(236, 253, 245, 0.98), #fff);
      box-shadow: 0 12px 26px rgba(5, 150, 105, 0.11);
    }

    .module-mini[data-tone="commercial"] .module-mark,
    .module-detail-head[data-tone="commercial"] .module-mark,
    .library-card[data-tone="commercial"] .module-mark {
      border-color: rgba(167, 139, 250, 0.68);
      background: linear-gradient(145deg, rgba(245, 243, 255, 0.98), #fff);
      box-shadow: 0 12px 26px rgba(124, 58, 237, 0.11);
    }

    .module-mini[data-tone="growth"] .module-mark,
    .module-detail-head[data-tone="growth"] .module-mark,
    .library-card[data-tone="growth"] .module-mark {
      border-color: rgba(163, 230, 53, 0.68);
      background: linear-gradient(145deg, rgba(247, 254, 231, 0.98), #fff);
      box-shadow: 0 12px 26px rgba(101, 163, 13, 0.11);
    }

    .module-mini[data-tone="legal"] .module-mark,
    .module-detail-head[data-tone="legal"] .module-mark,
    .library-card[data-tone="legal"] .module-mark {
      border-color: rgba(251, 113, 133, 0.64);
      background: linear-gradient(145deg, rgba(255, 241, 242, 0.98), #fff);
      box-shadow: 0 12px 26px rgba(225, 29, 72, 0.1);
    }

    .module-mini[data-tone="operations"] .module-mark,
    .module-detail-head[data-tone="operations"] .module-mark,
    .library-card[data-tone="operations"] .module-mark {
      border-color: rgba(129, 140, 248, 0.66);
      background: linear-gradient(145deg, rgba(238, 242, 255, 0.98), #fff);
      box-shadow: 0 12px 26px rgba(79, 70, 229, 0.1);
    }

    .module-mini-title {
      margin-top: 13px;
      overflow: hidden;
      min-height: 18px;
      font-size: 12px;
      font-weight: 650;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .module-mini-state {
      margin-top: 2px;
      color: var(--faint);
      font-size: 11px;
      line-height: 1.35;
    }

    .module-mini-status {
      display: grid;
      gap: 7px;
      margin-top: auto;
      padding-top: 12px;
    }

    .module-mini-summary {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--faint);
      font-size: 11px;
      font-weight: 750;
      line-height: 1.2;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .module-strand {
      display: grid;
      grid-template-columns: repeat(var(--strand-count), minmax(0, 1fr));
      gap: 4px;
      min-height: 8px;
    }

    .strand-cell {
      height: 8px;
      border: 1px solid rgba(203, 213, 225, 0.88);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.62);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.36);
    }

    .strand-cell.scoped {
      border-color: rgba(148, 163, 184, 0.5);
      background: rgba(226, 232, 240, 0.82);
    }

    .strand-cell.drafting {
      border-color: rgba(103, 232, 249, 0.72);
      background: rgba(207, 250, 254, 0.92);
    }

    .strand-cell.complete {
      border-color: rgba(110, 231, 183, 0.76);
      background: rgba(167, 243, 208, 0.95);
    }

    .strand-cell.issue {
      border-color: rgba(251, 113, 133, 0.74);
      background: rgba(255, 228, 230, 0.96);
    }

    .module-mini[data-tone="brand"] .strand-cell.drafting {
      border-color: rgba(251, 191, 36, 0.68);
      background: rgba(254, 243, 199, 0.94);
    }

    .module-mini[data-tone="brand"] .strand-cell.complete {
      border-color: rgba(245, 158, 11, 0.56);
      background: rgba(253, 230, 138, 0.88);
    }

    .module-selected {
      position: absolute;
      top: 14px;
      right: 14px;
      color: var(--emerald);
      font-size: 12px;
      font-weight: 800;
    }

    .module-add {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 3px;
      border-style: dashed;
      color: var(--faint);
      cursor: default;
    }

    .plus-icon {
      position: relative;
      display: block;
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
    }

    .plus-icon::before,
    .plus-icon::after {
      position: absolute;
      top: 50%;
      left: 50%;
      border-radius: 999px;
      background: currentColor;
      content: "";
      transform: translate(-50%, -50%);
    }

    .plus-icon::before { width: 16px; height: 1.5px; }
    .plus-icon::after { width: 1.5px; height: 16px; }

    .module-add > small {
      max-width: 120px;
      font-size: 9px;
      font-weight: 650;
      line-height: 1.35;
      text-align: center;
    }

    .quiet-empty {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      min-height: 116px;
    }

    .quiet-empty-card {
      display: grid;
      align-content: center;
      gap: 10px;
      min-height: 116px;
      padding: 18px;
      border: 1px dashed rgba(203, 213, 225, 0.78);
      border-radius: 1.2rem;
      background: rgba(248, 250, 252, 0.46);
      opacity: 0.72;
    }

    .quiet-empty-card::before {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(203, 213, 225, 0.9);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.72);
      content: "";
    }

    .quiet-empty-card::after {
      width: min(82%, 120px);
      height: 8px;
      border-radius: 999px;
      background: rgba(203, 213, 225, 0.58);
      content: "";
    }

    .scope-stack { display: grid; gap: 10px; }

    .scope-module {
      padding: 13px 14px;
      border: 1px solid var(--line-soft);
      border-radius: 1.15rem;
      background: rgba(248, 250, 252, 0.65);
    }

    .scope-module-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      font-size: 12px;
      font-weight: 650;
    }

    .scope-docs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .scope-doc {
      padding: 5px 8px;
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 10px;
      box-shadow: inset 0 0 0 1px rgba(226, 232, 240, 0.9);
    }

    .block-map { display: grid; gap: 18px; }

    .block-module-title {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .implementation-document {
      display: grid;
      gap: 10px;
      padding-top: 13px;
      border-top: 1px solid var(--line-soft);
    }

    .document-heading {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: baseline;
    }

    .document-id {
      color: var(--muted);
      font: 11px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace;
      overflow-wrap: anywhere;
      text-align: right;
    }

    .document-title {
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 650;
    }

    .blocks {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 8px;
    }

    .dna-block,
    .skeleton-block {
      min-height: 64px;
      border-radius: 16px;
    }

    .dna-block {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid rgba(203, 213, 225, 0.88);
      overflow: hidden;
      background: rgba(255, 255, 255, 0.84);
      color: var(--ink-soft);
      text-align: left;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
      transition: box-shadow 150ms ease, border-color 150ms ease;
    }

    .dna-block:hover {
      box-shadow: 0 16px 32px rgba(15, 23, 42, 0.11);
    }

    .dna-block.in_progress {
      border-color: rgba(148, 163, 184, 0.9);
      background: rgba(255, 255, 255, 0.92);
    }

    .dna-block.implemented {
      border-color: rgba(100, 116, 139, 0.58);
      background: rgba(248, 250, 252, 0.96);
    }

    .dna-block.verified {
      border-color: rgba(15, 23, 42, 0.24);
      background: rgba(248, 250, 252, 0.98);
    }

    .dna-block.blocked,
    .dna-block.invalid {
      border-color: rgba(251, 113, 133, 0.72);
      background: var(--rose-soft);
    }

    .dna-block.superseded {
      border-style: dashed;
      opacity: 0.62;
    }

    .dna-block.not_applicable {
      border-style: dotted;
      background: transparent;
    }

    .block-copy {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .block-slice {
      color: var(--muted);
      font: 750 10px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .block-progress-ring {
      position: relative;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: conic-gradient(var(--ring-color, var(--ink-soft)) calc(var(--block-progress, 0) * 1%), rgba(226, 232, 240, 0.92) 0);
      color: var(--ink-soft);
      font: 800 12px/1 "Segoe UI", sans-serif;
    }

    .block-progress-ring::before {
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      background: #fff;
      content: "";
    }

    .block-progress-ring > span {
      position: relative;
      z-index: 1;
    }

    .dna-block.superseded .block-progress-ring::after {
      position: absolute;
      z-index: 2;
      width: 18px;
      height: 1.5px;
      border-radius: 999px;
      background: currentColor;
      content: "";
      transform: rotate(-35deg);
    }

    .block-progress-ring.complete { --ring-color: var(--ink-soft); }
    .block-progress-ring.working { --ring-color: #64748b; }
    .block-progress-ring.issue { --ring-color: var(--rose); color: var(--rose); }
    .block-progress-ring.muted { --ring-color: #94a3b8; color: var(--faint); }

    .block-title {
      overflow: hidden;
      font-size: 11px;
      font-weight: 650;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .skeleton-block,
    .skeleton-line {
      border: 1px solid rgba(226, 232, 240, 0.86);
      background:
        linear-gradient(120deg, rgba(241, 245, 249, 0.76), rgba(255, 255, 255, 0.88) 48%, rgba(226, 232, 240, 0.54));
    }

    .skeleton-block { opacity: 0.62; }

    .skeleton-line {
      height: 9px;
      border-radius: 999px;
    }

    .review-card {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 18px;
      align-items: center;
      padding: 16px;
      border-radius: 1.25rem;
    }

    .progress-ring {
      --progress: 0;
      position: relative;
      display: grid;
      place-items: center;
      width: 70px;
      height: 70px;
      border-radius: 24px;
      background: conic-gradient(#22d3ee calc(var(--progress) * 1%), rgba(226, 232, 240, 0.76) 0);
      box-shadow: 0 14px 30px rgba(34, 211, 238, 0.12);
    }

    .progress-ring::before {
      position: absolute;
      inset: 7px;
      border-radius: 18px;
      background: #fff;
      content: "";
    }

    .progress-ring strong {
      position: relative;
      z-index: 1;
      font-size: 13px;
    }

    .review-title { font-size: 14px; font-weight: 650; }
    .review-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 8px;
    }

    .metric {
      padding: 5px 8px;
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 10px;
      box-shadow: inset 0 0 0 1px rgba(226, 232, 240, 0.88);
    }

    .metric.warn { color: var(--rose); }

    .library-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-left: 0;
    }

    .library-card {
      position: relative;
      min-height: 270px;
      padding: 94px 20px 20px;
      border-radius: 1.6rem;
      color: inherit;
      text-align: left;
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.07);
    }

    button.library-card {
      cursor: pointer;
      transition: box-shadow 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    button.library-card:hover {
      border-color: rgba(103, 232, 249, 0.72);
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 20px 46px rgba(15, 23, 42, 0.12);
    }

    .library-card .module-mark {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 66px;
      height: 54px;
      border-radius: 20px;
      font-size: 11px;
    }

    .library-status {
      position: absolute;
      top: 20px;
      right: 20px;
      display: grid;
      gap: 3px;
      justify-items: end;
      text-align: right;
    }

    .installed {
      color: var(--emerald);
      font-size: 10px;
      font-weight: 750;
      white-space: nowrap;
    }

    .library-version {
      color: var(--faint);
      font: 9px/1.3 ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .library-title {
      margin-top: 0;
      font-size: 17px;
      font-weight: 650;
      letter-spacing: -0.025em;
    }

    .library-groups {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 14px;
    }

    .library-group {
      padding: 5px 8px;
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 9px;
      box-shadow: inset 0 0 0 1px rgba(226, 232, 240, 0.9);
    }

    .library-count {
      position: absolute;
      right: 20px;
      bottom: 18px;
      color: var(--faint);
      font-size: 10px;
    }

    .library-add {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 7px;
      border-style: dashed;
      box-shadow: none;
      color: var(--faint);
      padding: 20px;
    }

    .library-add .plus-icon { width: 28px; height: 28px; }
    .library-add .plus-icon::before { width: 22px; }
    .library-add .plus-icon::after { height: 22px; }
    .library-add > small {
      max-width: 150px;
      font-size: 10px;
      font-weight: 650;
      line-height: 1.4;
      text-align: center;
    }

    .page-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      width: 100%;
      margin: 108px auto 0;
      padding: 24px 12px 8px;
      border-top: 1px solid rgba(203, 213, 225, 0.5);
      color: rgba(100, 116, 139, 0.72);
      font-size: 10px;
    }

    .footer-version {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: 0.02em;
    }

    .footer-links {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .footer-links a {
      color: inherit;
      text-decoration: none;
      transition: color 150ms ease;
    }

    .footer-links a:hover { color: var(--ink-soft); }

    .scrim {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(15, 23, 42, 0.13);
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(1px);
      transition: opacity 180ms ease;
    }

    .scrim.open {
      opacity: 1;
      pointer-events: auto;
    }

    /* Inspector and document reader */
    .inspector {
      position: fixed;
      top: 20px;
      right: 20px;
      bottom: 20px;
      z-index: 70;
      display: flex;
      width: min(680px, calc(100vw - 40px));
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 2rem;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow-float);
      opacity: 0;
      pointer-events: none;
      transform: translateX(calc(100% + 40px));
      transition: opacity 190ms ease, transform 260ms cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(40px);
    }

    .inspector.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
    }

    .inspector::before {
      position: absolute;
      inset: 0 0 auto;
      height: 84px;
      background: linear-gradient(180deg, rgba(203, 213, 225, 0.66), rgba(241, 245, 249, 0.24), transparent);
      content: "";
      pointer-events: none;
    }

    .inspector-head {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: start;
      padding: 22px 22px 17px;
      border-bottom: 1px solid var(--line-soft);
    }

    .back-button { grid-column: 1; }

    .inspector-heading {
      grid-column: 2;
      min-width: 0;
    }

    .inspector-head > .close-button { grid-column: 3; }

    .inspector-eyebrow {
      color: #0e7490;
      font-size: var(--sidecar-meta);
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .inspector-title {
      margin: 5px 0 0;
      color: var(--ink);
      font-size: var(--sidecar-title);
      font-weight: 650;
      letter-spacing: -0.035em;
      line-height: 1.12;
    }

    .inspector-meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .back-button,
    .close-button {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(203, 213, 225, 0.82);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.82);
      color: var(--muted);
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
      font-size: 18px;
      transition: border-color 150ms ease, box-shadow 150ms ease, color 150ms ease;
    }

    .back-button:hover,
    .close-button:hover {
      border-color: rgba(148, 163, 184, 0.86);
      color: var(--ink);
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.1);
    }

    .inspector-body {
      min-height: 0;
      flex: 1;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 22px;
      scrollbar-color: rgba(148, 163, 184, 0.34) transparent;
      scrollbar-width: thin;
    }

    .inspector-foot {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 58px;
      padding: 10px 22px;
      border-top: 1px solid var(--line-soft);
      background: rgba(248, 250, 252, 0.72);
    }

    .source-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
      text-decoration: none;
    }

    .source-link:hover { color: var(--ink); }

    .reader {
      min-width: 0;
      color: #334155;
      font-size: 13px;
      line-height: 1.72;
      overflow-wrap: anywhere;
    }
    .reader > :first-child { margin-top: 0; }
    .reader > :last-child { margin-bottom: 0; }
    .reader h1,
    .reader h2,
    .reader h3,
    .reader h4 {
      margin: 1.7em 0 0.55em;
      color: var(--ink);
      font-weight: 650;
      line-height: 1.22;
    }
    .reader h1 { font-size: 24px; letter-spacing: -0.04em; }
    .reader h2 { font-size: 19px; letter-spacing: -0.025em; }
    .reader h3 { font-size: 15px; }
    .reader h4 { font-size: 13px; }
    .reader p,
    .reader ul,
    .reader ol,
    .reader blockquote,
    .reader pre,
    .reader table { margin: 0.85em 0 0; }
    .reader ul,
    .reader ol { padding-left: 1.4rem; }
    .reader li + li { margin-top: 0.25em; }
    .reader blockquote {
      padding: 0.2rem 0 0.2rem 1rem;
      border-left: 2px solid rgba(34, 211, 238, 0.6);
      color: var(--muted);
    }
    .reader code {
      padding: 0.1rem 0.32rem;
      border-radius: 0.35rem;
      background: rgba(241, 245, 249, 0.92);
      color: var(--ink-soft);
      font: 0.92em/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    .reader pre {
      overflow-x: auto;
      padding: 14px;
      border: 1px solid var(--line-soft);
      border-radius: 1rem;
      background: rgba(248, 250, 252, 0.92);
    }
    .reader pre code { padding: 0; background: transparent; }
    .reader a { color: #0e7490; text-underline-offset: 2px; }
    .reader hr { margin: 1.3rem 0; border: 0; border-top: 1px solid var(--line-soft); }
    .reader table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }
    .reader th,
    .reader td {
      padding: 8px;
      border: 1px solid var(--line-soft);
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
    }
    .reader th { background: rgba(241, 245, 249, 0.82); color: var(--ink); }

    .empty-reader {
      display: grid;
      place-items: center;
      min-height: 260px;
      color: var(--faint);
    }

    .empty-reader .empty-icon {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border: 1px dashed rgba(148, 163, 184, 0.56);
      border-radius: 18px;
      background: rgba(248, 250, 252, 0.72);
    }

    .empty-reader .empty-icon .ui-icon { width: 18px; height: 18px; }

    .empty-lines {
      display: grid;
      width: min(220px, 80%);
      gap: 8px;
      margin-top: 18px;
    }

    .empty-reader.compact .empty-lines { margin-top: 0; }

    .empty-lines .skeleton-line:nth-child(2) { width: 78%; }
    .empty-lines .skeleton-line:nth-child(3) { width: 58%; }

    .search-panel {
      display: grid;
      gap: 16px;
    }

    .search-field {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 11px;
      align-items: center;
      min-height: 48px;

ed, or grown beyond a known private audience. Consider it for most public-launch and venture-intent products even when the first growth plan is deliberately small.","selection_signals":["The product will have a public website, app-store presence, search surface, launch, campaign, sales path, community, or acquisition channel.","Audience positioning, messaging, discoverability, conversion, onboarding handoff, retention, referral, or re-engagement could determine adoption.","The concept needs market tests, channel learning, growth targets, or attribution to avoid building without a credible route to users."],"owns":["Priority market-facing audiences, channel strategy, public positioning application, message architecture, and launch sequencing.","SEO, ASO, public landing, acquisition, conversion, lifecycle, referral, content, campaign, and creative direction.","Growth funnels, channel measures, attribution intent, growth experimentation, and responsible-growth guardrails across market-facing activity."],"does_not_own":["Core user problem, product value, product priorities, or evidence owned by Product Strategy and Evidence DNA.","Enduring identity owned by Brand Identity DNA or in-product journeys and interface content owned by Product Design and Experience DNA.","Pricing and commercial policy owned by Commercial and Economics DNA or technical implementation owned by Software Application DNA.","Legal, policy, and regulatory interpretation affecting claims, consent, or distribution rules owned by Legal, Policy and Market Access DNA.","Operational service-support communications owned by Service Operations and Support DNA."],"coordinates_with":{"_DNA-PSTR":"Use evidence, audiences, alternatives, value, assumptions, and product outcomes as the basis for market-facing choices and learning.","_DNA-BRND":"Apply the enduring identity, voice, and visual direction consistently across public and campaign touchpoints.","_DNA-PDEX":"Coordinate landing, acquisition, referral, store, onboarding, and lifecycle touchpoints as one coherent user journey.","_DNA-COMM":"Align offers, channel economics, acquisition cost, conversion, packaging, and commercial measurement.","_DNA-SAPP":"Supply discoverability, analytics, experimentation, metadata, performance, and integration requirements for implementation.","_DNA-LEGL":"Verify public claims, endorsements, tracking, consent, promotions, direct marketing, platform policy, and market-specific constraints before launch.","_DNA-SOPS":"Coordinate support, service availability, fulfilment capacity, and customer communication with launch and growth promises."},"live_verification":["Verify current search and store guidance, channel capabilities, platform policies, market language, competitor presence, audience behaviour, and acquisition benchmarks when material.","Distinguish sourced market evidence and measured product data from hypotheses; do not invent demand, rankings, traffic, conversion, or channel performance.","Use current platform rules for ratings, reviews, referrals, messaging, advertising, and discovery. Reject deception, coercion, fabricated proof, spam, exploitative targeting, review or ranking manipulation, and engagement pursued without user value."],"timing":{"consider_early":"Consider whenever the product needs real users, a public launch, revenue, validation of demand, or a route to adoption so discoverability and channel constraints can shape the foundation.","can_defer_when":"May be light or deferred for a private proof intended only to validate feasibility with a known audience and no public claim, launch commitment, or route-to-market decision.","must_not_defer_when":"Do not defer when public discovery, app-store presence, market testing, acquisition, launch sequencing, or growth economics are necessary to prove the concept or meet the agreed outcome."}},"version":"0.1.0","schema_version":"3.0.0","documentation_label":"market presence and growth documentation","selected":false,"selected_ reative","when_relevant":"Use when ongoing content or multiple creative outputs are needed to build awareness, trust, education, demand, or channel performance.","intent":null,"parent_id":null,"baseline":false,"expressed":false,"processing_status":"container","block_count":0,"contract_errors":[]},"00601":{"id":"00601","qualified_id":"_DNA-GROW-00601","type":"file","title":"Content Strategy","when_relevant":null,"intent":"Define audience needs, content roles, themes, formats, channels, editorial quality, evidence, accessibility, ownership, cadence, lifecycle, reuse, and measurement for useful content rather than volume for its own sake.","parent_id":"00600","baseline":true,"expressed":false,"processing_status":"not_started","block_count":0,"contract_errors":[]},"00602":{"id":"00602","qualified_id":"_DNA-GROW-00602","type":"file","title":"Campaign and Creative Briefs","when_relevant":null,"intent":"Use when creative production needs a concise brief covering objective, audience, single-minded message, evidence, brand application, mandatory content, channel constraints, variants, handoff, and acceptance criteria.","parent_id":"00600","baseline":false,"expressed":false,"processing_status":"not_started","block_count":0,"contract_errors":[]},"00700":{"id":"00700","qualified_id":"_DNA-GROW-00700","type":"directory","title":"Growth Measurement","when_relevant":"Define how market presence and growth decisions will be measured without confusing reach, activity, conversion, retention, commercial value, and product outcomes.","intent":null,"parent_id":null,"baseline":true,"expressed":false,"processing_status":"container","block_count":0,"contract_errors":[]},"00701":{"id":"00701","qualified_id":"_DNA-GROW-00701","type":"file","title":"Funnel and Channel Measurement","when_relevant":null,"intent":"Define decision-relevant acquisition, activation-handoff, conversion, lifecycle, and channel measures with calculation boundaries, source, segmentation, cadence, owner, caveats, and intended action.","parent_id":"00700","baseline":true,"expressed":false,"processing_status":"not_started","block_count":0,"contract_errors":[]},"00702":{"id":"00702","qualified_id":"_DNA-GROW-00702","type":"file","title":"Attribution and Growth Experiments","when_relevant":null,"intent":"Use when causal learning or channel credit matters to define attribution limitations, privacy boundaries, experiment hypotheses, guardrails, exposure, success criteria, decision rules, and learning capture without claiming certainty the design cannot support.","parent_id":"00700","baseline":false,"expressed":false,"processing_status":"not_started","block_count":0,"contract_errors":[]},"00800":{"id":"00800","qualified_id":"_DNA-GROW-00800","type":"directory","title":"Sales and Partnerships","when_relevant":"Use when adoption depends on a human-led, sales-assisted, procurement, reseller, affiliate, channel-partner, platform-partner, or strategic-partnership motion rather than only self-service acquisition.","intent":null,"parent_id":null,"baseline":false,"expressed":false,"processing_status":"container","block_count":0,"contract_errors":[]},"00801":{"id":"00801","qualified_id":"_DNA-GROW-00801","type":"file","title":"Sales Motion and Pipeline","when_relevant":null,"intent":"Define buyer and influencing roles, self-serve versus sales-assisted boundaries, qualification, stages, evidence, procurement and security handoffs, ownership, product or service handoff, measurement, and learning without redefining product value, pricing, contracts, or customer-success operations.","parent_id":"00800","baseline":true,"expressed":false,"processing_status":"not_started","block_count":0,"contract_errors":[]},"00802":{"id":"00802","qualified_id":"_DNA-GROW-00802","type":"file","title":"Partnership Strategy","when_relevant":null,"intent":"Define each partner type, reciprocal value, audience and channel fit, responsibilities, dependencies, lead or customer ownership, handoffs, attribution, incentives, measurement, conflicts, review gates, and exit conditions in coordination with commercial, legal, and service owners.","parent_id":"00800","baseline":true,"expressed":false,"processing_status":"not_started","block_count":0,"contract_errors":[]}}},"_DNA-LEGL":{"source_path":"_dna/_DNA-LEGL.yaml","dna_code":"LEGL","canonical_id":"_DNA-LEGL","name":"Legal, Policy and Market Access DNA","description":"A guarded, consequence-activated catalogue for detecting legal, regulatory, privacy, platform-policy, and market-access constraints early; maintaining source-linked obligations and review gates; and preparing focused questions and evidence for qualified review. It does not provide legal advice, decide that a product is compliant, or replace a suitably qualified professional.","module_contract":{"when_relevant":"Use when intended users, data, claims, content, money movement, distribution, geography, sector, or service model may create legal, regulatory, privacy, consumer, intellectual-property, accessibility, or platform-policy consequences. Initial detection is deliberately lightweight; depth follows risk and consequence rather than project size or maturity.","selection_signals":["The product will launch publicly, enter an app store or marketplace, operate across countries, or make eligibility, safety, performance, financial, health, professional, environmental, or comparative claims.","The product involves personal or sensitive data, tracking, children or vulnerable people, health, finance, education, employment, identity, location, communications, user-generated content, AI decisions, or regulated goods or services.","Users will pay, subscribe, transact, receive credit or payouts, accept terms, upload licensed material, encounter advertising, or rely on consequential information or recommendations."],"owns":["Jurisdiction and market-access map, regulatory and policy classification, consequence triage, review gates, and qualified-review plan.","Source-linked obligation and evidence register covering privacy, consumer, accessibility, claims, content, intellectual property, distribution, and other applicable domains.","Legal-policy inputs for notices, consent, rights, terms, disclosures, claims, records, retention, and review cadence.","Explicit uncertainty, assumptions, source dates, unresolved questions, and matters requiring qualified professional judgment."],"does_not_own":["Technical security, privacy, payment, data, accessibility, or compliance-control implementation owned by Software Application DNA.","User-facing disclosure and consent experience owned by Product Design and Experience DNA.","Commercial choices and customer promises owned by Commercial and Economics DNA or market strategy and campaign execution owned by Market Presence and Growth DNA.","Product strategy, brand identity, service operations, or a declaration that the product is legally compliant.","Trust and safety strategy, abuse or moderation policy, marketplace or network integrity, AI product assurance, clinical or professional safety, and sector-specific regulated practice. This module detects and routes those needs but does not replace their specialist owners."],"coordinates_with":{"_DNA-PSTR":"Receive intended users, claims, outcomes, evidence, geography, data use, and risk assumptions that may trigger obligations or review.","_DNA-PDEX":"Supply verified requirements for notice, consent, rights, accessibility, disclosures, controls, and comprehensible user-facing policy experiences.","_DNA-BRND":"Review naming, identity assets, endorsements, claims, and protected or licensed brand material where consequential.","_DNA-SAPP":"Supply current obligation and evidence requirements for technical controls, data handling, platform submission, testing, and auditability.","_DNA-COMM":"Review payment, subscription, cancellation, refund, promotion, tax, marketplace, and other customer-commercial obligations without choosing the model.","_DNA-GROW":"Review marketing claims, comparisons, endorsements, tracking, consent, direct communication, promotions, and distribution policy without choosing the campaign.","_DNA-SOPS":"Supply requirements for service records, safeguarding, complaints, escalation, accessibility, fulfilment, and customer-rights execution."},"live_verification":["Use current primary or authoritative sources for every material obligation, regulator position, platform policy, filing, deadline, or market-access decision; record jurisdiction, source link, publication or update date, retrieval date, and uncertainty.","Do not rely on model memory, generic templates, unsourced summaries, or outdated research for a consequential conclusion. Escalate ambiguity, conflict, or high impact to a suitably qualified professional.","Never describe generated analysis, wording, controls, or documents as legal advice, certification, approval, or proof of compliance."],"timing":{"consider_early":"Run a short consequence screen for any product intended for real people or public distribution; expand the module only when users, data, claims, money, geography, sector, content, or platform rules create a material trigger.","can_defer_when":"Detailed analysis may be deferred for a closed, disposable feasibility demonstration using no real personal data, money, regulated claims, public distribution, vulnerable users, or contractual commitment, provided the deferral and re-entry trigger are recorded.","must_not_defer_when":"Do not defer initial detection or the relevant review gate when real personal or sensitive data, children or vulnerable users, regulated or high-consequence activity, payments or subscriptions, public claims, user-generated content, app-store distribution, contractual commitments, or multi-market launch are planned."}},"version":"0.1.0","schema_version":"3.0.0","documentation_label":"legal, policy and market access documentation","selected":false,"selected_version":null,"totals":{"nodes":25,"directories":7,"files":18,"expressed_nodes":0,"expressed_files":0},"nodes":{"00100":{"id":"00100","qualified_id":"_DNA-LEGL-00100","type":"directory","title":"Consequence and Market Access","when_relevant":"Use first to identify jurisdictions, distribution paths, regulated contexts, affected people, and the smallest safe review path before detailed work is scoped.","intent":null,"parent_id":null,"baseline":true,"expressed":false,"processing_status":"container","block_count":0,"contract_errors":[]},"00101":{"id":"00101","qualified_id":"_DNA-LEGL-00101","type":"file","title":"Market and Jurisdiction Map","when_relevant":null,"intent":"Identify launch, operation, user, customer, data, entity, payment, and distribution locations; record why each may matter, what is unknown, and which markets are explicitly excluded or gated.","parent_id":"00100","baseline":true,"expressed":false,"processing_status":"not_started","block_count":0,"contract_errors":[]},"00102":{"id":"00102","qualified_id":"_DNA-LEGL-00102","type":"file","title":"Regulatory and Policy Classification","when_relevant":null,"intent":"Screen the intended product, claims, users, data, transactions, content, and distribution against current authoritative sources; record possible classifications, consequences, confidence, and unresolved questions without asserting a legal conclusion.","parent_id":"00100","baseline":true,"expressed":false,"processing_status":"not_started","block_count":0,"contract_errors":[]},"00103":{"id":"00103","qualified_id":"_DNA-LEGL-00103","type":"file","title":"Review Gates and Qualified Review","when_relevant":null,"intent":"Define decisions or releases that must pause, the evidence and questions needed, the appropriate type of qualified reviewer or authority, ownership, timing, and criteria for recording—not fabricating—a review outcome. A proportionate low-risk screen may record that no qualified review is required at the current stage, with its rationale and re-entry trigger.","parent_id":"00100","baseline":false,"expresse ition.","parent_id":"00200","baseline":false,"expressed":false,"processing_status":"not_started","block_count":0,"contract_errors":[]},"00204":{"id":"00204","qualified_id":"_DNA-LEGL-00204","type":"file","title":"Tracking and Marketing Permissions","when_relevant":null,"intent":"Use when cookies, SDKs, device identifiers, attribution, profiling, advertising, email, SMS, push, or similar communications require source-backed consent, preference, disclosure, suppression, record, and withdrawal requirements by market and channel.","parent_id":"00200","baseline":false,"expressed":false,"processing_status":"not_started","block_count":0,"contract_errors":[]},"00205":{"id":"00205","qualified_id":"_DNA-LEGL-00205","type":"file","title":"Incident, Breach and Notification Requirements","when_relevant":null,"intent":"Use when a security, privacy, confidentiality, safety, or service incident may trigger legal or policy duties to assess, preserve evidence, document decisions, notify an authority, affected person, customer, insurer, partner, or platform, or act within a deadline. Supply current jurisdiction-specific requirements to Software Application incident response and Service Operations escalation without owning their execution.","parent_id":"00200","baseline":false,"expressed":false,"processing_status":"not_started","block_count":0,"contract_errors":[]},"00300":{"id":"00300","qualified_id":"_DNA-LEGL-00300","type":"directory","title":"Customer and Service Obligations","when_relevant":"Use when people register, pay, subscribe, buy digital or physical goods, book services, rely on service commitments, or need complaint and redress routes.","intent":null,"parent_id":null,"baseline":false,"expressed":false,"processing_status":"container","block_count":0,"contract_errors":[]},"00301":{"id":"00301","qualified_id":"_DNA-LEGL-00301","type":"file","title":"Terms, Disclosures and Acceptance Requirements","when_relevant":null,"intent":"Identify required agreements, disclosures, contracting parties, acceptance evidence, versioning, eligibility, notices, accessible presentation, and review ownership; prepare a brief for qualified drafting rather than declaring generated terms enforceable.","parent_id":"00300","baseline":true,"expressed":false,"processing_status":"not_started","block_count":0,"contract_errors":[]},"00302":{"id":"00302","qualified_id":"_DNA-LEGL-00302","type":"file","title":"Consumer, Payment and Subscription Requirements","when_relevant":null,"intent":"Use when customers pay or subscribe to identify current requirements affecting price presentation, renewal, trials, cancellation, refunds, receipts, delivery, complaints, disputes, promotions, digital content, marketplaces, and vulnerable customers.","parent_id":"00300","baseline":false,"expressed":false,"processing_status":"not_started","block_count":0,"contract_errors":[]},"00303":{"id":"00303","qualified_id":"_DNA-LEGL-00303","type":"file","title":"Accessibility and Equal-access Requirements","when_relevant":null,"intent":"Use when jurisdiction, sector, distribution, employment, public-service, or customer context creates specific accessibility, non-discrimination, reasonable-adjustment, language, or equal-access duties beyond the product's general accessibility direction.","parent_id":"00300","baseline":false,"expressed":false,"processing_status":"not_started","block_count":0,"contract_errors":[]},"00400":{"id":"00400","qualified_id":"_DNA-LEGL-00400","type":"directory","title":"Distribution and Platform Policy","when_relevant":"Use when an app store, marketplace, payment platform, social platform, identity provider, API, embedded SDK, or other gatekeeper can constrain launch or ongoing access.","intent":null,"parent_id":null,"baseline":false,"expressed":false,"processing_status":"container","block_count":0,"contract_errors":[]},"00401":{"id":"00401","qualified_id":"_DNA-LEGL-00401","type":"file","title":"Platform Policy and Submission Requirements","when_relevant":null,"intent":"Map current platform rules, declarations, metadata, privacy disclosures, account or deletion expectations, payment constraints, review evidence, test access, age or content ratings, SDK responsibilities, and re-verification dates for each intended distribution route.","parent_id":"00400","baseline":true,"expressed":false,"processing_status":"not_started","block_count":0,"contract_errors":[]},"00402":{"id":"00402","qualified_id":"_DNA-LEGL-00402","type":"file","title":"Third-party Terms and Dependencies","when_relevant":null,"intent":"Use when platforms, APIs, models, datasets, open-source software, content, vendors, or partners impose terms, attribution, usage, territorial, data, brand, audit, continuity, or termination constraints that affect the product.","parent_id":"00400","baseline":false,"expressed":false,"processing_status":"not_started","block_count":0,"contract_errors":[]},"00500":{"id":"00500","qualified_id":"_DNA-LEGL-00500","type":"directory","title":"Claims and Promotions","when_relevant":"Use when product or marketing claims, advice, comparisons, endorsements, testimonials, influencers, pricing, availability, or promotions could create material consequences.","intent":null,"parent_id":null,"baseline":false,"expressed":false,"processing_status":"container","block_count":0,"contract_errors":[]},"00501":{"id":"00501","qualified_id":"_DNA-LEGL-00501","type":"file","title":"Claims and Promotional Review","when_relevant":null,"intent":"Inventory consequential product, health, financial, professional, performance, environmental, comparative, testimonial, influencer, price, or availability claims; link evidence and limitations; and define approval, placement, monitoring, and withdrawal gates.","parent_id":"00500","baseline":true,"expressed":false,"processing_status":"not_started","block_count":0,"contract_errors":[]},"00600":{"id":"00600","qualified_id":"_DNA-LEGL-00600","type":"directory","title":"Obligations and Evidence Governance","when_relevant":"Maintain traceable, current, owned legal and policy inputs without turning the module into a false certification system.","intent":null,"parent_id":null,"baseline":false,"expressed":false,"processing_status":"container","block_count":0,"contract_errors":[]},"00601":{"id":"00601","qualified_id":"_DNA-LEGL-00601","type":"file","title":"Obligations and Evidence Register","when_relevant":null,"intent":"Record each material question or obligation, jurisdiction, applicability basis, authoritative source and dates, uncertainty, accountable owner, required control or evidence, qualified-review status, decision, and next review trigger.","parent_id":"00600","baseline":true,"expressed":false,"processing_status":"not_started","block_count":0,"contract_errors":[]},"00602":{"id":"00602","qualified_id":"_DNA-LEGL-00602","type":"file","title":"Change Monitoring and Review Cadence","when_relevant":null,"intent":"Define which laws, regulator guidance, platform policies, classifications, claims, markets, vendors, and product changes must be rechecked, by whom, at what cadence or trigger, and how affected decisions are reopened.","parent_id":"00600","baseline":true,"expressed":false,"processing_status":"not_started","block_count":0,"contract_errors":[]},"00700":{"id":"00700","qualified_id":"_DNA-LEGL-00700","type":"directory","title":"Content, Data and Intellectual Property","when_relevant":"Use when user content, generated content, datasets, names, logos, domains, software, media, licences, or third-party intellectual property could constrain creation, distribution, training, reuse, ownership, or market entry.","intent":null,"parent_id":null,"baseline":false,"expressed":false,"processing_status":"container","block_count":0,"contract_errors":[]},"00701":{"id":"00701","qualified_id":"_DNA-LEGL-00701","type":"file","title":"Content, Data and Intellectual-property Rights","when_relevant":null,"intent":"Map ownership, permission, licence, provenance, attribution, permitted use, training or generation rights, territorial limits, user grants, takedown, expiry, and evidence for content, data, software, media, and generated material.","parent_id":"00700","baseline":true,"expressed":false,"processing_status":"not_started","block_count":0,"contract_errors":[]},"00702":{"id":"00702","qualified_id":"_DNA-LEGL-00702","type":"file","title":"Naming and Trade-mark Review","when_relevant":null,"intent":"Use when a public product or venture name, logo, domain, store listing, or market expansion warrants clearance inputs, ownership evidence, registration strategy questions, conflicts, territories, and qualified review.","parent_id":"00700","baseline":false,"expressed":false,"processing_status":"not_started","block_count":0,"contract_errors":[]}}},"_DNA-PDEX":{"source_path":"_dna/_DNA-PDEX.yaml","dna_code":"PDEX","canonical_id":"_DNA-PDEX","name":"Product Design and Experience DNA","description":"A proportionate catalogue for defining the complete human experience of a digital product: purposeful journeys, interaction, hierarchy, interface content, accessibility, adaptation, localisation, visual composition, distinctiveness, and experience verification. It converts the North Star, product evidence, and brand identity into build-ready experience direction without owning technical implementation.","module_contract":{"when_relevant":"Use when people will interact with a digital product, interface, workflow, or service touchpoint and the intended experience should be deliberate rather than inferred from generic agent defaults.","selection_signals":["The concept contains screens, journeys, onboarding, navigation, input, decisions, system feedback, or user-facing content.","Mobile, responsive, accessible, multilingual, cross-device, or emotionally sensitive use could shape the experience.","Clarity, trust, personality, visual distinctiveness, usability, or reduced cognitive load materially affect success."],"owns":["End-to-end journeys, information architecture, interaction behaviour, interface states, user control, and recovery.","UX content purpose, hierarchy, density, terminology application, and concise real-user interface copy.","Responsive and adaptive experience, accessibility direction, localisation experience, visual composition, product design-system intent, and signature experience choices.","Experience acceptance criteria, usability evaluation, and verification that rendered behaviour matches agreed direction."],"does_not_own":["User and market evidence, product value, product outcomes, or prioritisation owned by Product Strategy and Evidence DNA.","Stable brand voice, logo, colour, typography, and enduring art direction owned by Brand Identity DNA.","Client architecture, component implementation, data, security, deployment, or technical testing owned by Software Application DNA.","Campaign messaging, acquisition content, SEO, ASO, commercial strategy, legal interpretation, or customer-service operations."],"coordinates_with":{"_DNA-PSTR":"Translate evidence, product value, priorities, and outcomes into an experience that can be evaluated against them.","_DNA-BRND":"Apply approved brand voice and visual primitives while preserving product clarity, accessibility, and interaction needs.","_DNA-SAPP":"Provide build-ready experience contracts and acceptance criteria for technical implementation and verification.","_DNA-COMM":"Translate pricing, packaging, entitlements, payments, and commercial policies into clear and trustworthy customer experiences.","_DNA-GROW":"Coordinate acquisition, landing, store, referral, and lifecycle touchpoints without letting conversion goals weaken user clarity or control.","_DNA-LEGL":"Translate disclosure, consent, rights, policy, and market-access requirements into comprehensible user-facing behaviour.","_DNA-SOPS":"Connect the product journey with support, fulfilment, handoff, complaint, and recovery experiences."},"live_verification":["Verify current accessibility standards, platform interaction
