tle":null,"content":{"seed":{"title":"_brainwave Seed","path":"_my_brainwave_seed.md","markdown":""},"north_star":{"title":"North Star","path":"_my_brainwave_north_star.md","markdown":""},"decisions":{"title":"Decision history","path":"_decisions_log.md","markdown":"# _brainwave Decisions Log\n\nPurpose: preserve only material rationale for North Star direction, DNA module selection, and DNA document scope. Domain decisions belong in the relevant generated document or ADR; operational continuation belongs in a handover.\n\n## Entry Template\n\n- timestamp:\n- trigger:\n- decision:\n- rationale:\n- alternatives_considered:\n- impact_on_dna:\n- approved_by:\n"},"handbook":{"title":"_brainwave Handbook","path":"_brainwave_handbook.md","markdown":"# _brainwave Handbook\n\n_brainwave turns an original idea into an agreed North Star and a proportionate set of domain documentation before downstream work begins. It is active while the idea and documentation are shaped, then becomes passive once that foundation is accepted.\n\n## Lifecycle\n\n`_brainwave_state.yaml` owns one authoritative stage:\n\n1. `awaiting_seed` — **Capture the idea:** discuss and preserve the immutable _brainwave Seed.\n2. `shaping_north_star` — **Agree the direction:** develop the living North Star, confirm how far the current idea should be taken, and explicitly agree the result.\n3. `selecting_dna` — **Choose DNA modules:** recommend relevant domains and record the agreed modules.\n4. `scoping_brainwave_documentation` — **Scope DNA documents:** agree the proportionate documents needed from those modules.\n5. `building_brainwave_documentation` — **Build DNA documentation:** complete the scoped documents and their traceable DNA blocks.\n6. `reviewing_brainwave_documentation` — **Review the foundation:** check gaps, conflicts, cross-module consistency, and downstream readiness.\n7. `brainwave_documentation_complete` — **Ready for implementation:** remain passive unless the user explicitly reopens _brainwave.\n\nA completed _brainwave returns to `shaping_north_star` when direction changes, `selecting_dna` when the relevant domains change, or `scoping_brainwave_documentation` when only DNA document scope changes.\n\n## Guidance Modes\n\nDuring onboarding, _brainwave asks whether to use:\n\n- `guided` — concise stage signposting, a seven-step journey at orientation and approval points, plain-language explanations of unfamiliar terms, and early links to this handbook and `_dashboard.html`\n- `concise` — the current step and immediate next action, with more explanation only when needed or requested\n\nGuidance mode controls explanation of the process. The separate detail setting controls the depth of working output and documentation. Guided mode does not make every response longer, and the journey is not repeated during routine shaping questions.\n\nThe user-facing journey is:\n\n1. Capture the idea.\n2. Agree the direction.\n3. Choose DNA modules.\n4. Scope DNA documents.\n5. Build DNA documentation.\n6. Review the foundation.\n7. Ready for implementation.\n\n## Providing the Seed\n\nThe user can choose either route:\n\n- **Discuss the concept:** develop it with the agent, then explicitly approve what is captured.\n- **Use a prepared concept:** paste it into chat for verbatim capture, or save it directly in `_my_brainwave_seed.md`.\n\nFor the direct-file route, save the concept and tell the agent: `build concept using the seed file exactly as written`. Saving the file does not lock it. The engine locks its hash only after confirmation and transition to `shaping_north_star`.\n\n## Agreeing What Will Be Built\n\nDuring North Star shaping, _brainwave asks **How far would you like us to take this idea?** after the concept is understood well enough for the choice to be meaningful:\n\n- **Show me the idea** — create something people can see and try; sample data and simulated behaviour are acceptable, and it is not intended for real use.\n- **Build a usable first version** — the agreed essential capabilities work properly for real users, and anything saved for later is identified and agreed upfront.\n- **Build the complete product** — everything agreed as part of the current product direction works properly for its intended users, with nothing inside that boundary left as a mock-up, placeholder, or unfinished future task.\n- A user-defined outcome when none of these expresses the intended result.\n\nThere is no default. The agent explains the selected outcome in the context of the concept and obtains confirmation before recording it in `_settings.yaml`. The North Star summarises the agreed meaning under **What We Are Building**. Detailed included, postponed, and excluded capabilities and their completion conditions belong in the relevant DNA documentation rather than turning the North Star into a feature catalogue.\n\nThe chosen outcome changes the breadth of what is built, not the care applied inside that boundary. A demonstration may deliberately use simulated behaviour; a usable or complete product requires real behaviour within its agreed scope. If a prototype may later become the product, _brainwave considers that trajectory before accepting a shortcut that would make the next step unnecessarily expensive.\n\n## Progressive Discovery\n\n_brainwave does not present a long setup questionnaire. It interprets what the user has already supplied, asks one to three high-leverage questions at a time, and uses each answer to decide which branch is relevant next.\n\nEarly questions concentrate on decisions that reshape many later choices: intended outcome and trajectory, users and use context, platforms and reach, countries and languages, identity and experience expectations, data and interaction risk, and AI behaviour. The agent also routes four venture-and-launch lenses without reciting them as a form: who funds the product and what could make it uneconomic; how people will discover and adopt it; whether users, data, claims, money, markets, sectors, or distribution create legal or policy consequences; and whether human or partner service, support, scheduling, fulfilment, or escalation delivers part of the value. Deeper details stay with their owning DNA documents.\n\nAt natural checkpoints the agent briefly reflects what is understood, what material area comes next, and what has safely been deferred. Before agreeing the North Star or recommending DNA, it checks that every material concern is understood as relevant, deliberately deferred, not applicable, or still unknown. Module timing distinguishes concerns that should shape the foundation now from those that can wait. Risk overrides phase: an early prototype does not justify overlooking real personal data, vulnerable users, regulated activity, payments, public claims, platform distribution, contracts, or human-dependent service. A material deferral records why it is safe and what event must reopen it. Only unknowns requiring the user's attention are surfaced.\n\nSome concepts require **specialist coverage** that the installed DNA does not provide. If trust and safety, marketplace or network integrity, AI product assurance, or regulated-sector practice needs a specialist owner that is not installed, the agent says so. It does not hide the gap inside a neighbouring module or call the foundation comprehensive; the user agrees either to add the specialist domain or to accept the explicit limitation and re-entry trigger.\n\n## Core Terms\n\n- **_brainwave Seed:** The user's explicitly approved concept, preserved in its supplied wording and natural shape. It becomes immutable after capture and is never a working-notes document.\n- **North Star:** The living current direction derived from the seed. It may evolve without altering the original seed.\n- **DNA Library:** The installed collection of DNA modules available to the project.\n- **DNA module:** A versioned, data-only catalogue of possible documentation for one domain.\n- **Module contract:** A module's explicit relevance, timing, ownership, exclusions, coordination relationships, and current-evidence needs. It keeps domain boundaries clear as the library grows.\n- **DNA document group:** A coherent folder of related DNA documents.\n- **DNA document:** One expressed document such as system context, schema strategy, or voice and tone.\n- **Baseline:** A DNA module or DNA document the agent should normally recommend when its module or parent DNA document group is relevant. It guides proportionate scoping but never overrides explicit user agreement.\n- **DNA block:** One coherent direction, obligation, or verifiable rule inside a document. It is also the smallest implementation-traceability unit.\n- **Expressed:** Agreed as relevant and recorded in the current _brainwave scope.\n- **DNA documentation:** The full generated set across all selected DNA modules.\n- **Architecture Decision Record (ADR):** One consequential architecture decision with context, alternatives, direction, and consequences. An ADR may be a DNA document, but system context, data models, user journeys, operational strategies, and brand guidance are not automatically ADRs.\n- **Steering decision:** A recorded reason for changing North Star direction, DNA module selection, or DNA document scope.\n- **Handover:** Temporary continuation state between working sessions. It is operational context, not a DNA module, DNA block, or architecture decision.\n\nThe canonical identity tree is:\n\n```text\n_DNA-SAPP                 module\n_DNA-SAPP-00300           DNA document group\n_DNA-SAPP-00302           document\n_DNA-SAPP-00302.01        block\n```\n\nThe minimum DNA block contract, implementation statuses, and supersession rules live in `_dna/README.md`.\n\n## Project Placement\n\nThe supported layout is one repository and AI workspace:\n\n```text\nproject-root/\n|-- AGENTS.md\n|-- CLAUDE.md\n|-- .cursor/hooks.json\n|-- .claude/settings.json\n|-- .codex/hooks.json\n|-- _brainwave/\n`-- app/\n```\n\nThe implementation may use another folder name. Keep it in the same repository as `_brainwave` so direction, documentation, implementation, and Git history travel together.\n\nFor a new project, use GitHub's **Use this template** action on the complete release repository. A normal clone retains the upstream _brainwave remote and must be repointed before product work. The root README and package metadata begin as framework onboarding and tooling; the project may replace them while retaining a signpost to this handbook.\n\nFor an existing project, confirm Node.js 20 or newer is installed, copy only the release `_brainwave/` directory into `project-root/_brainwave/`, then run:\n\n```text\nnode _brainwave/_engine/brainwave_runner.js integrate\n```\n\nIntegration preserves existing instructions and hook registrations. It adds or refreshes only managed _brainwave bridges and is safe to run repeatedly.\n\n`unintegrate` removes those managed root bridges and registrations without deleting `_brainwave/` or any project artifacts:\n\n```text\nnode _brainwave/_engine/brainwave_runner.js unintegrate\n```\n\n## Agent Support\n\nStatic discovery is the dependable baseline:\n\n| Agent | Static project guidance | Session hook |\n|---|---|---|\n| Cursor | `AGENTS.md` | `.cursor/hooks.json` |\n| Claude Code | `CLAUDE.md` | `.claude/settings.json` |\n| Codex | `AGENTS.md` | `.codex/hooks.json` |\n\nAll three session hooks call thin platform adapters backed by the same tool-neutral runtime. The runtime reads lifecycle state and supplies relevant context; it never interprets the concept, infers profile values from keywords, or chooses DNA.\n\nCommand hooks execute local code. Cursor, Claude Code, and Codex may ask the user to review or trust project hooks before running them. `integrate` registers all three bundled hooks for portability, but registrations are inert in tools that do not read them and may be left untrusted or disabled in supported tools. There is currently no separate static-only integration mode. Hooks are enhancements rather than the source of truth: disabling them does not remove the governing instructions or deterministic engine safeguards.\n\nIn another IDE or agent environment, begin by telling the agent to read the root `AGENTS.md`, then `_brainwave/AGENTS.md` and this handbook. If the environment uses another native instruction filename, make that file a small bridge to `_brainwave/AGENTS.md`; do not duplicate the directive. _brainwave cannot make an unknown host discover repository instructions automatically, but its workflow and engine do not depend on hooks.\n\n## The Dashboard\n\n`_dashboard.html` is the window into _brainwave. Open it directly from disk; no local server is required.\n\nIt shows:\n\n- a seven-stage vertical journey, with completed stages collapsed and the current stage in focus\n- in-dashboard previews of the seed, North Star, decisions, handbook, and expressed documents\n- the installed DNA Library, including each module's full DNA document catalogue before a concept is selected\n- document and DNA-block progress using canonical IDs and expandable block-level detail\n- a quiet project-state view for technical provenance without placing it in the main journey\n\nThe interface is intentionally presentation-led: icons, state, sequence, and visual placeholders do most of the explanatory work. Source links remain available inside previews for users who want to work directly with the files.\n\nThe dashboard is derived, not authoritative. `_dna/` owns module definitions, `_brainwave_state.yaml` owns selection, the decisions log owns material rationale, and DNA documents own block status. `_manifest.yaml` supplies the embedded dashboard snapshot.\n\nRefresh it from the project root:\n\n```text\nnode _brainwave/_engine/brainwave_runner.js refresh\n```\n\n## Bundled DNA\n\n- **`_DNA-SAPP` — Software Application DNA** produces software product and architecture documentation for applications and digital services.\n- **`_DNA-BRND` — Brand Identity DNA** produces enduring verbal and visual identity guidance without expanding into campaigns, acquisition, or go-to-market planning.\n- **`_DNA-PSTR` — Product Strategy and Evidence DNA** grounds product value, assumptions, priorities, validation, outcomes, and product measurement in explicit evidence.\n- **`_DNA-PDEX` — Product Design and Experience DNA** defines deliberate journeys, interaction, interface content, hierarchy, accessibility, adaptation, localisation, distinctiveness, and experience verification.\n- **`_DNA-COMM` — Commercial and Economics DNA** defines funding, revenue, payer, pricing, packaging, monetisation, payment policy, costs, cash requirements, runway, unit economics, measurement, and commercial viability.\n- **`_DNA-GROW` — Market Presence and Growth DNA** defines market-facing positioning, channels, launch, discoverability, acquisition, conversion, sales, partnerships, lifecycle, content, responsible-growth boundaries, and measurement.\n- **`_DNA-LEGL` — Legal, Policy and Market Access DNA** detects consequential obligations, records current authoritative sources and review gates, and prepares qualified review without claiming to provide legal advice or compliance.\n- **`_DNA-SOPS` — Service Operations and Support DNA** defines human service delivery, support, customer success, fulfilment, capacity, complaints, escalation, readiness, quality, and improvement.\n\nThe agent may recommend any relevant combination. Counts and document names are read directly from the module files and dashboard, so this handbook does not duplicate their catalogues.\n\nFor a typical public venture, the agent normally considers PSTR, PDEX, SAPP, BRND, COMM, and GROW as a coherent profile. LEGL always receives a short consequence screen and expands only when users, data, claims, money, markets, sectors, content, contracts, or distribution trigger it. SOPS expands when people, partners, support, customer success, fulfilment, scheduling, execution of established moderation policy, complaints, or escalation help deliver the product's value. These are routing heuristics rather than a preset: the user still agrees the modules and the proportionate document scope.\n\nThe library direction is concentric rather than monolithic. A venture-building experience is a profile that selects several clear domains, not one module that owns an entire company. Specialist overlays may later cover trust and safety, marketplaces and networks, AI product assurance, product experimentation where it outgrows PSTR, and regulated sectors.\n\n## Working Agreement\n\n- Preserve the user's wording and natural structure when capturing the seed. Do not expand it to fill a template or infer missing content; obtain approval before any material paraphrase or restructuring.\n- Preserve `_my_brainwave_seed.md` exactly after capture.\n- Read `_my_brainwave_north_star.md` first for current direction.\n- Ask one to three high-leverage questions at a time, interpret existing answers first, and route only material follow-ups.\n- Confirm how far the user wants to take the current idea before agreeing the North Star; do not infer or default the outcome.\n- Do not require exhaustive answers; resolve or explicitly mark only materially important gaps.\n- Treat proportionality as a scope decision, not permission for weak foundations or unfinished behaviour inside the confirmed boundary.\n- Let the AI agent recommend DNA modules and DNA documents using semantic judgment. The engine validates and scaffolds; it does not interpret the idea.\n- Use each module contract to preserve timing, ownership, exclusions, coordination, and live-verification needs; use current authoritative sources for volatile external requirements.\n- In Legal, Policy and Market Access documentation, completion means the source-linked detection, questions, evidence, and review route are documented; it never means legal approval, professional advice, certification, or compliance. Preserve jurisdictions, source dates, uncertainty, and qualified-review gates.\n- Use each DNA document group's `when_relevant` as the domain gate, its baseline documents as the normal starting point, and each file's `intent` to decide which optional documents are material.\n- Obtain explicit user agreement before recording DNA module selection or DNA document scope.\n- Keep DNA definitions unchanged during a project. Project selection belongs in `_brainwave_state.yaml`.\n- Record a decision in its owning DNA block or ADR, not in the seed or a duplicate ledger.\n- After DNA documentation is complete, update only the statuses of blocks affected by downstream work. Do not reopen the lifecycle unless direction, DNA module selection, or DNA document scope changes.\n- Create a local README only for non-obvious purpose, boundaries, invariants, relationships, working rules, or known traps—not to list visible files.\n\n## Framework and Project Ownership\n\nFramework-owned files may be replaced by a future _brainwave update:\n\n- `_engine/`\n- `_dna/`\n- `_templates/`\n- `_brainwave_handbook.md`\n- `_brainwave/AGENTS.md`\n\nProject-owned files must never be overwritten by an update:\n\n- `_my_brainwave_seed.md`\n- `_my_brainwave_north_star.md`\n- `_brainwave_state.yaml`\n- `_settings.yaml`\n- `_decisions_log.md`\n- `_documentation/`\n\n`_manifest.yaml` and the state embedded in `_dashboard.html` are derived and may be regenerated. Root bridges and hook configurations are merged rather than replaced.\n\nUntil an automated updater exists, update framework-owned files only and run `integrate` followed by `refresh`. Never copy a new release wholesale over an active project. `unintegrate` removes root connections only; project-owned artifacts must be backed up and removed deliberately.\n\n## When _brainwave Is Complete\n\n`brainwave_documentation_complete` means the initial DNA documentation foundation has been accepted. It does not mean the resulting product or brand has been implemented.\n\nAt this stage, _brainwave stops announcing or initiating its workflow during ordinary development. The relevant DNA blocks remain lightweight traceability anchors: downstream agents update a block from `not_started` through `implemented` and `verified`, or mark it `blocked`, `not_applicable`, or `superseded` when appropriate.\n"}},"decisions":[],"documents":{}},"events":[]}</script>
  <script>
    (() => {
      // Configuration
      const stageDefinitions = [
        { id: "awaiting_seed", label: "_brainwave Seed", action: "Capture the idea" },
        { id: "shaping_north_star", label: "North Star", action: "Agree the direction" },
        { id: "selecting_dna", label: "DNA modules", action: "Choose DNA modules" },
        { id: "scoping_brainwave_documentation", label: "DNA documents", action: "Scope DNA documents" },
        { id: "building_brainwave_documentation", label: "DNA documents and blocks", action: "Build DNA documentation" },
        { id: "reviewing_brainwave_documentation", label: "Foundation", action: "Review the foundation" },
        { id: "brainwave_documentation_complete", label: "Implementation", action: "Ready for implementation" }
      ];

      const blockStates = Object.freeze({
        not_started: { progress: 0, ringTone: "empty", ringGlyph: "", ringLabel: "Not started" },
        in_progress: { progress: 50, ringTone: "working", ringGlyph: "", ringLabel: "In progress" },
        implemented: { progress: 100, ringTone: "complete", ringGlyph: "✓", ringLabel: "Complete" },
        verified: { progress: 100, ringTone: "complete", ringGlyph: "✓", ringLabel: "Complete" },
        blocked: { progress: 100, ringTone: "issue", ringGlyph: "!", ringLabel: "Needs attention" },
        superseded: { progress: 100, ringTone: "muted", ringGlyph: "", ringLabel: "Superseded" },
        not_applicable: { progress: 0, ringTone: "muted", ringGlyph: "−", ringLabel: "Not applicable" },
        invalid: { progress: 100, ringTone: "issue", ringGlyph: "!", ringLabel: "Needs attention" }
      });
      const defaultBlockState = blockStates.not_started;

      // Embedded snapshot and derived indexes
      const stateElement = document.getElementById("brainwave-state");
      let state = {};
      try { state = JSON.parse(stateElement.textContent || "{}"); } catch (_) {}

      const dna = state.dna || {};
      const dnaTotals = dna.totals || {};
      const progress = state.progress || {};
      const progressModules = Object.values(progress.modules || {});
      const implementation = state.implementation || {};
      const implementationTotals = implementation.totals || {};
      const modules = dna.modules || {};
      const moduleEntries = Object.entries(modules);
      const trackedFiles = state.filesystem?.tracked_files || {};
      const trackedFileEntries = Object.entries(trackedFiles);
      const blocks = Array.isArray(implementation.blocks) ? implementation.blocks : [];
      const presentation = state.presentation || {};
      const presentationContent = presentation.content || {};
      const presentationDocuments = presentation.documents || {};
      const trackedPathByQualifiedId = new Map(
        trackedFileEntries.map(([path, meta]) => [meta.qualified_node_id, path])
      );
      const blockById = new Map(blocks.map((block) => [block.id, block]));
      const blocksByDocument = new Map();
      for (const block of blocks) {
        if (!blocksByDocument.has(block.document_id)) blocksByDocument.set(block.document_id, []);
        blocksByDocument.get(block.document_id).push(block);
      }
      const expressedDocuments = moduleEntries.flatMap(([moduleId, module]) =>
        Object.values(module.nodes || {})
          .filter((node) => node.type === "file" && node.expressed)
          .map((node) => ({
            ...node,
            moduleId,
            moduleName: module.name,
            path: trackedPathByQualifiedId.get(node.qualified_id) || null
          }))
      ).sort((a, b) => a.moduleId.localeCompare(b.moduleId) || a.id.localeCompare(b.id));
      const selectedDocumentationTotals = progressModules.reduce(
        (summary, moduleProgress) => {
          if (!moduleProgress.selected) return summary;
          summary.complete += Number(moduleProgress.completed_files || 0);
          summary.total += Number(moduleProgress.expressed_files || 0);
          return summary;
        },
        { complete: 0, total: 0 }
      );
      const dashboardStats = Object.freeze({
        availableModules: Number(dnaTotals.available_modules || moduleEntries.length || 0),
        selectedModules: Number(dnaTotals.selected_modules || 0),
        selectedModuleNames: moduleEntries.filter(([, module]) => module.selected).map(([, module]) => module.name),
        expressedDocuments: Number(dnaTotals.expressed_files || 0),
        completeDocuments: progressModules.reduce((sum, moduleProgress) => sum + Number(moduleProgress.completed_files || 0), 0),
        scopedCompleteDocuments: selectedDocumentationTotals.complete,
        documentTotal: selectedDocumentationTotals.total,
        documentationCompletion: Number(progress.documentation_completion_pct || 0),
        contractErrors: trackedFileEntries.reduce((sum, [, file]) => sum + (file.contract_errors?.length || 0), 0),
        blockTotal: Number(implementationTotals.blocks || 0),
        completeBlocks: Number(implementationTotals.implemented || 0) + Number(implementationTotals.verified || 0),
        blockedBlocks: Number(implementationTotals.blocked || 0),
        verifiedBlocks: Number(implementationTotals.verified || 0)
      });
      const searchEntries = [];
      for (const [moduleId, module] of moduleEntries) {
        searchEntries.push({
          kind: "module",
          id: module.canonical_id || moduleId,
          title: module.name || moduleId,
          context: `${module.totals?.files || 0} documents`,
          moduleId
        });
        for (const node of Object.values(module.nodes || {})) {
          searchEntries.push({
            kind: node.type === "directory" ? "group" : "document",
            id: node.qualified_id,
            title: node.title || node.qualified_id,
            context: module.name || moduleId,
            moduleId,
            documentId: node.id
          });
        }
      }
      for (const block of blocks) {
        searchEntries.push({
          kind: "block",
          id: block.id,
          title: block.title || block.id,
          context: block.document_title || block.module_name || "DNA block",
          moduleId: block.module_id || String(block.id || "").match(/^(_DNA-[A-Z0-9]{4})-/)?.[1] || "",
          blockId: block.id
        });
      }
      searchEntries.forEach((entry, index) => {
        entry.index = index;
        entry.searchText = `${entry.id} ${entry.title} ${entry.context}`.toLowerCase();
        entry.searchCompact = entry.searchText.replace(/[^a-z0-9]+/g, "");
      });
      let inspectorReturnFocus = null;
      let inspectorHistory = [];
      let inspectorView = null;
      let searchQuery = "";

      // Formatting and safety helpers
      const esc = (value) => String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");

      const titleCase = (value) => String(value || "")
        .replaceAll("_", " ")
        .replace(/\b\w/g, (character) => character.toUpperCase());

      const blockState = (status) => blockStates[status] || defaultBlockState;
      const searchKindLabels = Object.freeze({
        module: "Module",
        group: "Doc group",
        document: "Document",
        block: "Block"
      });

      const currentStage = state.lifecycle?.stage || "awaiting_seed";
      const currentStageIndex = Math.max(0, stageDefinitions.findIndex((stage) => stage.id === currentStage));
      const currentDefinition = stageDefinitions[currentStageIndex] || stageDefinitions[0];
      const expandedStages = new Set([currentStageIndex]);

      function safeHref(value) {
        const href = String(value || "").trim();
        if (!href || /^(?:javascript|data|vbscript):/i.test(href)) return "#";
        return href;
      }

      function normalizedSearch(value) {
        return String(value || "")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, " ")
          .trim();
      }

      function matchingSearchEntries(query) {
        const normalized = normalizedSearch(query);
        if (!normalized) return [];
        const terms = normalized.split(/\s+/);
        const compact = normalized.replaceAll(" ", "");
        return searchEntries
          .map((entry) => {
            const id = String(entry.id || "").toLowerCase();
            const idCompact = id.replace(/[^a-z0-9]+/g, "");
            const title = String(entry.title || "").toLowerCase();
            const matches = terms.every((term) => entry.searchText.includes(term)) || entry.searchCompact.includes(compact);
            if (!matches) return null;
            const score = idCompact === compact
              ? 0
              : idCompact.startsWith(compact)
                ? 1
                : idCompact.includes(compact)
                  ? 2
                  : title.startsWith(normalized)
                    ? 3
                    : 4;
            return { entry, score };
          })
          .filter(Boolean)
          .sort((a, b) => a.score - b.score || a.entry.id.localeCompare(b.entry.id))
          .slice(0, 24)
          .map(({ entry }) => entry);
      }

      function inlineMarkdown(value) {
        let output = esc(value);
        output = output.replace(/`([^`]+)`/g, "<code>$1</code>");
        output = output.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        output = output.replace(/__([^_]+)__/g, "<strong>$1</strong>");
        output = output.replace(/\*([^*]+)\*/g, "<em>$1</em>");
        output = output.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, href) =>
          `<a href="${esc(safeHref(href))}" target="_blank" rel="noopener">${label}</a>`
        );
        return output;
      }

      function tableCells(line) {
        return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((cell) => cell.trim());
      }

      function markdownToHtml(markdown) {
        const lines = String(markdown || "").replace(/\r/g, "").split("\n");
        const html = [];
        let index = 0;
        let listType = null;

        const closeList = () => {
          if (listType) html.push(`</${listType}>`);
          listType = null;
        };

        while (index < lines.length) {
          const line = lines[index];
          if (/^```/.test(line)) {
            closeList();
            const language = line.slice(3).trim();
            const code = [];
            index += 1;
            while (index < lines.length && !/^```/.test(lines[index])) {
              code.push(lines[index]);
              index += 1;
            }
            html.push(`<pre${language ? ` data-language="${esc(language)}"` : ""}><code>${esc(code.join("\n"))}</code></pre>`);
            index += 1;
            continue;
          }

          if (
            line.includes("|") &&
            index + 1 < lines.length &&
            /^\s*\|?\s*:?-{3,}/.test(lines[index + 1])
          ) {
            closeList();
            const headers = tableCells(line);
            index += 2;
            const rows = [];
            while (index < lines.length && lines[index].includes("|") && lines[index].trim()) {
              rows.push(tableCells(lines[index]));
              index += 1;
            }
            html.push(`<table><thead><tr>${headers.map((cell) => `<th>${inlineMarkdown(cell)}</th>`).join("")}</tr></thead><tbody>${rows.map((row) => `<tr>${row.map((cell) => `<td>${inlineMarkdown(cell)}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
            continue;
          }

          const heading = line.match(/^(#{1,4})\s+(.+)$/);
          if (heading) {
            closeList();
            const level = heading[1].length;
            html.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
            index += 1;
            continue;
          }

          if (/^\s*[-*]\s+/.test(line)) {
            if (listType !== "ul") {
              closeList();
              listType = "ul";
              html.push("<ul>");
            }
            html.push(`<li>${inlineMarkdown(line.replace(/^\s*[-*]\s+/, ""))}</li>`);
            index += 1;
            continue;
          }

          if (/^\s*\d+\.\s+/.test(line)) {
            if (listType !== "ol") {
              closeList();
              listType = "ol";
              html.push("<ol>");
            }
            html.push(`<li>${inlineMarkdown(line.replace(/^\s*\d+\.\s+/, ""))}</li>`);
            index += 1;
            continue;
          }

          closeList();
          if (/^\s*>\s?/.test(line)) {
            html.push(`<blockquote>${inlineMarkdown(line.replace(/^\s*>\s?/, ""))}</blockquote>`);
            index += 1;
            continue;
          }
          if (/^\s*(?:---+|\*\*\*+)\s*$/.test(line)) {
            html.push("<hr>");
            index += 1;
            continue;
          }
          if (!line.trim()) {
            index += 1;
            continue;
          }

          const paragraph = [line.trim()];
          index += 1;
          while (
            index < lines.length &&
            lines[index].trim() &&
            !/^(?:#{1,4}\s+|```|\s*[-*]\s+|\s*\d+\.\s+|\s*>\s?)/.test(lines[index])
          ) {
            paragraph.push(lines[index].trim());
            index += 1;
          }
          html.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);
        }
        closeList();
        return html.join("");
      }

      function emptyReader(iconName = "") {
        const icon = iconName
          ? `<div class="empty-icon"><span class="ui-icon ${esc(iconName)}" aria-hidden="true"></span></div>`
          : "";
        return `<div class="empty-reader ${iconName ? "" : "compact"}"><div>${icon}<div class="empty-lines"><span class="skeleton-line"></span><span class="skeleton-line"></span><span class="skeleton-line"></span></div></div></div>`;
      }

      function firstReadableLine(markdown) {
        const line = String(markdown || "")
          .split(/\r?\n/)
          .map((line) => line.trim())
          .find((line) => line && !/^#|^Status:|^Last updated:|^Source seed:/.test(line)) || "";
        return line
          .replace(/^(\*\*|__)(.+)\1$/, "$2")
          .replace(/^`(.+)`$/, "$1");
      }

      function moduleTone(moduleId) {
        if (moduleId.includes("BRND")) return "brand";
        if (moduleId.includes("PDEX")) return "experience";
        if (moduleId.includes("PSTR")) return "product";
        if (moduleId.includes("COMM")) return "commercial";
        if (moduleId.includes("GROW")) return "growth";
        if (moduleId.includes("LEGL")) return "legal";
        if (moduleId.includes("SOPS")) return "operations";
        return "software";
      }

      function moduleCode(moduleId) {
        return String(moduleId || "").replace(/^_DNA-/, "").slice(0, 4) || "DNA";
      }

      function documentMaturity(node) {
        if (!node.expressed) return "empty";
        const path = trackedPathByQualifiedId.get(node.qualified_id);
        const file = path ? trackedFiles[path] : null;
        const status = file?.processing_status || node.processing_status;
        if (file?.contract_errors?.length || status === "invalid" || status === "blocked") return "issue";
        if (status === "complete") return "complete";
        if (status === "in_progress") return "drafting";
        if (file?.exists) return "scoped";
        return "empty";
      }

      function compactCells(counts, total, limit = 12) {
        const cellCount = total > 0 ? Math.min(limit, Math.max(3, total)) : 4;
        if (total <= 0) return Array.from({ length: cellCount }, () => "empty");
        const priorities = ["issue", "complete", "drafting", "scoped", "empty"];
        return Array.from({ length: cellCount }, (_, index) => {
          const low = Math.floor((index * total) / cellCount);
          const high = Math.ceil(((index + 1) * total) / cellCount);
          let cursor = 0;
          const bucket = { issue: 0, complete: 0, drafting: 0, scoped: 0, empty: 0 };
          for (const status of priorities) {
            const next = cursor + (counts[status] || 0);
            const overlap = Math.max(0, Math.min(high, next) - Math.max(low, cursor));
            bucket[status] = overlap;
            cursor = next;
          }
          return priorities.find((status) => bucket[status] > 0) || "empty";
        });
      }

      function moduleMaturity(moduleId, module) {
        const fileNodes = Object.values(module.nodes || {})
          .filter((node) => node.type === "file")
          .sort((a, b) => a.id.localeCompare(b.id));
        const selectedTotal = fileNodes.filter((node) => node.expressed).length;
        const total = module.selected ? selectedTotal : fileNodes.length;
        const counts = { empty: 0, scoped: 0, drafting: 0, complete: 0, issue: 0 };
        for (const node of fileNodes) {
          if (module.selected && !node.expressed) continue;
          counts[documentMaturity(node)] += 1;
        }
        const label = !module.selected
          ? "Installed"
          : total === 0
            ? "Selected"
            : counts.issue
              ? "Needs attention"
              : counts.complete === total
                ? "Complete"
                : counts.drafting || counts.scoped
                  ? "Drafting"
                  : "Scoped";
        const detail = module.selected && total
          ? `${counts.complete} of ${total} complete`
          : `${fileNodes.length} available`;
        return {
          ...counts,
          total,
          label,
          detail,
          cells: compactCells(counts, total)
        };
      }

      // Journey content
      function quietEmpty(label) {
        const cards = Array.from({ length: 3 }, () => '<span class="quiet-empty-card"></span>').join("");
        return `<div class="quiet-empty" aria-label="${esc(label)}">${cards}</div>`;
      }

      function artifactIcon(contentKey) {
        if (contentKey === "seed") {
          return '<span class="artifact-symbol idea"><i></i><i></i><i></i></span>';
        }
        return '<span class="artifact-symbol direction"></span>';
      }

      function artifactCard(contentKey) {
        const content = presentationContent[contentKey] || {};
        const markdown = content.markdown || "";
        if (!markdown.trim()) return "";
        return `<button class="artifact-card" type="button" data-action="content" data-content="${esc(contentKey)}">
          <span class="artifact-icon" aria-hidden="true">${artifactIcon(contentKey)}</span>
          <span class="artifact-copy"><span class="artifact-title">${esc(content.title)}</span><span class="artifact-note">${esc(firstReadableLine(markdown))}</span></span>
          <span class="eye" aria-hidden="true"></span>
        </button>`;
      }

      function moduleMiniGrid() {
        const cards = moduleEntries.map(([moduleId, module]) => {
          const maturity = moduleMaturity(moduleId, module);
          return (
          `<button class="module-mini" type="button" data-action="module" data-module="${esc(moduleId)}" data-tone="${moduleTone(moduleId)}" title="${esc(`${module.name}: ${maturity.detail}`)}">
            <span class="module-mark" aria-hidden="true">${esc(moduleCode(moduleId))}</span>
            ${module.selected ? '<span class="module-selected" aria-label="Selected">✓</span>' : ""}
            <div class="module-mini-title">${esc(module.name)}</div>
            <div class="module-mini-state">${esc(maturity.label)}</div>
            <div class="module-mini-status" aria-label="${esc(maturity.detail)}">
              <div class="module-strand" style="--strand-count:${maturity.cells.length}">${maturity.cells.map((cell) => `<span class="strand-cell ${esc(cell)}"></span>`).join("")}</div>
              <div class="module-mini-summary"><span>${esc(maturity.detail)}</span><span>${esc(moduleCode(moduleId))}</span></div>
            </div>
          </button>`
          );
        }).join("");
        return `<div class="module-mini-grid">${cards}<div class="module-mini module-add" aria-disabled="true"><span class="plus-icon" aria-hidden="true"></span><small>More DNA modules coming soon</small></div></div>`;
      }

      function scopeContent() {
        if (!expressedDocuments.length) {
          return quietEmpty("DNA documents have not been scoped");
        }
        const byModule = new Map();
        for (const document of expressedDocuments) {
          if (!byModule.has(document.moduleId)) byModule.set(document.moduleId, []);
          byModule.get(document.moduleId).push(document);
        }
        return `<div class="scope-stack">${[...byModule.entries()].map(([moduleId, docs]) =>
          `<div class="scope-module"><div class="scope-module-head"><span>${esc(modules[moduleId]?.name || moduleId)}</span><span>${docs.length}</span></div><div class="scope-docs">${docs.map((document) => `<span class="scope-doc">${esc(document.title)}</span>`).join("")}</div></div>`
        ).join("")}</div>`;
      }

      function skeletonBlocks(count = 4) {
        return Array.from({ length: count }, () => '<span class="skeleton-block"></span>').join("");
      }

      function blockMap() {
        if (!expressedDocuments.length && !blocks.length) {
          return quietEmpty("DNA blocks will appear once the DNA documents are scoped");
        }

        const allDocuments = expressedDocuments.length
          ? expressedDocuments
          : [...blocksByDocument.entries()].map(([documentId, documentBlocks]) => ({
              qualified_id: documentId,
              title: documentBlocks[0]?.document_title || documentId,
              moduleId: documentBlocks[0]?.module_id,
              moduleName: documentBlocks[0]?.module_name
            }));

        return `<div class="block-map">${allDocuments.map((document, index) => {
          const documentBlocks = blocksByDocument.get(document.qualified_id) || [];
          const moduleChanged = index === 0 || allDocuments[index - 1]?.moduleId !== document.moduleId;
          return `${moduleChanged ? `<div class="block-module-title"><span class="module-mark">${esc(moduleCode(document.moduleId))}</span>${esc(document.moduleName || modules[document.moduleId]?.name || document.moduleId)}</div>` : ""}
          <div class="implementation-document">
            <div class="document-heading"><div class="document-title">${esc(document.title)}</div><div class="document-id">${esc(document.qualified_id)}</div></div>
            <div class="blocks">${documentBlocks.length ? documentBlocks.map((block) => {
              const status = blockState(block.status);
              return `<button class="dna-block ${esc(block.status)}" type="button" data-action="block" data-block="${esc(block.id)}" title="${esc(`${block.id}: ${block.title}`)}">
                <span class="block-copy"><span class="block-slice">.${esc(block.slice)}</span><span class="block-title">${esc(block.title)}</span></span>
                <span class="block-progress-ring ${esc(status.ringTone)}" style="--block-progress:${status.progress}" aria-label="${esc(status.ringLabel)}"><span>${esc(status.ringGlyph)}</span></span>
              </button>`;
            }).join("") : skeletonBlocks(3)}</div>
          </div>`;
        }).join("")}</div>`;
      }

      function reviewContent() {
        return `<div class="review-card">
          <div class="progress-ring" style="--progress:${dashboardStats.documentationCompletion}"><strong>${dashboardStats.documentationCompletion}%</strong></div>
          <div><div class="review-title">${dashboardStats.documentationCompletion === 100 && dashboardStats.expressedDocuments ? "Foundation assembled" : "Foundation review"}</div>
            <div class="review-metrics">
              <span class="metric">✓ ${dashboardStats.completeDocuments}/${dashboardStats.expressedDocuments}</span>
              ${dashboardStats.contractErrors ? `<span class="metric warn">× ${dashboardStats.contractErrors}</span>` : ""}
              ${dashboardStats.blockedBlocks ? `<span class="metric warn">! ${dashboardStats.blockedBlocks}</span>` : ""}
            </div>
          </div>
        </div>`;
      }

      function readyContent() {
        const ready = currentStage === "brainwave_documentation_complete";
        return `<div class="review-card">
          <div class="progress-ring" style="--progress:${ready ? 100 : 0}"><strong>${ready ? "✓" : "○"}</strong></div>
          <div><div class="review-title">${ready ? "Foundation ready" : "Ready after review"}</div>
            ${dashboardStats.verifiedBlocks ? `<div class="review-metrics"><span class="metric">✓ ${dashboardStats.verifiedBlocks} verified</span></div>` : ""}
          </div>
        </div>`;
      }

      function stageBody(index) {
        if (index === 0) {
          return artifactCard("seed") ||
            '<div class="first-step"><div><div class="idea-prompt-icon" aria-hidden="true"><i></i><i></i><i></i></div><span>Tell your agent what you want to shape.</span></div></div>';
        }
        if (index === 1) {
          return artifactCard("north_star") ||
            '<div class="first-step"><div><div class="direction-icon" aria-hidden="true"><span class="artifact-symbol direction"></span></div><span>Direction takes shape here.</span></div></div>';
        }
        if (index === 2) return moduleMiniGrid();
        if (index === 3) return scopeContent();
        if (index === 4) return blockMap();
        if (index === 5) return reviewContent();
        return readyContent();
      }

      function stageBadge(index) {
        if (index === 2) {
          return `${dashboardStats.selectedModules}/${dashboardStats.availableModules} modules`;
        }
        if (index === 3) {
          return dashboardStats.documentTotal
            ? `${dashboardStats.scopedCompleteDocuments} of ${dashboardStats.documentTotal} complete`
            : dashboardStats.expressedDocuments || "";
        }
        if (index === 4) {
          return dashboardStats.blockTotal
            ? `${dashboardStats.completeBlocks} of ${dashboardStats.blockTotal} complete`
            : "";
        }
        return "";
      }

      // Primary views
      function renderJourney() {
        document.getElementById("journey").innerHTML = stageDefinitions.map((definition, index) => {
          const status = index < currentStageIndex ? "complete" : index === currentStageIndex ? "current" : "future";
          const expanded = expandedStages.has(index);
          const contentAvailable =
            (index === 0 && presentationContent.seed?.markdown?.trim()) ||
            (index === 1 && presentationContent.north_star?.markdown?.trim());
          const previewKey = index === 0 ? "seed" : index === 1 ? "north_star" : null;
          const badge = stageBadge(index);
          return `<article class="stage ${status} ${expanded ? "expanded" : ""}" data-stage-index="${index}">
            <button class="stage-node" type="button" data-action="stage" data-stage="${index}" aria-label="${expanded ? "Collapse" : "Expand"} ${esc(definition.label)}" aria-expanded="${expanded}">${status === "complete" ? "✓" : String(index + 1).padStart(2, "0")}</button>
            <div class="stage-card">
              <button class="stage-toggle" type="button" data-action="stage" data-stage="${index}" aria-expanded="${expanded}">
                <span><span class="stage-label">${esc(definition.label)}${status === "current" ? '<span class="now-mark">Now</span>' : ""}</span><span class="stage-subtitle">${esc(definition.action)}</span></span>
                <span class="stage-actions">${badge ? `<span class="stage-count">${esc(badge)}</span>` : ""}<span class="chevron" aria-hidden="true"></span></span>
              </button>
              ${contentAvailable && !expanded ? `<button class="preview-button" style="position:absolute;right:56px;top:22px;z-index:3" type="button" data-action="content" data-content="${previewKey}" aria-label="Preview ${esc(definition.label)}"><span class="eye" aria-hidden="true"></span></button>` : ""}
              ${expanded ? `<div class="stage-body">${stageBody(index)}</div>` : ""}
            </div>
          </article>`;
        }).join("");
      }

      function renderLibrary() {
        const cards = moduleEntries.map(([moduleId, module]) => {
          const groups = Object.values(module.nodes || {}).filter((node) => node.type === "directory" && !node.parent_id).slice(0, 5);
          return `<button class="library-card" type="button" data-action="module" data-module="${esc(moduleId)}" data-tone="${moduleTone(moduleId)}">
            <span class="module-mark" aria-hidden="true">${esc(moduleCode(moduleId))}</span>
            <span class="library-status"><span class="installed">✓ Installed</span><span class="library-version">v${esc(module.version)}</span></span>
            <div class="library-title">${esc(module.name)}</div>
            <div class="library-groups">${groups.map((group) => `<span class="library-group">${esc(group.title)}</span>`).join("")}</div>
            <div class="library-count">${esc(module.totals?.files || 0)} documents</div>
          </button>`;
        }).join("");
        document.getElementById("library").innerHTML =
          `${cards}<div class="library-card library-add" aria-disabled="true"><span class="plus-icon" aria-hidden="true"></span><small>More DNA modules coming soon</small></div>`;
      }

      function setView(view) {
        const isJourney = view === "journey";
        document.getElementById("journey-view").hidden = !isJourney;
        document.getElementById("library-view").hidden = isJourney;
        document.querySelectorAll("[data-view]").forEach((button) => {
          const selected = button.dataset.view === view;
          button.setAttribute("aria-selected", String(selected));
          button.tabIndex = selected ? 0 : -1;
        });
      }

      function searchResultsMarkup(query, matches) {
        if (!String(query || "").trim()) {
          return '<div class="search-empty"><span class="ui-icon search" aria-hidden="true"></span></div>';
        }
        if (!matches.length) return '<div class="search-empty">No matches</div>';
        return matches.map((entry) =>
          `<button class="search-result" type="button" data-action="search-result" data-search-index="${entry.index}">
            <span class="search-result-main"><span class="search-result-title">${esc(entry.title)}</span><span class="search-result-id">${esc(entry.id)}</span></span>
            <span class="search-result-tags">
              ${entry.moduleId ? `<span class="search-result-module" data-tone="${moduleTone(entry.moduleId)}">${esc(moduleCode(entry.moduleId))}</span>` : ""}
              <span class="search-result-kind">${esc(searchKindLabels[entry.kind] || entry.kind)}</span>
            </span>
          </button>`
        ).join("");
      }

      function buildSearchView(query = "") {
        const matches = matchingSearchEntries(query);
        const resultsHtml = searchResultsMarkup(query, matches);
        const meta = String(query || "").trim()
          ? `${matches.length} match${matches.length === 1 ? "" : "es"}`
          : `${searchEntries.length} indexed items`;
        return {
          eyebrow: "Dashboard",
          title: "Search",
          meta,
          html: `<div class="search-panel">
            <label class="search-field"><span class="ui-icon search" aria-hidden="true"></span><input class="search-input" id="dashboard-search" type="search" value="${esc(query)}" placeholder="Search by ID or title" aria-label="Search by ID or title" autocomplete="off" spellcheck="false"></label>
            <div class="search-results" id="search-results" aria-live="polite">${resultsHtml}</div>
          </div>`,
          resultsHtml
        };
      }

      function openSearch() {
        openInspector(buildSearchView(searchQuery));
        const input = document.getElementById("dashboard-search");
        input?.focus();
        input?.select();
      }

      function updateSearch(query) {
        searchQuery = query;
        const view = buildSearchView(query);
        inspectorView = view;
        document.getElementById("inspector-meta").textContent = view.meta;
        const results = document.getElementById("search-results");
        if (results) results.innerHTML = view.resultsHtml;
      }

      function openSearchResult(index) {
        const entry = searchEntries[index];
        if (!entry) return;
        if (entry.kind === "block") openBlock(entry.blockId, { remember: true });
        else if (entry.kind === "document") openModuleDocument(entry.moduleId, entry.documentId);
        else openModule(entry.moduleId, { remember: true });
      }

      // Inspector
      function renderInspectorView(view) {
        document.getElementById("inspector-eyebrow").textContent = view.eyebrow;
        document.getElementById("inspector-title").textContent = view.title;
        document.getElementById("inspector-meta").textContent = view.meta || "";
        const body = document.getElementById("inspector-body");
        body.innerHTML = view.html;
        body.scrollTop = 0;
        document.getElementById("inspector-foot").innerHTML = view.sourcePath
          ? `<a class="source-link" href="${esc(safeHref(view.sourcePath))}" target="_blank" rel="noopener">Open source ↗</a>`
          : "";
        document.querySelector(".back-button").hidden = inspectorHistory.length === 0;
      }

      function openInspector(view, { remember = false } = {}) {
        const inspector = document.getElementById("inspector");
        const wasOpen = inspector.classList.contains("open");
        if (!wasOpen) {
          inspectorReturnFocus = document.activeElement;
          inspectorHistory = [];
        } else if (remember && inspectorView) {
          inspectorHistory.push(inspectorView);
        }
        inspectorView = view;
        renderInspectorView(view);
        inspector.classList.add("open");
        inspector.setAttribute("aria-hidden", "false");
        document.getElementById("scrim").classList.add("open");
        document.querySelector(".shell").inert = true;
        (inspectorHistory.length ? inspector.querySelector(".back-button") : inspector.querySelector(".close-button")).focus();
      }

      function backInspector() {
        const previousView = inspectorHistory.pop();
        if (!previousView) return;
        inspectorView = previousView;
        renderInspectorView(previousView);
        (inspectorHistory.length ? document.querySelector(".back-button") : document.querySelector(".close-button")).focus();
      }

      function closeInspector() {
        const inspector = document.getElementById("inspector");
        inspector.classList.remove("open");
        inspector.setAttribute("aria-hidden", "true");
        document.getElementById("scrim").classList.remove("open");
        document.querySelector(".shell").inert = false;
        inspectorHistory = [];
        inspectorView = null;
        if (inspectorReturnFocus && typeof inspectorReturnFocus.focus === "function") {
          inspectorReturnFocus.focus();
        }
      }

      function openContent(key) {
        const content = presentationContent[key] || {};
        openInspector({
          eyebrow: key === "seed" ? "Stage · 01" : key === "north_star" ? "Stage · 02" : "Reference",
          title: content.title || titleCase(key),
          meta: content.path || "",
          html: content.markdown?.trim()
            ? `<div class="reader">${markdownToHtml(content.markdown)}</div>`
            : emptyReader(key === "decisions" ? "history" : ""),
          sourcePath: content.path
        });
      }

      function openDecisions() {
        const decisions = Array.isArray(presentation.decisions) ? presentation.decisions : [];
        const content = presentationContent.decisions || {};
        const html = decisions.length
          ? `<div class="decision-list">${decisions.slice().reverse().map((decision) =>
              `<article class="decision-card"><div class="decision-time">${esc(decision.timestamp || "Decision")}</div><div class="decision-title">${esc(decision.decision || decision.trigger || "Steering decision")}</div>${decision.rationale ? `<div class="decision-rationale">${esc(decision.rationale)}</div>` : ""}</article>`
            ).join("")}</div>`
          : emptyReader("history");
        openInspector({
          eyebrow: "Project record",
          title: content.title || "Decision history",
          meta: decisions.length ? `${decisions.length} steering decision${decisions.length === 1 ? "" : "s"}` : "",
          html,
          sourcePath: content.path
        });
      }

      function openState() {
        const snapshot = state.generated_at ? new Date(state.generated_at).toLocaleString() : "—";
        openInspector({
          eyebrow: "Project record",
          title: "Project state",
          meta: state.lifecycle?.path || "_brainwave_state.yaml",
          html: `<div class="state-grid">
            <div class="state-row"><span>Current step</span><strong>${esc(currentDefinition.action)}</strong></div>
            <div class="state-row"><span>Idea</span><strong>${esc(state.seed?.integrity === "unchanged" ? "Locked ✓" : titleCase(state.seed?.integrity || "Waiting"))}</strong></div>
            <div class="state-row"><span>North Star</span><strong>${esc(titleCase(state.north_star?.status || "Waiting"))}</strong></div>
            <div class="state-row"><span>Build outcome</span><strong>${esc(titleCase(state.settings?.build_outcome || "Not set"))}</strong></div>
            <div class="state-row"><span>DNA modules</span><strong>${esc(dashboardStats.selectedModuleNames.join(" · ") || "—")}</strong></div>
            <div class="state-row"><span>Documents</span><strong>${dashboardStats.completeDocuments}/${dashboardStats.expressedDocuments}</strong></div>
            <div class="state-row"><span>Guidance</span><strong>${esc(titleCase(state.settings?.guidance_mode || "Not set"))}</strong></div>
            <div class="state-row"><span>Snapshot</span><strong>${esc(snapshot)}</strong></div>
          </div>`
        });
      }

      function openModule(moduleId, { remember = false } = {}) {
        const module = modules[moduleId];
        if (!module) return;
        const nodes = Object.values(module.nodes || {});
        const contract = module.module_contract || {};
        const groups = nodes.filter((node) => node.type === "directory" && !node.parent_id).sort((a, b) => a.id.localeCompare(b.id));
        const timing = contract.timing || {};
        const timingMarkup = timing.consider_early || timing.can_defer_when || timing.must_not_defer_when
          ? `<div><strong>Timing</strong><ul>${timing.consider_early ? `<li><b>Consider early:</b> ${esc(timing.consider_early)}</li>` : ""}${timing.can_defer_when ? `<li><b>Can wait:</b> ${esc(timing.can_defer_when)}</li>` : ""}${timing.must_not_defer_when ? `<li><b>Cannot wait:</b> ${esc(timing.must_not_defer_when)}</li>` : ""}</ul></div>`
          : "";
        const boundary = contract.when_relevant
          ? `<details class="module-boundary"><summary>Domain boundary</summary><div class="module-boundary-body"><p><strong>Use when:</strong> ${esc(contract.when_relevant)}</p>${timingMarkup}${Array.isArray(contract.owns) && contract.owns.length ? `<div><strong>Owns</strong><ul>${contract.owns.map((item) => `<li>${esc(item)}</li>`).join("")}</ul></div>` : ""}${Array.isArray(contract.does_not_own) && contract.does_not_own.length ? `<div><strong>Does not own</strong><ul>${contract.does_not_own.map((item) => `<li>${esc(item)}</li>`).join("")}</ul></div>` : ""}</div></details>`
          : "";
        const html = `<div class="module-detail-head" data-tone="${moduleTone(moduleId)}"><span class="module-mark">${esc(moduleCode(moduleId))}</span><div><div class="module-detail-description">${esc(module.description)}</div></div></div>
          ${boundary}<div class="module-detail-groups">${groups.map((group) => {
            const documents = nodes.filter((node) => node.type === "file" && node.parent_id === group.id).sort((a, b) => a.id.localeCompare(b.id));
            return `<section class="module-detail-group"><h3><span>${esc(group.title)}</span><small>${esc(group.qualified_id)}</small></h3>${group.when_relevant ? `<p>${esc(group.when_relevant)}</p>` : ""}<div class="module-doc-list">${documents.map((document) =>
              `<button class="module-doc" type="button" data-action="module-document" data-module="${esc(moduleId)}" data-document="${esc(document.id)}"><span><strong>${esc(document.title)}</strong><small>${esc(document.qualified_id)}</small></span><span class="module-doc-indicator">${document.baseline ? '<span class="ui-icon flag" aria-label="Baseline" title="Baseline"></span>' : ""}</span></button>`
            ).join("")}</div></section>`;
          }).join("")}</div>`;
        openInspector({
          eyebrow: `${module.selected ? "Selected" : "Installed"} · ${module.canonical_id}`,
          title: module.name,
          meta: `v${module.version} · ${module.totals?.files || 0} documents`,
          html
        }, { remember });
      }

      function openModuleDocument(moduleId, documentId) {
        const module = modules[moduleId];
        const document = module?.nodes?.[documentId];
        if (!module || !document) return;
        const path = trackedPathByQualifiedId.get(document.qualified_id) || null;
        const renderedDocument = path ? presentationDocuments[path] : null;
        const preview = renderedDocument?.markdown?.trim()
          ? `<div class="reader">${markdownToHtml(renderedDocument.markdown)}</div>`
          : `<div class="block-section"><div class="block-section-label">${document.baseline ? "Baseline" : "Optional"}</div><div class="reader"><p>${inlineMarkdown(document.intent || "Available when this DNA document is relevant to the concept.")}</p></div></div>`;
        const content = `<div class="document-identity">${esc(document.qualified_id)}</div>${preview}`;
        openInspector({
          eyebrow: module.name,
          title: document.title,
          meta: document.qualified_id,
          html: content,
          sourcePath: path
        }, { remember: true });
      }

      function openDocument(path) {
        const document = presentationDocuments[path];
        if (!document) return;
        openInspector({
          eyebrow: document.module_name || "Documentation",
          title: document.title,
          meta: document.id || "",
          html: `<div class="reader">${markdownToHtml(document.markdown)}</div>`,
          sourcePath: path
        });
      }

      function openBlock(blockId, { remember = false } = {}) {
        const block = blockById.get(blockId);
        if (!block) return;
        const detailLabels = [
          ["context", "Context"],
          ["direction", "Direction"],
          ["rationale", "Why"],
          ["alternatives_considered", "Alternatives"],
          ["consequences", "Consequences"],
          ["future_fit", "Future fit"],
          ["verification", "Verification"],
          ["former_direction", "Former direction"]
        ];
        const sections = detailLabels.filter(([key]) => block.details?.[key]).map(([key, label]) =>
          `<section class="block-section"><div class="block-section-label">${label}</div><div class="reader">${markdownToHtml(block.details[key])}</div></section>`
        ).join("");
        openInspector({
          eyebrow: block.document_title || "DNA block",
          title: block.title,
          meta: titleCase(block.status),
          html: `<div class="block-identity"><span class="status-dot ${esc(block.status)}"></span>${esc(block.id)}</div><div class="block-sections">${sections || emptyReader()}</div>`,
          sourcePath: block.path
        }, { remember });
      }

      // Interaction and initial render
      document.addEventListener("click", (event) => {
        const target = event.target.closest("[data-view], [data-action]");
        if (!target) return;
        if (target.dataset.view) {
          setView(target.dataset.view);
          return;
        }
        const action = target.dataset.action;
        if (action === "stage") {
          const index = Number(target.dataset.stage);
          if (expandedStages.has(index)) expandedStages.delete(index);
          else expandedStages.add(index);
          renderJourney();
        } else if (action === "search") openSearch();
        else if (action === "search-result") openSearchResult(Number(target.dataset.searchIndex));
        else if (action === "content") openContent(target.dataset.content);
        else if (action === "decisions") openDecisions();
        else if (action === "handbook") openContent("handbook");
        else if (action === "state") openState();
        else if (action === "refresh") window.location.reload();
        else if (action === "module") openModule(target.dataset.module);
        else if (action === "module-document") openModuleDocument(target.dataset.module, target.dataset.document);
        else if (action === "document") openDocument(target.dataset.path);
        else if (action === "block") openBlock(target.dataset.block);
        else if (action === "inspector-back") backInspector();
        else if (action === "close-inspector") closeInspector();
      });

      document.addEventListener("input", (event) => {
        if (event.target.id === "dashboard-search") updateSearch(event.target.value);
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && document.getElementById("inspector").classList.contains("open")) {
          closeInspector();
          return;
        }
        if (
          (event.key === "ArrowLeft" || event.key === "ArrowRight") &&
          event.target.matches("[data-view]")
        ) {
          const tabs = [...document.querySelectorAll("[data-view]")];
          const currentIndex = tabs.indexOf(event.target);
          const direction = event.key === "ArrowRight" ? 1 : -1;
          const next = tabs[(currentIndex + direction + tabs.length) % tabs.length];
          setView(next.dataset.view);
          next.focus();
        }
      });

      document.getElementById("snapshot").textContent = state.generated_at
        ? `Updated ${new Date(state.generated_at).toLocaleDateString(undefined, { day: "numeric", month: "short" })}`
        : "";
      document.getElementById("framework-version").textContent =
        state.framework?.version ? `v${state.framework.version}` : "";
      document.title = presentation.project_title ? `${presentation.project_title} · _brainwave` : "_brainwave";

      renderJourney();
      renderLibrary();
    })();
  </script>
</body>
</html>
