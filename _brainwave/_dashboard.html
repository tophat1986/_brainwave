uality and Testing","path":"_documentation/_DNA-SAPP/00800_quality_testing","available_files":3,"expressed_files":0,"completed_files":0,"completion_pct":0},"00900":{"title":"Delivery Governance","path":"_documentation/_DNA-SAPP/00900_delivery_governance","available_files":3,"expressed_files":0,"completed_files":0,"completion_pct":0},"01000":{"title":"Observability","path":"_documentation/_DNA-SAPP/01000_observability","available_files":3,"expressed_files":0,"completed_files":0,"completion_pct":0},"01100":{"title":"Scalability and FinOps","path":"_documentation/_DNA-SAPP/01100_scalability_finops","available_files":3,"expressed_files":0,"completed_files":0,"completion_pct":0},"01200":{"title":"Risk and Continuity","path":"_documentation/_DNA-SAPP/01200_risk_continuity","available_files":3,"expressed_files":0,"completed_files":0,"completion_pct":0}}}}},"implementation":{"totals":{"blocks":0,"not_started":0,"in_progress":0,"implemented":0,"verified":0,"blocked":0,"superseded":0,"not_applicable":0,"invalid":0},"current":null,"next":null,"blocks":[]},"presentation":{"project_title":null,"content":{"seed":{"title":"_brainwave Seed","path":"_my_brainwave_seed.md","markdown":""},"north_star":{"title":"North Star","path":"_my_brainwave_north_star.md","markdown":""},"decisions":{"title":"Decision history","path":"_decisions_log.md","markdown":"# _brainwave Decisions Log\n\nPurpose: preserve only material rationale for North Star direction, DNA module selection, and DNA document scope. Domain decisions belong in the relevant generated document or ADR; operational continuation belongs in a handover.\n\n## Entry Template\n\n- timestamp:\n- trigger:\n- decision:\n- rationale:\n- alternatives_considered:\n- impact_on_dna:\n- approved_by:\n"},"handbook":{"title":"_brainwave Handbook","path":"_brainwave_handbook.md","markdown":"# _brainwave Handbook\n\n_brainwave turns an original idea into an agreed North Star and a proportionate set of domain documentation before downstream work begins. It is active while the idea and documentation are shaped, then becomes passive once that foundation is accepted.\n\n## Lifecycle\n\n`_brainwave_state.yaml` owns one authoritative stage:\n\n1. `awaiting_seed` — **Capture the idea:** discuss and preserve the immutable _brainwave Seed.\n2. `shaping_north_star` — **Agree the direction:** develop and explicitly agree the living North Star.\n3. `selecting_dna` — **Choose DNA modules:** recommend relevant domains and record the agreed modules.\n4. `scoping_brainwave_documentation` — **Scope DNA documents:** agree the proportionate documents needed from those modules.\n5. `building_brainwave_documentation` — **Build DNA documentation:** complete the scoped documents and their traceable DNA blocks.\n6. `reviewing_brainwave_documentation` — **Review the foundation:** check gaps, conflicts, cross-module consistency, and downstream readiness.\n7. `brainwave_documentation_complete` — **Ready for implementation:** remain passive unless the user explicitly reopens _brainwave.\n\nA completed _brainwave returns to `shaping_north_star` when direction changes, `selecting_dna` when the relevant domains change, or `scoping_brainwave_documentation` when only DNA document scope changes.\n\n## Guidance Modes\n\nDuring onboarding, _brainwave asks whether to use:\n\n- `guided` — concise stage signposting, a seven-step journey at orientation and approval points, plain-language explanations of unfamiliar terms, and early links to this handbook and `_dashboard.html`\n- `concise` — the current step and immediate next action, with more explanation only when needed or requested\n\nGuidance mode controls explanation of the process. The separate detail setting controls the depth of working output and documentation. Guided mode does not make every response longer, and the journey is not repeated during routine shaping questions.\n\nThe user-facing journey is:\n\n1. Capture the idea.\n2. Agree the direction.\n3. Choose DNA modules.\n4. Scope DNA documents.\n5. Build DNA documentation.\n6. Review the foundation.\n7. Ready for implementation.\n\n## Providing the Seed\n\nThe user can choose either route:\n\n- **Discuss the concept:** develop it with the agent, then explicitly approve what is captured.\n- **Use a prepared concept:** paste it into chat for verbatim capture, or save it directly in `_my_brainwave_seed.md`.\n\nFor the direct-file route, save the concept and tell the agent: `build concept using the seed file exactly as written`. Saving the file does not lock it. The engine locks its hash only after confirmation and transition to `shaping_north_star`.\n\n## Core Terms\n\n- **_brainwave Seed:** The user's explicitly approved concept, preserved in its supplied wording and natural shape. It becomes immutable after capture and is never a working-notes document.\n- **North Star:** The living current direction derived from the seed. It may evolve without altering the original seed.\n- **DNA module:** A versioned, data-only catalogue of possible documentation for one domain.\n- **DNA document group:** A coherent folder of related DNA documents.\n- **DNA document:** One expressed document such as system context, schema strategy, or voice and tone.\n- **Baseline:** A DNA module or DNA document the agent should normally recommend when its module or parent DNA document group is relevant. It guides proportionate scoping but never overrides explicit user agreement.\n- **DNA block:** One coherent direction, obligation, or verifiable rule inside a document. It is also the smallest implementation-traceability unit.\n- **Expressed:** Agreed as relevant and recorded in the current _brainwave scope.\n- **DNA documentation:** The full generated set across all selected DNA modules.\n- **Architecture Decision Record (ADR):** One consequential architecture decision with context, alternatives, direction, and consequences. An ADR may be a DNA document, but system context, data models, user journeys, operational strategies, and brand guidance are not automatically ADRs.\n- **Steering decision:** A recorded reason for changing North Star direction, DNA module selection, or DNA document scope.\n- **Handover:** Temporary continuation state between working sessions. It is operational context, not a DNA module, DNA block, or architecture decision.\n\nThe canonical identity tree is:\n\n```text\n_DNA-SAPP                 module\n_DNA-SAPP-00300           DNA document group\n_DNA-SAPP-00302           document\n_DNA-SAPP-00302.01        block\n```\n\nThe minimum DNA block contract, implementation statuses, and supersession rules live in `_dna/README.md`.\n\n## Project Placement\n\nThe supported layout is one repository and AI workspace:\n\n```text\nproject-root/\n|-- AGENTS.md\n|-- CLAUDE.md\n|-- .cursor/hooks.json\n|-- .claude/settings.json\n|-- .codex/hooks.json\n|-- _brainwave/\n`-- app/\n```\n\nThe implementation may use another folder name. Keep it in the same repository as `_brainwave` so direction, documentation, implementation, and Git history travel together.\n\nFor a new project, use GitHub's **Use this template** action on the complete release repository. A normal clone retains the upstream _brainwave remote and must be repointed before product work. The root README and package metadata begin as framework onboarding and tooling; the project may replace them while retaining a signpost to this handbook.\n\nFor an existing project, confirm Node.js 20 or newer is installed, copy only the release `_brainwave/` directory into `project-root/_brainwave/`, then run:\n\n```text\nnode _brainwave/_engine/brainwave_runner.js integrate\n```\n\nIntegration preserves existing instructions and hook registrations. It adds or refreshes only managed _brainwave bridges and is safe to run repeatedly.\n\n`unintegrate` removes those managed root bridges and registrations without deleting `_brainwave/` or any project artifacts:\n\n```text\nnode _brainwave/_engine/brainwave_runner.js unintegrate\n```\n\n## Agent Support\n\nStatic discovery is the dependable baseline:\n\n| Agent | Static project guidance | Session hook |\n|---|---|---|\n| Cursor | `AGENTS.md` | `.cursor/hooks.json` |\n| Claude Code | `CLAUDE.md` | `.claude/settings.json` |\n| Codex | `AGENTS.md` | `.codex/hooks.json` |\n\nAll three session hooks call thin platform adapters backed by the same tool-neutral runtime. The runtime reads lifecycle state and supplies relevant context; it never interprets the concept, infers profile values from keywords, or chooses DNA.\n\nCommand hooks execute local code. Cursor, Claude Code, and Codex may ask the user to review or trust project hooks before running them. `integrate` registers all three bundled hooks for portability, but registrations are inert in tools that do not read them and may be left untrusted or disabled in supported tools. There is currently no separate static-only integration mode. Hooks are enhancements rather than the source of truth: disabling them does not remove the governing instructions or deterministic engine safeguards.\n\nIn another IDE or agent environment, begin by telling the agent to read the root `AGENTS.md`, then `_brainwave/AGENTS.md` and this handbook. If the environment uses another native instruction filename, make that file a small bridge to `_brainwave/AGENTS.md`; do not duplicate the directive. _brainwave cannot make an unknown host discover repository instructions automatically, but its workflow and engine do not depend on hooks.\n\n## The Dashboard\n\n`_dashboard.html` is the window into _brainwave. Open it directly from disk; no local server is required.\n\nIt shows:\n\n- a seven-stage vertical journey, with completed stages collapsed and the current stage in focus\n- in-dashboard previews of the seed, North Star, decisions, handbook, and expressed documents\n- the installed DNA Library, including each module's full DNA document catalogue before a concept is selected\n- document and DNA-block progress using canonical IDs and expandable block-level detail\n- a quiet project-state view for technical provenance without placing it in the main journey\n\nThe interface is intentionally presentation-led: icons, state, sequence, and visual placeholders do most of the explanatory work. Source links remain available inside previews for users who want to work directly with the files.\n\nThe dashboard is derived, not authoritative. `_dna/` owns module definitions, `_brainwave_state.yaml` owns selection, the decisions log owns material rationale, and DNA documents own block status. `_manifest.yaml` supplies the embedded dashboard snapshot.\n\nRefresh it from the project root:\n\n```text\nnode _brainwave/_engine/brainwave_runner.js refresh\n```\n\n## Bundled DNA\n\n- **`_DNA-SAPP` — Software Application DNA** produces software architecture documentation for applications and digital services.\n- **`_DNA-BRND` — Brand Identity DNA** produces enduring verbal and visual identity guidance without expanding into campaigns, acquisition, or go-to-market planning.\n\nThe agent may recommend either or both. Counts and document names are read directly from the module files and dashboard, so this handbook does not duplicate their catalogues.\n\n## Working Agreement\n\n- Preserve the user's wording and natural structure when capturing the seed. Do not expand it to fill a template or infer missing content; obtain approval before any material paraphrase or restructuring.\n- Preserve `_my_brainwave_seed.md` exactly after capture.\n- Read `_my_brainwave_north_star.md` first for current direction.\n- Ask one to three focused questions at a time while shaping direction.\n- Do not require exhaustive answers; resolve or explicitly mark only materially important gaps.\n- Let the AI agent recommend DNA modules and DNA documents using semantic judgment. The engine validates and scaffolds; it does not interpret the idea.\n- Use each DNA document group's `when_relevant` as the domain gate, its baseline documents as the normal starting point, and each file's `intent` to decide which optional documents are material.\n- Obtain explicit user agreement before recording DNA module selection or DNA document scope.\n- Keep DNA definitions unchanged during a project. Project selection belongs in `_brainwave_state.yaml`.\n- Record a decision in its owning DNA block or ADR, not in the seed or a duplicate ledger.\n- After DNA documentation is complete, update only the statuses of blocks affected by downstream work. Do not reopen the lifecycle unless direction, DNA module selection, or DNA document scope changes.\n- Create a local README only for non-obvious purpose, boundaries, invariants, relationships, working rules, or known traps—not to list visible files.\n\n## Framework and Project Ownership\n\nFramework-owned files may be replaced by a future _brainwave update:\n\n- `_engine/`\n- `_dna/`\n- `_templates/`\n- `_brainwave_handbook.md`\n- `_brainwave/AGENTS.md`\n\nProject-owned files must never be overwritten by an update:\n\n- `_my_brainwave_seed.md`\n- `_my_brainwave_north_star.md`\n- `_brainwave_state.yaml`\n- `_settings.yaml`\n- `_decisions_log.md`\n- `_documentation/`\n\n`_manifest.yaml` and the state embedded in `_dashboard.html` are derived and may be regenerated. Root bridges and hook configurations are merged rather than replaced.\n\nUntil an automated updater exists, update framework-owned files only and run `integrate` followed by `refresh`. Never copy a new release wholesale over an active project. `unintegrate` removes root connections only; project-owned artifacts must be backed up and removed deliberately.\n\n## When _brainwave Is Complete\n\n`brainwave_documentation_complete` means the initial DNA documentation foundation has been accepted. It does not mean the resulting product or brand has been implemented.\n\nAt this stage, _brainwave stops announcing or initiating its workflow during ordinary development. The relevant DNA blocks remain lightweight traceability anchors: downstream agents update a block from `not_started` through `implemented` and `verified`, or mark it `blocked`, `not_applicable`, or `superseded` when appropriate.\n"}},"decisions":[],"documents":{}},"events":[]}</script>
  <script>
    (() => {
      const stageDefinitions = [
        { id: "awaiting_seed", label: "_brainwave Seed", action: "Capture the idea" },
        { id: "shaping_north_star", label: "North Star", action: "Agree the direction" },
        { id: "selecting_dna", label: "DNA modules", action: "Choose DNA modules" },
        { id: "scoping_brainwave_documentation", label: "DNA documents", action: "Scope DNA documents" },
        { id: "building_brainwave_documentation", label: "DNA documents and blocks", action: "Build DNA documentation" },
        { id: "reviewing_brainwave_documentation", label: "Foundation", action: "Review the foundation" },
        { id: "brainwave_documentation_complete", label: "Implementation", action: "Ready for implementation" }
      ];

      const statusGlyph = {
        not_started: "○",
        in_progress: "●",
        implemented: "◆",
        verified: "✓",
        blocked: "!",
        superseded: "↗",
        not_applicable: "–",
        invalid: "×"
      };

      const stateElement = document.getElementById("brainwave-state");
      let state = {};
      try { state = JSON.parse(stateElement.textContent || "{}"); } catch (_) {}

      const modules = state.dna?.modules || {};
      const moduleEntries = Object.entries(modules);
      const trackedFiles = state.filesystem?.tracked_files || {};
      const blocks = state.implementation?.blocks || [];
      const presentation = state.presentation || {};
      const presentationContent = presentation.content || {};
      const presentationDocuments = presentation.documents || {};
      let inspectorReturnFocus = null;
      let inspectorHistory = [];
      let inspectorView = null;

      const esc = (value) => String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");

      const titleCase = (value) => String(value || "")
        .replaceAll("_", " ")
        .replace(/\b\w/g, (character) => character.toUpperCase());

      const currentStage = state.lifecycle?.stage || "awaiting_seed";
      const currentStageIndex = Math.max(0, stageDefinitions.findIndex((stage) => stage.id === currentStage));
      const currentDefinition = stageDefinitions[currentStageIndex] || stageDefinitions[0];
      const expandedStages = new Set([currentStageIndex]);

      function safeHref(value) {
        const href = String(value || "").trim();
        if (!href || /^(?:javascript|data|vbscript):/i.test(href)) return "#";
        return href;
      }

      function inlineMarkdown(value) {
        let output = esc(value);
        output = output.replace(/`([^`]+)`/g, "<code>$1</code>");
        output = output.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        output = output.replace(/__([^_]+)__/g, "<strong>$1</strong>");
        output = output.replace(/\*([^*]+)\*/g, "<em>$1</em>");
        output = output.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, href) =>
          `<a href="${esc(safeHref(href))}" target="_blank" rel="noopener">${label}</a>`
        );
        return output;
      }

      function tableCells(line) {
        return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((cell) => cell.trim());
      }

      function markdownToHtml(markdown) {
        const lines = String(markdown || "").replace(/\r/g, "").split("\n");
        const html = [];
        let index = 0;
        let listType = null;

        const closeList = () => {
          if (listType) html.push(`</${listType}>`);
          listType = null;
        };

        while (index < lines.length) {
          const line = lines[index];
          if (/^```/.test(line)) {
            closeList();
            const language = line.slice(3).trim();
            const code = [];
            index += 1;
            while (index < lines.length && !/^```/.test(lines[index])) {
              code.push(lines[index]);
              index += 1;
            }
            html.push(`<pre${language ? ` data-language="${esc(language)}"` : ""}><code>${esc(code.join("\n"))}</code></pre>`);
            index += 1;
            continue;
          }

          if (
            line.includes("|") &&
            index + 1 < lines.length &&
            /^\s*\|?\s*:?-{3,}/.test(lines[index + 1])
          ) {
            closeList();
            const headers = tableCells(line);
            index += 2;
            const rows = [];
            while (index < lines.length && lines[index].includes("|") && lines[index].trim()) {
              rows.push(tableCells(lines[index]));
              index += 1;
            }
            html.push(`<table><thead><tr>${headers.map((cell) => `<th>${inlineMarkdown(cell)}</th>`).join("")}</tr></thead><tbody>${rows.map((row) => `<tr>${row.map((cell) => `<td>${inlineMarkdown(cell)}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
            continue;
          }

          const heading = line.match(/^(#{1,4})\s+(.+)$/);
          if (heading) {
            closeList();
            const level = heading[1].length;
            html.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
            index += 1;
            continue;
          }

          if (/^\s*[-*]\s+/.test(line)) {
            if (listType !== "ul") {
              closeList();
              listType = "ul";
              html.push("<ul>");
            }
            html.push(`<li>${inlineMarkdown(line.replace(/^\s*[-*]\s+/, ""))}</li>`);
            index += 1;
            continue;
          }

          if (/^\s*\d+\.\s+/.test(line)) {
            if (listType !== "ol") {
              closeList();
              listType = "ol";
              html.push("<ol>");
            }
            html.push(`<li>${inlineMarkdown(line.replace(/^\s*\d+\.\s+/, ""))}</li>`);
            index += 1;
            continue;
          }

          closeList();
          if (/^\s*>\s?/.test(line)) {
            html.push(`<blockquote>${inlineMarkdown(line.replace(/^\s*>\s?/, ""))}</blockquote>`);
            index += 1;
            continue;
          }
          if (/^\s*(?:---+|\*\*\*+)\s*$/.test(line)) {
            html.push("<hr>");
            index += 1;
            continue;
          }
          if (!line.trim()) {
            index += 1;
            continue;
          }

          const paragraph = [line.trim()];
          index += 1;
          while (
            index < lines.length &&
            lines[index].trim() &&
            !/^(?:#{1,4}\s+|```|\s*[-*]\s+|\s*\d+\.\s+|\s*>\s?)/.test(lines[index])
          ) {
            paragraph.push(lines[index].trim());
            index += 1;
          }
          html.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);
        }
        closeList();
        return html.join("");
      }

      function emptyReader(symbol = "◇") {
        return `<div class="empty-reader"><div><div class="empty-symbol">${esc(symbol)}</div><div class="empty-lines"><span class="skeleton-line"></span><span class="skeleton-line"></span><span class="skeleton-line"></span></div></div></div>`;
      }

      function firstReadableLine(markdown) {
        return String(markdown || "")
          .split(/\r?\n/)
          .map((line) => line.trim())
          .find((line) => line && !/^#|^Status:|^Last updated:|^Source seed:/.test(line)) || "";
      }

      function moduleTone(moduleId) {
        return moduleId.includes("BRND") ? "brand" : "software";
      }

      function moduleCode(moduleId) {
        return String(moduleId || "").replace(/^_DNA-/, "").slice(0, 4) || "DNA";
      }

      function trackedPathFor(qualifiedId) {
        return Object.entries(trackedFiles)
          .find(([, meta]) => meta.qualified_node_id === qualifiedId)?.[0] || null;
      }

      function expressedDocuments() {
        const documents = [];
        for (const [moduleId, module] of moduleEntries) {
          for (const node of Object.values(module.nodes || {})) {
            if (node.type !== "file" || !node.expressed) continue;
            documents.push({
              ...node,
              moduleId,
              moduleName: module.name,
              path: trackedPathFor(node.qualified_id)
            });
          }
        }
        return documents.sort((a, b) =>
          a.moduleId.localeCompare(b.moduleId) || a.id.localeCompare(b.id)
        );
      }

      function artifactCard(contentKey, icon) {
        const content = presentationContent[contentKey] || {};
        const markdown = content.markdown || "";
        if (!markdown.trim()) return "";
        return `<button class="artifact-card" type="button" data-action="content" data-content="${esc(contentKey)}">
          <span class="artifact-icon" aria-hidden="true">${esc(icon)}</span>
          <span><span class="artifact-title">${esc(content.title)}</span><span class="artifact-note">${esc(firstReadableLine(markdown))}</span></span>
          <span class="eye" aria-hidden="true"></span>
        </button>`;
      }

      function moduleMiniGrid() {
        const cards = moduleEntries.map(([moduleId, module]) =>
          `<button class="module-mini" type="button" data-action="module" data-module="${esc(moduleId)}" data-tone="${moduleTone(moduleId)}">
            <span class="module-mark" aria-hidden="true">${esc(moduleCode(moduleId))}</span>
            ${module.selected ? '<span class="module-selected" aria-label="Selected">✓</span>' : ""}
            <div class="module-mini-title">${esc(module.name)}</div>
            <div class="module-mini-state">${module.selected ? "Selected" : "Installed"}</div>
          </button>`
        ).join("");
        return `<div class="module-mini-grid">${cards}<div class="module-mini module-add" aria-disabled="true"><span>＋</span><small>More DNA modules coming soon</small></div></div>`;
      }

      function scopeContent() {
        const documents = expressedDocuments();
        if (!documents.length) {
          return '<div class="quiet-empty" aria-label="DNA documents have not been scoped"><span class="quiet-empty-card"></span><span class="quiet-empty-card"></span><span class="quiet-empty-card"></span></div>';
        }
        const byModule = new Map();
        for (const document of documents) {
          if (!byModule.has(document.moduleId)) byModule.set(document.moduleId, []);
          byModule.get(document.moduleId).push(document);
        }
        return `<div class="scope-stack">${[...byModule.entries()].map(([moduleId, docs]) =>
          `<div class="scope-module"><div class="scope-module-head"><span>${esc(modules[moduleId]?.name || moduleId)}</span><span>${docs.length}</span></div><div class="scope-docs">${docs.map((document) => `<span class="scope-doc">${esc(document.title)}</span>`).join("")}</div></div>`
        ).join("")}</div>`;
      }

      function skeletonBlocks(count = 4) {
        return Array.from({ length: count }, () => '<span class="skeleton-block"></span>').join("");
      }

      function blockMap() {
        const documents = expressedDocuments();
        const blocksByDocument = new Map();
        for (const block of blocks) {
          if (!blocksByDocument.has(block.document_id)) blocksByDocument.set(block.document_id, []);
          blocksByDocument.get(block.document_id).push(block);
        }

        if (!documents.length && !blocks.length) {
          return '<div class="quiet-empty" aria-label="DNA blocks will appear once the DNA documents are scoped"><span class="quiet-empty-card"></span><span class="quiet-empty-card"></span><span class="quiet-empty-card"></span></div>';
        }

        const allDocuments = documents.length
          ? documents
          : [...blocksByDocument.entries()].map(([documentId, documentBlocks]) => ({
              qualified_id: documentId,
              title: documentBlocks[0]?.document_title || documentId,
              moduleId: documentBlocks[0]?.module_id,
              moduleName: documentBlocks[0]?.module_name
            }));

        return `<div class="block-map">${allDocuments.map((document, index) => {
          const documentBlocks = blocksByDocument.get(document.qualified_id) || [];
          const moduleChanged = index === 0 || allDocuments[index - 1]?.moduleId !== document.moduleId;
          return `${moduleChanged ? `<div class="block-module-title"><span class="module-mark">${esc(moduleCode(document.moduleId))}</span>${esc(document.moduleName || modules[document.moduleId]?.name || document.moduleId)}</div>` : ""}
          <div class="implementation-document">
            <div><div class="document-id">${esc(document.qualified_id)}</div><div class="document-title">${esc(document.title)}</div></div>
            <div class="blocks">${documentBlocks.length ? documentBlocks.map((block) =>
              `<button class="dna-block ${esc(block.status)}" type="button" data-action="block" data-block="${esc(block.id)}" title="${esc(`${block.id}: ${block.title}`)}">
                <span class="block-top"><span>.${esc(block.slice)}</span><span class="block-state" aria-label="${esc(titleCase(block.status))}">${esc(statusGlyph[block.status] || "○")}</span></span>
                <span class="block-title">${esc(block.title)}</span>
              </button>`
            ).join("") : skeletonBlocks(3)}</div>
          </div>`;
        }).join("")}</div>`;
      }

      function reviewContent() {
        const completion = Number(state.progress?.documentation_completion_pct || 0);
        const completeDocuments = Object.values(state.progress?.modules || {}).reduce(
          (sum, module) => sum + Number(module.completed_files || 0),
          0
        );
        const expressedCount = Number(state.dna?.totals?.expressed_files || 0);
        const contractErrors = Object.values(trackedFiles).reduce(
          (sum, file) => sum + (file.contract_errors?.length || 0),
          0
        );
        const blocked = Number(state.implementation?.totals?.blocked || 0);
        return `<div class="review-card">
          <div class="progress-ring" style="--progress:${completion}"><strong>${completion}%</strong></div>
          <div><div class="review-title">${completion === 100 && expressedCount ? "Foundation assembled" : "Foundation review"}</div>
            <div class="review-metrics">
              <span class="metric">✓ ${completeDocuments}/${expressedCount}</span>
              ${contractErrors ? `<span class="metric warn">× ${contractErrors}</span>` : ""}
              ${blocked ? `<span class="metric warn">! ${blocked}</span>` : ""}
            </div>
          </div>
        </div>`;
      }

      function readyContent() {
        const ready = currentStage === "brainwave_documentation_complete";
        const verified = Number(state.implementation?.totals?.verified || 0);
        return `<div class="review-card">
          <div class="progress-ring" style="--progress:${ready ? 100 : 0}"><strong>${ready ? "✓" : "○"}</strong></div>
          <div><div class="review-title">${ready ? "Foundation ready" : "Ready after review"}</div>
            <div class="review-metrics">${verified ? `<span class="metric">✓ ${verified} verified</span>` : '<span class="metric">◇</span>'}</div>
          </div>
        </div>`;
      }

      function stageBody(index) {
        if (index === 0) {
          return artifactCard("seed", "◇") ||
            '<div class="first-step"><div><div class="idea-prompt-icon" aria-hidden="true"><i></i><i></i><i></i></div><span>Tell your agent what you want to shape.</span></div></div>';
        }
        if (index === 1) {
          return artifactCard("north_star", "⌁") ||
            '<div class="first-step"><div><div class="direction-icon" aria-hidden="true">↗</div><span>Direction takes shape here.</span></div></div>';
        }
        if (index === 2) return moduleMiniGrid();
        if (index === 3) return scopeContent();
        if (index === 4) return blockMap();
        if (index === 5) return reviewContent();
        return readyContent();
      }

      function stageBadge(index) {
        if (index === 3) return state.dna?.totals?.expressed_files || "";
        if (index === 4) return state.implementation?.totals?.blocks || "";
        return "";
      }

      function renderJourney() {
        document.getElementById("journey").innerHTML = stageDefinitions.map((definition, index) => {
          const status = index < currentStageIndex ? "complete" : index === currentStageIndex ? "current" : "future";
          const expanded = expandedStages.has(index);
          const contentAvailable =
            (index === 0 && presentationContent.seed?.markdown?.trim()) ||
            (index === 1 && presentationContent.north_star?.markdown?.trim());
          const previewKey = index === 0 ? "seed" : index === 1 ? "north_star" : null;
          const badge = stageBadge(index);
          return `<article class="stage ${status} ${expanded ? "expanded" : ""}" data-stage-index="${index}">
            <button class="stage-node" type="button" data-action="stage" data-stage="${index}" aria-label="${expanded ? "Collapse" : "Expand"} ${esc(definition.label)}" aria-expanded="${expanded}">${status === "complete" ? "✓" : String(index + 1).padStart(2, "0")}</button>
            <div class="stage-card">
              <button class="stage-toggle" type="button" data-action="stage" data-stage="${index}" aria-expanded="${expanded}">
                <span><span class="stage-label">${esc(definition.label)}${status === "current" ? '<span class="now-mark">Now</span>' : ""}</span><span class="stage-subtitle">${esc(definition.action)}</span></span>
                <span class="stage-actions">${badge ? `<span class="stage-count">${esc(badge)}</span>` : ""}<span class="chevron" aria-hidden="true"></span></span>
              </button>
              ${contentAvailable && !expanded ? `<button class="preview-button" style="position:absolute;right:56px;top:22px;z-index:3" type="button" data-action="content" data-content="${previewKey}" aria-label="Preview ${esc(definition.label)}"><span class="eye" aria-hidden="true"></span></button>` : ""}
              ${expanded ? `<div class="stage-body">${stageBody(index)}</div>` : ""}
            </div>
          </article>`;
        }).join("");
      }

      function renderLibrary() {
        const cards = moduleEntries.map(([moduleId, module]) => {
          const groups = Object.values(module.nodes || {}).filter((node) => node.type === "directory" && !node.parent_id).slice(0, 5);
          return `<button class="library-card" type="button" data-action="module" data-module="${esc(moduleId)}" data-tone="${moduleTone(moduleId)}">
            <span class="module-mark" aria-hidden="true">${esc(moduleCode(moduleId))}</span>
            <span class="library-status"><span class="installed">✓ Installed</span><span class="library-version">v${esc(module.version)}</span></span>
            <div class="library-title">${esc(module.name)}</div>
            <div class="library-groups">${groups.map((group) => `<span class="library-group">${esc(group.title)}</span>`).join("")}</div>
            <div class="library-count">${esc(module.totals?.files || 0)} documents</div>
          </button>`;
        }).join("");
        document.getElementById("library").innerHTML =
          `${cards}<div class="library-card library-add" aria-disabled="true"><span>＋</span><small>More DNA modules coming soon</small></div>`;
      }

      function setView(view) {
        const isJourney = view === "journey";
        document.getElementById("journey-view").hidden = !isJourney;
        document.getElementById("library-view").hidden = isJourney;
        document.querySelectorAll("[data-view]").forEach((button) => {
          const selected = button.dataset.view === view;
          button.setAttribute("aria-selected", String(selected));
          button.tabIndex = selected ? 0 : -1;
        });
      }

      function renderInspectorView(view) {
        document.getElementById("inspector-eyebrow").textContent = view.eyebrow;
        document.getElementById("inspector-title").textContent = view.title;
        document.getElementById("inspector-meta").textContent = view.meta || "";
        const body = document.getElementById("inspector-body");
        body.innerHTML = view.html;
        body.scrollTop = 0;
        document.getElementById("inspector-foot").innerHTML = view.sourcePath
          ? `<a class="source-link" href="${esc(safeHref(view.sourcePath))}" target="_blank" rel="noopener">Open source ↗</a>`
          : "";
        document.querySelector(".back-button").hidden = inspectorHistory.length === 0;
      }

      function openInspector(view, { remember = false } = {}) {
        const inspector = document.getElementById("inspector");
        const wasOpen = inspector.classList.contains("open");
        if (!wasOpen) {
          inspectorReturnFocus = document.activeElement;
          inspectorHistory = [];
        } else if (remember && inspectorView) {
          inspectorHistory.push(inspectorView);
        }
        inspectorView = view;
        renderInspectorView(view);
        inspector.classList.add("open");
        inspector.setAttribute("aria-hidden", "false");
        document.getElementById("scrim").classList.add("open");
        document.querySelector(".shell").inert = true;
        (inspectorHistory.length ? inspector.querySelector(".back-button") : inspector.querySelector(".close-button")).focus();
      }

      function backInspector() {
        const previousView = inspectorHistory.pop();
        if (!previousView) return;
        inspectorView = previousView;
        renderInspectorView(previousView);
        (inspectorHistory.length ? document.querySelector(".back-button") : document.querySelector(".close-button")).focus();
      }

      function closeInspector() {
        const inspector = document.getElementById("inspector");
        inspector.classList.remove("open");
        inspector.setAttribute("aria-hidden", "true");
        document.getElementById("scrim").classList.remove("open");
        document.querySelector(".shell").inert = false;
        inspectorHistory = [];
        inspectorView = null;
        if (inspectorReturnFocus && typeof inspectorReturnFocus.focus === "function") {
          inspectorReturnFocus.focus();
        }
      }

      function openContent(key) {
        const content = presentationContent[key] || {};
        openInspector({
          eyebrow: key === "seed" ? "Stage · 01" : key === "north_star" ? "Stage · 02" : "Reference",
          title: content.title || titleCase(key),
          meta: content.path || "",
          html: content.markdown?.trim()
            ? `<div class="reader">${markdownToHtml(content.markdown)}</div>`
            : emptyReader(key === "decisions" ? "◷" : "◇"),
          sourcePath: content.path
        });
      }

      function openDecisions() {
        const decisions = Array.isArray(presentation.decisions) ? presentation.decisions : [];
        const content = presentationContent.decisions || {};
        const html = decisions.length
          ? `<div class="decision-list">${decisions.slice().reverse().map((decision) =>
              `<article class="decision-card"><div class="decision-time">${esc(decision.timestamp || "Decision")}</div><div class="decision-title">${esc(decision.decision || decision.trigger || "Steering decision")}</div>${decision.rationale ? `<div class="decision-rationale">${esc(decision.rationale)}</div>` : ""}</article>`
            ).join("")}</div>`
          : emptyReader("◷");
        openInspector({
          eyebrow: "Project record",
          title: content.title || "Decision history",
          meta: decisions.length ? `${decisions.length} steering decision${decisions.length === 1 ? "" : "s"}` : "",
          html,
          sourcePath: content.path
        });
      }

      function openState() {
        const selectedModules = moduleEntries.filter(([, module]) => module.selected).map(([, module]) => module.name);
        const completeDocuments = Object.values(state.progress?.modules || {}).reduce(
          (sum, module) => sum + Number(module.completed_files || 0),
          0
        );
        const expressed = Number(state.dna?.totals?.expressed_files || 0);
        const snapshot = state.generated_at ? new Date(state.generated_at).toLocaleString() : "—";
        openInspector({
          eyebrow: "Project record",
          title: "Project state",
          meta: state.lifecycle?.path || "_brainwave_state.yaml",
          html: `<div class="state-grid">
            <div class="state-row"><span>Current step</span><strong>${esc(currentDefinition.action)}</strong></div>
            <div class="state-row"><span>Idea</span><strong>${esc(state.seed?.integrity === "unchanged" ? "Locked ✓" : titleCase(state.seed?.integrity || "Waiting"))}</strong></div>
            <div class="state-row"><span>North Star</span><strong>${esc(titleCase(state.north_star?.status || "Waiting"))}</strong></div>
            <div class="state-row"><span>DNA modules</span><strong>${esc(selectedModules.join(" · ") || "—")}</strong></div>
            <div class="state-row"><span>Documents</span><strong>${completeDocuments}/${expressed}</strong></div>
            <div class="state-row"><span>Guidance</span><strong>${esc(titleCase(state.settings?.guidance_mode || "Not set"))}</strong></div>
            <div class="state-row"><span>Snapshot</span><strong>${esc(snapshot)}</strong></div>
          </div>`
        });
      }

      function openModule(moduleId) {
        const module = modules[moduleId];
        if (!module) return;
        const nodes = Object.values(module.nodes || {});
        const groups = nodes.filter((node) => node.type === "directory" && !node.parent_id).sort((a, b) => a.id.localeCompare(b.id));
        const html = `<div class="module-detail-head"><span class="module-mark">${esc(moduleCode(moduleId))}</span><div><div class="module-detail-description">${esc(module.description)}</div></div></div>
          <div class="module-detail-groups">${groups.map((group) => {
            const documents = nodes.filter((node) => node.type === "file" && node.parent_id === group.id).sort((a, b) => a.id.localeCompare(b.id));
            return `<section class="module-detail-group"><h3><span>${esc(group.title)}</span><small>${esc(group.qualified_id)}</small></h3>${group.when_relevant ? `<p>${esc(group.when_relevant)}</p>` : ""}<div class="module-doc-list">${documents.map((document) =>
              `<button class="module-doc" type="button" data-action="module-document" data-module="${esc(moduleId)}" data-document="${esc(document.id)}"><span><strong>${esc(document.title)}</strong><small>${esc(document.qualified_id)}</small></span><span>${document.baseline ? "◆" : "◇"}</span></button>`
            ).join("")}</div></section>`;
          }).join("")}</div>`;
        openInspector({
          eyebrow: `${module.selected ? "Selected" : "Installed"} · ${module.canonical_id}`,
          title: module.name,
          meta: `v${module.version} · ${module.totals?.files || 0} documents`,
          html
        });
      }

      function openModuleDocument(moduleId, documentId) {
        const module = modules[moduleId];
        const document = module?.nodes?.[documentId];
        if (!module || !document) return;
        const path = trackedPathFor(document.qualified_id);
        const renderedDocument = path ? presentationDocuments[path] : null;
        const preview = renderedDocument?.markdown?.trim()
          ? `<div class="reader">${markdownToHtml(renderedDocument.markdown)}</div>`
          : `<div class="block-section"><div class="block-section-label">${document.baseline ? "Baseline" : "Optional"}</div><div class="reader"><p>${inlineMarkdown(document.intent || "Available when this DNA document is relevant to the concept.")}</p></div></div>`;
        const content = `<div class="document-identity">${esc(document.qualified_id)}</div>${preview}`;
        openInspector({
          eyebrow: module.name,
          title: document.title,
          meta: document.qualified_id,
          html: content,
          sourcePath: path
        }, { remember: true });
      }

      function openDocument(path) {
        const document = presentationDocuments[path];
        if (!document) return;
        openInspector({
          eyebrow: document.module_name || "Documentation",
          title: document.title,
          meta: document.id || "",
          html: `<div class="reader">${markdownToHtml(document.markdown)}</div>`,
          sourcePath: path
        });
      }

      function openBlock(blockId) {
        const block = blocks.find((entry) => entry.id === blockId);
        if (!block) return;
        const detailLabels = [
          ["context", "Context"],
          ["direction", "Direction"],
          ["rationale", "Why"],
          ["alternatives_considered", "Alternatives"],
          ["consequences", "Consequences"],
          ["future_fit", "Future fit"],
          ["verification", "Verification"],
          ["former_direction", "Former direction"]
        ];
        const sections = detailLabels.filter(([key]) => block.details?.[key]).map(([key, label]) =>
          `<section class="block-section"><div class="block-section-label">${label}</div><div class="reader">${markdownToHtml(block.details[key])}</div></section>`
        ).join("");
        openInspector({
          eyebrow: block.document_title || "DNA block",
          title: block.title,
          meta: titleCase(block.status),
          html: `<div class="block-identity"><span class="status-dot ${esc(block.status)}"></span>${esc(block.id)}</div><div class="block-sections">${sections || emptyReader(statusGlyph[block.status] || "◇")}</div>`,
          sourcePath: block.path
        });
      }

      document.addEventListener("click", (event) => {
        const target = event.target.closest("[data-view], [data-action]");
        if (!target) return;
        if (target.dataset.view) {
          setView(target.dataset.view);
          return;
        }
        const action = target.dataset.action;
        if (action === "stage") {
          const index = Number(target.dataset.stage);
          if (expandedStages.has(index)) expandedStages.delete(index);
          else expandedStages.add(index);
          renderJourney();
        } else if (action === "content") openContent(target.dataset.content);
        else if (action === "decisions") openDecisions();
        else if (action === "handbook") openContent("handbook");
        else if (action === "state") openState();
        else if (action === "refresh") window.location.reload();
        else if (action === "module") openModule(target.dataset.module);
        else if (action === "module-document") openModuleDocument(target.dataset.module, target.dataset.document);
        else if (action === "document") openDocument(target.dataset.path);
        else if (action === "block") openBlock(target.dataset.block);
        else if (action === "inspector-back") backInspector();
        else if (action === "close-inspector") closeInspector();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && document.getElementById("inspector").classList.contains("open")) {
          closeInspector();
          return;
        }
        if (
          (event.key === "ArrowLeft" || event.key === "ArrowRight") &&
          event.target.matches("[data-view]")
        ) {
          const tabs = [...document.querySelectorAll("[data-view]")];
          const currentIndex = tabs.indexOf(event.target);
          const direction = event.key === "ArrowRight" ? 1 : -1;
          const next = tabs[(currentIndex + direction + tabs.length) % tabs.length];
          setView(next.dataset.view);
          next.focus();
        }
      });

      document.getElementById("snapshot").textContent = state.generated_at
        ? `Updated ${new Date(state.generated_at).toLocaleDateString(undefined, { day: "numeric", month: "short" })}`
        : "";
      document.getElementById("framework-version").textContent =
        state.framework?.version ? `v${state.framework.version}` : "";
      document.title = presentation.project_title ? `${presentation.project_title} · _brainwave` : "_brainwave";

      renderJourney();
      renderLibrary();
    })();
  </script>
</body>
</html>
