  <style>
    :root {
      --bg: #0c1020;
      --panel: #121a33;
      --panel-soft: #1b2750;
      --text: #d8e0ff;
      --muted: #9aa9d9;
      --ok: #3ddc97;
      --warn: #ffcb6b;
      --danger: #ff6b6b;
      --line: #2c3967;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background: linear-gradient(180deg, #0a0f1f 0%, #0f1630 100%);
      color: var(--text);
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }
    .meta {
      color: var(--muted);
      margin-bottom: 18px;
      font-size: 13px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
    }
    .label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }
    .value {
      font-size: 22px;
      font-weight: 600;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }
    .panel h2 {
      margin: 0;
      background: var(--panel-soft);
      border-bottom: 1px solid var(--line);
      font-size: 14px;
      padding: 10px 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #c9d5ff;
    }
    .panel .body {
      padding: 10px 12px;
      max-height: 340px;
      overflow: auto;
      font-size: 13px;
    }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid var(--line);
      margin-right: 6px;
    }
    .status-complete { color: var(--ok); border-color: #2d805e; }
    .status-in_progress { color: var(--warn); border-color: #786333; }
    .status-not_started { color: var(--danger); border-color: #7b3a3a; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      text-align: left;
      padding: 6px 4px;
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 500; }
    .footer {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
    }
    button {
      background: #2a3a73;
      color: #dbe4ff;
      border: 1px solid #4059a8;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.06); }
    @media (max-width: 900px) {
      .row { grid-template-columns: 1fr; }
    }
  </style>

  <script>
    function safeReadState() {
      const el = document.getElementById("brainwave-state");
      if (!el) return {};
      try {
        return JSON.parse(el.textContent || "{}");
      } catch (error) {
        return { parse_error: error.message };
      }
    }

    function pct(value) {
      if (typeof value !== "number" || Number.isNaN(value)) return "0%";
      return value + "%";
    }

    function statusPill(status) {
      const cls = "status-" + String(status || "not_started");
      return `<span class="pill ${cls}">${status || "unknown"}</span>`;
    }

    function renderCards(state) {
      const dnaTotals = state?.dna?.totals || {};
      const cards = [
        { label: "Global Completion", value: pct(state?.progress?.global_completion_pct || 0) },
        { label: "DNA Nodes", value: dnaTotals.nodes || 0 },
        { label: "Expressed Files", value: dnaTotals.expressed_files || 0 },
        { label: "Missing Expressed Files", value: (state?.filesystem?.missing_expressed_files || []).length },
        { label: "Seed Words", value: state?.seed?.word_count || 0 },
        { label: "Engine Status", value: state?.engine?.status || "unknown" }
      ];
      const root = document.getElementById("top-cards");
      root.innerHTML = cards.map((c) => `
        <div class="card">
          <div class="label">${c.label}</div>
          <div class="value">${c.value}</div>
        </div>
      `).join("");
    }

    function renderFolderProgress(state) {
      const folders = state?.progress?.folders || {};
      const entries = Object.entries(folders).sort((a, b) => a[0].localeCompare(b[0]));
      const root = document.getElementById("folder-progress");
      if (entries.length === 0) {
        root.textContent = "No folders tracked yet.";
        return;
      }
      root.innerHTML = entries.map(([id, item]) => `
        <div style="margin-bottom:8px;">
          <strong>${id}</strong> <span style="color:#9aa9d9;">${item.path}</span><br>
          ${item.completed_files}/${item.total_expressed_files} complete (${pct(item.completion_pct)})
        </div>
      `).join("");
    }

    function renderEvents(state) {
      const events = Array.isArray(state?.events) ? state.events.slice(-20).reverse() : [];
      const root = document.getElementById("events");
      if (events.length === 0) {
        root.textContent = "No events yet.";
        return;
      }
      root.innerHTML = events.map((event) => `
        <div style="margin-bottom:8px;">
          <div><strong>${event.type || "event"}</strong> - ${event.message || ""}</div>
          <div style="color:#9aa9d9;">${event.at || ""}</div>
        </div>
      `).join("");
    }

    function renderTrackedFiles(state) {
      const tracked = state?.filesystem?.tracked_files || {};
      const rows = Object.entries(tracked).sort((a, b) => a[0].localeCompare(b[0]));
      const root = document.getElementById("tracked-files");
      if (rows.length === 0) {
        root.textContent = "No tracked files available.";
        return;
      }
      root.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Path</th>
              <th>Status</th>
              <th>Words</th>
              <th>Expressed</th>
              <th>Exists</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(([filePath, item]) => `
              <tr>
                <td>${filePath}</td>
                <td>${statusPill(item.processing_status)}</td>
                <td>${item.word_count || 0}</td>
                <td>${item.expressed ? "true" : "false"}</td>
                <td>${item.exists ? "true" : "false"}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    (function boot() {
      const state = safeReadState();
      const meta = document.getElementById("meta");
      if (state.parse_error) {
        meta.textContent = "State parse error: " + state.parse_error;
        return;
      }
      meta.textContent = `Manifest generated: ${state.generated_at || "not yet"} | Last command: ${state?.engine?.last_command || "n/a"}`;
      renderCards(state);
      renderFolderProgress(state);
      renderEvents(state);
      renderTrackedFiles(state);
    })();
  </script>
</body>
</html>
